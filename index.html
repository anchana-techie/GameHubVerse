}

/* ---- board specifications: cells (polygon, 4 corners, counter-clockwise, y up), players, set-up ---- */
function chSpec2(){
  const cells=[], L="abcdefgh";
  for(let y=0;y<8;y++) for(let x=0;x<8;x++)
    cells.push({gx:x,gy:y,poly:[[x,y],[x+1,y],[x+1,y+1],[x,y+1]],fl:L[x],rk:y+1,label:L[x]+(y+1)});
  const xs=[0,1,2,3,4,5,6,7];
  return {id:2,kind:"grid",cells,promoTypes:[5,4,3,2],
    players:[
      {name:"White",fill:"#eaf9ff",stroke:"#0b1b4a",side:270,back:xs.map(x=>x),fe0:2,setup:"RNBQKBNR"},
      {name:"Black",fill:"#b678ff",stroke:"#1c0a3f",side:90,back:xs.map(x=>56+7-x),fe0:0,setup:"RNBKQBNR"}]};
}
function chSpec4(){
  const cells=[], at={}, L="abcdefghijklmn";
  for(let y=0;y<14;y++) for(let x=0;x<14;x++){
    if((x<3||x>10)&&(y<3||y>10)) continue;
    at[x+","+y]=cells.length;
    cells.push({gx:x,gy:y,poly:[[x,y],[x+1,y],[x+1,y+1],[x,y+1]],fl:L[x],rk:y+1,label:L[x]+(y+1)});
  }
  const r8=[0,1,2,3,4,5,6,7], A=(x,y)=>at[x+","+y];
  return {id:4,kind:"grid",cells,promoTypes:[5],
    promoFn:(p,c)=>{ const q=cells[c]; return p===0?q.gy===7:p===1?q.gx===7:p===2?q.gy===6:q.gx===6; },
    players:[
      {name:"Yellow",fill:"#ffd83d",stroke:"#3a2a00",side:270,back:r8.map(f=>A(3+f,0)),fe0:2,setup:"RNBQKBNR"},
      {name:"Blue",fill:"#3dc4ff",stroke:"#032a4a",side:180,back:r8.map(f=>A(0,10-f)),fe0:1,setup:"RNBQKBNR"},
      {name:"Red",fill:"#ff5c82",stroke:"#470419",side:90,back:r8.map(f=>A(10-f,13)),fe0:0,setup:"RNBQKBNR"},
      {name:"Green",fill:"#4dffa8",stroke:"#05361d",side:0,back:r8.map(f=>A(13,3+f)),fe0:3,setup:"RNBQKBNR"}]};
}
function chSpec3(){
  /* Hexagon of 96 cells = 3 regions of 8x4. Each region is a pentagon (two hexagon corners, two side-midpoints and the
     centre); the 8x4 grid is bent along the centre so the files of neighbouring regions meet along the spokes. */
  const S=Math.sqrt(3)/2, V240=[-0.5,-S], V300=[0.5,-S], O=[0,0], M210=[-0.75,-S/2], M330=[0.75,-S/2];
  const Bf=f=>[V240[0]+(V300[0]-V240[0])*f/8, V240[1]+(V300[1]-V240[1])*f/8];
  const Tf=f=>f<=4?[M210[0]+(O[0]-M210[0])*f/4, M210[1]+(O[1]-M210[1])*f/4]:[O[0]+(M330[0]-O[0])*(f-4)/4, O[1]+(M330[1]-O[1])*(f-4)/4];
  const Pf=(f,r)=>{ const b=Bf(f), t=Tf(f); return [b[0]+(t[0]-b[0])*r/4, b[1]+(t[1]-b[1])*r/4]; };
  const seats=[
    {name:"White",ang:-120,side:150,fill:"#eaf9ff",stroke:"#0b1b4a",L:["L","K","J","I","D","C","B","A"],rk:r=>8-r},
    {name:"Black",ang:120,side:30,fill:"#b678ff",stroke:"#1c0a3f",L:["H","G","F","E","I","J","K","L"],rk:r=>12-r},
    {name:"Red",ang:0,side:270,fill:"#ff5c82",stroke:"#470419",L:["A","B","C","D","E","F","G","H"],rk:r=>r+1}];
  const cells=[];
  seats.forEach((s,si)=>{
    const a=s.ang*Math.PI/180, co=Math.cos(a), sn=Math.sin(a), rot=p=>[p[0]*co-p[1]*sn, p[0]*sn+p[1]*co];
    for(let r=0;r<4;r++) for(let f=0;f<8;f++)
      cells.push({poly:[Pf(f,r),Pf(f+1,r),Pf(f+1,r+1),Pf(f,r+1)].map(rot),fl:s.L[f],rk:s.rk(r),label:s.L[f]+s.rk(r)});
  });
  const r8=[0,1,2,3,4,5,6,7];
  return {id:3,kind:"hex",cells,promoTypes:[5,4,3,2],
    players:seats.map((s,si)=>({name:s.name,fill:s.fill,stroke:s.stroke,side:s.side,back:r8.map(f=>si*32+f),fe0:2,setup:"RNBQKBNR"}))};
}

/* ---- mesh -> move tables ---- */
function chBuild(id){
  const sp=id===2?chSpec2():id===3?chSpec3():chSpec4();
  const cells=sp.cells, N=cells.length, np=sp.players.length;
  const kf=v=>String(Math.round(v*1e4)||0);
  const vk=cells.map(c=>c.poly.map(p=>kf(p[0])+","+kf(p[1])));
  const vmap=new Map(), emap=new Map(), ek=(a,b)=>a<b?a+"|"+b:b+"|"+a;
  for(let i=0;i<N;i++) for(let j=0;j<4;j++){
    const k=vk[i][j]; if(!vmap.has(k)) vmap.set(k,[]); vmap.get(k).push([i,j]);
    const e=ek(k,vk[i][(j+1)%4]); if(!emap.has(e)) emap.set(e,[]); emap.get(e).push([i,j]);
  }
  const eN=[], eI=[];
  for(let i=0;i<N;i++){ eN.push([-1,-1,-1,-1]); eI.push([-1,-1,-1,-1]); }
  for(const l of emap.values()){
    if(l.length===2){ const a=l[0], b=l[1]; eN[a[0]][a[1]]=b[0]; eI[a[0]][a[1]]=b[1]; eN[b[0]][b[1]]=a[0]; eI[b[0]][b[1]]=a[1]; }
    else if(l.length>2) throw new Error("bad mesh");
  }
  // straight lines: cross an edge, leave through the opposite edge
  const orth=[];
  for(let c=0;c<N;c++){
    const rays=[];
    for(let i=0;i<4;i++){
      const r=[]; let cur=c, e=i, g=0;
      while(g++<40){ const n=eN[cur][e]; if(n<0) break; r.push(n); e=(eI[cur][e]+2)%4; cur=n; }
      if(r.length) rays.push(r);
    }
    orth.push(rays);
  }
  // diagonals: cross a corner into a cell that only touches it, leave through the opposite corner (at the hexagon centre it branches)
  const diag=[];
  const dtrace=(c,j,acc,out)=>{
    let found=false;
    for(const [d,jj] of vmap.get(vk[c][j])){
      if(d===c||eN[c].includes(d)||acc.includes(d)) continue;
      found=true; dtrace(d,(jj+2)%4,acc.concat(d),out);
    }
    if(!found&&acc.length) out.push(acc);
  };
  for(let c=0;c<N;c++){ const out=[]; for(let j=0;j<4;j++) dtrace(c,j,[],out); diag.push(out); }
  // king: every cell that touches this one
  const king=[];
  for(let c=0;c<N;c++){
    const s=new Set();
    for(let j=0;j<4;j++) for(const [d] of vmap.get(vk[c][j])) if(d!==c) s.add(d);
    king.push([...s]);
  }
  // knight
  const knight=[];
  if(sp.kind==="grid"){
    const at=new Map(); cells.forEach((c,i)=>at.set(c.gx+","+c.gy,i));
    const D=[[1,2],[2,1],[2,-1],[1,-2],[-1,-2],[-2,-1],[-2,1],[-1,2]];
    for(let c=0;c<N;c++){ const q=cells[c], l=[]; for(const [dx,dy] of D){ const n=at.get((q.gx+dx)+","+(q.gy+dy)); if(n!==undefined) l.push(n); } knight.push(l); }
  } else {
    for(let c=0;c<N;c++){
      const set=new Set();
      for(let i=0;i<4;i++){
        const n1=eN[c][i]; if(n1<0) continue; const in1=eI[c][i];
        const e2=(in1+2)%4, n2=eN[n1][e2];
        if(n2>=0){ const in2=eI[n1][e2]; for(const s of [1,3]){ const n3=eN[n2][(in2+s)%4]; if(n3>=0&&n3!==c) set.add(n3); } }
        for(const s of [1,3]){
          const e=(in1+s)%4, m1=eN[n1][e]; if(m1<0) continue;
          const m2=eN[m1][(eI[n1][e]+2)%4]; if(m2>=0&&m2!==c) set.add(m2);
        }
      }
      knight.push([...set]);
    }
  }
  // pawns: forward direction travels along each file strip; side cells inherit it ("parallel transport")
  const fwd=[], dbl=[], cap=[], atk=[], promo=[], players=sp.players;
  players.forEach((pl,p)=>{
    const fe=new Array(N).fill(-1), q=[];
    pl.back.forEach(b=>{ fe[b]=pl.fe0; q.push(b); });
    for(let h=0;h<q.length;h++){
      const c=q[h], e=fe[c], n=eN[c][e];
      if(n>=0&&fe[n]<0){ fe[n]=(eI[c][e]+2)%4; q.push(n); }
      for(const s of [1,3]){
        const se=(e+s)%4, m=eN[c][se];
        if(m>=0&&fe[m]<0){ const j=eI[c][se]; fe[m]=s===1?(j+1)%4:(j+3)%4; q.push(m); }
      }
    }
    const F=new Array(N).fill(-1), D=new Array(N).fill(-1), C=[], A=[], PM=new Array(N).fill(false);
    for(let c=0;c<N;c++) { C.push([]); A.push([]); }
    for(let c=0;c<N;c++) if(fe[c]>=0) F[c]=eN[c][fe[c]];
    pl.start=pl.back.map(b=>F[b]);
    pl.start.forEach(s=>{ if(s>=0&&F[s]>=0) D[s]=F[F[s]]; });
    for(let c=0;c<N;c++){
      if(fe[c]<0||F[c]<0) continue;
      const n=F[c], ent=eI[c][fe[c]];
      for(const s of [1,3]){ const t=eN[n][(ent+s)%4]; if(t>=0){ C[c].push(t); A[t].push(c); } }
    }
    for(let c=0;c<N;c++) PM[c]=sp.promoFn?sp.promoFn(p,c):(F[c]<0);
    fwd.push(F); dbl.push(D); cap.push(C); atk.push(A); promo.push(PM);
  });
  // castling: king steps two cells toward a corner rook, the rook lands on the cell the king crossed
  const castle=[], kidx=[], crCell=new Array(N).fill(null);
  players.forEach((pl,p)=>{
    const ki=pl.setup.indexOf("K"); kidx.push(ki); const list=[];
    [[0,1],[7,2]].forEach(([ri,bit])=>{
      const dir=ri<ki?-1:1, empty=[];
      for(let i=ki+dir;i!==ri;i+=dir) empty.push(pl.back[i]);
      list.push({bit,rc:pl.back[ri],mid:pl.back[ki+dir],kt:pl.back[ki+2*dir],empty,short:empty.length<=2});
      const rc=pl.back[ri]; (crCell[rc]||(crCell[rc]=[])).push([p,bit]);
    });
    castle.push(list);
  });
  // two-colouring of the squares (cell 0 dark)
  const col=new Array(N).fill(-1); col[0]=0; const qq=[0];
  for(let h=0;h<qq.length;h++){ const c=qq[h]; for(const n of eN[c]) if(n>=0&&col[n]<0){ col[n]=1-col[c]; qq.push(n); } }
  return {id,N,np,kind:sp.kind,cells,players,eN,eI,orth,diag,king,knight,fwd,dbl,cap,atk,promo,castle,kidx,crCell,col,
    promoTypes:sp.promoTypes,dead:id===4,ep:id===2};
}

/* ---- position ---- */
function chPos(id){
  const B=chBoard(id), N=B.N;
  const P={B,id,np:B.np,T:new Int8Array(N),O:new Int8Array(N).fill(-1),PR:new Uint8Array(N),
    alive:B.players.map(()=>true),turn:0,cr:new Uint8Array(B.np),kc:new Int16Array(B.np).fill(-1),
    epT:-1,epP:-1,epO:-1,half:0,ply:0,pts:B.players.map(()=>0)};
  B.players.forEach((pl,p)=>{
    pl.setup.split("").forEach((ch,f)=>{ const c=pl.back[f], t="PNBRQK".indexOf(ch)+1; P.T[c]=t; P.O[c]=p; if(t===6) P.kc[p]=c; });
    pl.start.forEach(c=>{ P.T[c]=1; P.O[c]=p; });
    P.cr[p]=3;
  });
  return P;
}
function chClone(P){
  return Object.assign({},P,{T:P.T.slice(),O:P.O.slice(),PR:P.PR.slice(),alive:P.alive.slice(),cr:P.cr.slice(),kc:P.kc.slice(),pts:P.pts.slice()});
}
const chNextAlive=(P,p)=>{ for(let k=1;k<=P.np;k++){ const q=(p+k)%P.np; if(P.alive[q]) return q; } return p; };

/* ---- attacks: is square x attacked by any living opponent of p? (out[] collects the attackers' seats) ---- */
function chAtk(P,x,p,out){
  const B=P.B,T=P.T,O=P.O;
  const live=d=>{ const o=O[d]; return o>=0&&o<CH_DEAD&&o!==p; };
  let hit=false; const add=o=>{ hit=true; if(out&&!out.includes(o)) out.push(o); return !out; };
  for(const d of B.knight[x]) if(T[d]===2&&live(d)&&add(O[d])) return true;
  for(const d of B.king[x]) if(T[d]===6&&live(d)&&add(O[d])) return true;
  for(const r of B.orth[x]) for(const d of r){ if(T[d]===0) continue; if((T[d]===4||T[d]===5)&&live(d)&&add(O[d])) return true; break; }
  for(const r of B.diag[x]) for(const d of r){ if(T[d]===0) continue; if((T[d]===3||T[d]===5)&&live(d)&&add(O[d])) return true; break; }
  for(let q=0;q<B.np;q++){ if(q===p||!P.alive[q]) continue; for(const d of B.atk[q][x]) if(T[d]===1&&O[d]===q&&add(q)) return true; }
  return hit;
}
const chAttacked=(P,x,p)=>chAtk(P,x,p,null);

/* ---- move generation ---- */
const chCapOK=(P,d,p)=>{ const o=P.O[d]; return o>=0&&o!==p&&(P.T[d]!==6||o===CH_DEAD); };
function chPseudo(P,p){
  const B=P.B,T=P.T,O=P.O,out=[],seen=new Int32Array(B.N); let stamp=0;
  for(let c=0;c<B.N;c++){
    if(O[c]!==p) continue;
    const t=T[c];
    if(t===1){
      const f=B.fwd[p][c];
      const add=(to,k)=>{
        if(B.promo[p][to]) for(const pr of B.promoTypes) out.push({f:c,t:to,pr,k});
        else out.push({f:c,t:to,pr:0,k});
      };
      if(f>=0&&T[f]===0){
        add(f,0);
        const d2=B.dbl[p][c]; if(d2>=0&&T[d2]===0) out.push({f:c,t:d2,pr:0,k:1});
      }
      for(const d of B.cap[p][c]){
        if(chCapOK(P,d,p)) add(d,0);
        else if(B.ep&&d===P.epT&&P.epO!==p&&P.epP>=0&&T[P.epP]===1&&T[d]===0) out.push({f:c,t:d,pr:0,k:2});
      }
    } else if(t===2){
      for(const d of B.knight[c]) if(T[d]===0||chCapOK(P,d,p)) out.push({f:c,t:d,pr:0,k:0});
    } else if(t===6){
      for(const d of B.king[c]) if(T[d]===0||chCapOK(P,d,p)) out.push({f:c,t:d,pr:0,k:0});
      if(P.cr[p]&&c===B.players[p].back[B.kidx[p]]){
        for(const cs of B.castle[p]){
          if(!(P.cr[p]&cs.bit)||!(T[cs.rc]===4&&O[cs.rc]===p)) continue;
          let ok=true; for(const e of cs.empty) if(T[e]!==0){ ok=false; break; }
          if(!ok||chAttacked(P,c,p)||chAttacked(P,cs.mid,p)||chAttacked(P,cs.kt,p)) continue;
          out.push({f:c,t:cs.kt,pr:0,k:3,rf:cs.rc,rt:cs.mid,short:cs.short});
        }
      }
    } else {
      stamp++;

        for(const r of rays) for(const d of r){
          if(T[d]===0){ if(seen[d]!==stamp){ seen[d]=stamp; out.push({f:c,t:d,pr:0,k:0}); } continue; }
          if(chCapOK(P,d,p)&&seen[d]!==stamp){ seen[d]=stamp; out.push({f:c,t:d,pr:0,k:0}); }
          break;

      if(t===4||t===5) slide(B.orth[c]);
      if(t===3||t===5) slide(B.diag[c]);

}
function chMake(P,m){
  const T=P.T,O=P.O,PR=P.PR,B=P.B,f=m.f,t=m.t,p=O[f];
  const u={m,p,fT:T[f],fPR:PR[f],cT:T[t],cO:O[t],cPR:PR[t],cr:P.cr.slice(),epT:P.epT,epP:P.epP,epO:P.epO,half:P.half,kc:P.kc[p],epc:null,rf:null,rt:null};
  if(m.k===2){ const e=P.epP; u.epc=[e,T[e],O[e],PR[e]]; T[e]=0; O[e]=-1; PR[e]=0; }
  const was=PR[f];

  T[f]=0; O[f]=-1; PR[f]=0;

    u.rf=[m.rf,T[m.rf],O[m.rf],PR[m.rf]]; u.rt=[m.rt,T[m.rt],O[m.rt],PR[m.rt]];
    T[m.rt]=T[m.rf]; O[m.rt]=O[m.rf]; PR[m.rt]=PR[m.rf]; T[m.rf]=0; O[m.rf]=-1; PR[m.rf]=0;
  }
  if(u.fT===6){ P.kc[p]=t; P.cr[p]=0; }
  let l=B.crCell[f]; if(l) for(const [q,b] of l) P.cr[q]&=~b;
  l=B.crCell[t]; if(l) for(const [q,b] of l) P.cr[q]&=~b;
  P.epT=-1; P.epP=-1; P.epO=-1;
  if(m.k===1&&B.ep){ P.epT=B.fwd[p][f]; P.epP=t; P.epO=p; }
  P.half=(u.fT===1||u.cT||m.k===2)?0:P.half+1;
  return u;

function chUnmake(P,u){

const CH_V=[0,100,320,330,500,900,0];

/* ---- leaving / cleanup ---- */
/* Popups live in their own persistent #overlay root (outside #app), so a re-render of the page can never
   swallow a click, and the page-level click handler can't be blocked by the dialog. */
let _ovKey="", _ovModal=false;
function showModal(m){ S.modal=m; renderOverlay(); }
function closeModal(){ S.modal=null; renderOverlay(); }
function renderOverlay(){
  const ov=$("overlay"); if(!ov||!S) return;
  const m=S.modal, t=S.toast;
  const key=JSON.stringify([m&&[m.title,m.text,m.ok,!!m.danger],t&&[t.type,t.text]]);
  if(key!==_ovKey){
    _ovKey=key;
    ov.innerHTML=(t?`<div class="msg toast ${esc(t.type)}" role="status" data-m="toast">${esc(t.text)}</div>`:"")+
      (m?`<div class="modal-back" id="modalBack"><div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="modalTitle" aria-describedby="modalText">
        <h3 id="modalTitle">${esc(m.title)}</h3><p id="modalText">${esc(m.text)}</p>
        <div class="btns"><button type="button" class="btn secondary" id="modalNo" data-m="no">${esc(m.cancel||"Cancel")}</button>
        <button type="button" class="btn ${m.danger?"danger":"green"}" id="modalYes" data-m="yes">${esc(m.ok)}</button></div></div></div>`:"");
  }
  if(m&&!_ovModal){ const y=$("modalYes"); if(y) y.focus(); }
  _ovModal=!!m;
}
function modalYes(){
  const m=S.modal||{}, a=m.act; S.modal=null; renderOverlay();
  if(a==="exitgame") sendAct({a:"tolobby"});
  else if(a==="kick"&&m.pid) sendAct({a:"kick",pid:m.pid});
  else if(a==="chresign") sendAct({a:"resign"});
  else if(a==="closeroom") leaveRoom(true);
  else if(a==="leaveroom") leaveRoom(true);
}
function onOverlayClick(e){
  const b=e.target.closest("[data-m]");
  if(b){
    if(b.dataset.m==="yes") modalYes();
    else if(b.dataset.m==="no") closeModal();
    else if(b.dataset.m==="toast"){ S.toast=null; renderOverlay(); }
    return;
  }
  if(e.target.id==="modalBack") closeModal();            // click on the dark backdrop = cancel
}
function onOverlayKey(e){
  if(!S.modal) return;
  if(e.key==="Escape"){ e.preventDefault(); closeModal(); }
  else if(e.key==="Tab"){                                  // keep keyboard focus inside the dialog
    const a=$("modalNo"), b=$("modalYes"); if(!a||!b) return;
    if(e.shiftKey&&document.activeElement===a){ e.preventDefault(); b.focus(); }
    else if(!e.shiftKey&&document.activeElement===b){ e.preventDefault(); a.focus(); }
    else if(document.activeElement!==a&&document.activeElement!==b){ e.preventDefault(); b.focus(); }
  }
}
function leaveRoom(force){
  if(NET.role==="host"){
    if(!force) return showModal(NET.local?{title:"Leave this game?",text:"Your offline game on this device will end.",ok:"Leave",danger:true,act:"closeroom"}:{title:"Close the room?",text:"This closes the room for everyone and disconnects all players.",ok:"Close room",danger:true,act:"closeroom"});
    Object.values(NET.conns).forEach(c=>{ try{ c.send({t:"closed"}); }catch(e){} });
  } else {
    if(!force) return showModal({title:"Leave the room?",text:"You will be removed from the room. You can rejoin later with the room code while the room is still open.",ok:"Leave room",danger:true,act:"leaveroom"});
    NET.leaving=true; try{ NET.hostConn.send({t:"leave"}); }catch(e){}
  }
  setTimeout(()=>cleanup(),250);
}
function cleanup(notice){
  clearInterval(NET.timer);
  try{ Object.values(NET.conns).forEach(c=>c.close()); }catch(e){}
  try{ NET.hostConn&&NET.hostConn.close(); }catch(e){}
  try{ NET.peer&&NET.peer.destroy(); }catch(e){}
  Object.assign(NET,{peer:null,role:null,code:"",conns:{},hostConn:null,R:null,timer:null,leaving:false,settled:false,local:false,abortJoin:null});
  clearSession();
  S=freshState(); if(notice) S.notice=notice;
  padClear(); render();
}

  const u=location.origin+location.pathname+"?room="+NET.code;
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(u).then(()=>toast("Invite link copied!","ok"),()=>toast(u,"info"));
  else toast(u,"info");
}

const EMAIL_RE=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;
function derangement(n){
  const idx=[...Array(n).keys()];
  do{
    for(let i=n-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [idx[i],idx[j]]=[idx[j],idx[i]]; }
  }while(idx.some((v,i)=>v===i));
  return idx;
}

  const x=S.xm, names=[], emails=[];

}

async function emailSend({to_email,to_name,subject,value,html,text}){
  const c=xmCfg();
  const res=await fetch("https://api.emailjs.com/api/v1.0/email/send",{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({service_id:c.service,template_id:c.template,user_id:c.key,template_params:{
      to_email,to_name,subject,christ_child_name:value,message_html:html,message:text}})
  });
  if(!res.ok) throw new Error((await res.text())||res.status);
}

async function xmRun(onlyFailed){

  }

  let h=`<div class="topbar"><h1 class="title">${GTITLE[v.game]}</h1><div style="display:flex;gap:8px;flex-wrap:wrap">
    ${NET.local?"":`<button class="btn secondary" data-a="copyLink">🔗 Invite link</button>`}
    ${host&&v.phase==="play"?`<button class="btn secondary" data-a="exitgame">⏹ Exit game (keep room)</button>`:""}
    <button class="btn secondary" data-a="leave">${host?(NET.local?"🏠 Leave game":"✖ Close room"):"🚪 Leave room"}</button></div></div>`;
  h+=`<div class="card2" style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
    ${NET.local?`<div><div class="mut" style="font-size:.8rem">Offline game</div><div class="code" style="font-size:1.2rem;letter-spacing:.04em">📴 This device only</div></div>`:`<div><div class="mut" style="font-size:.8rem">Room code</div><div class="code">${esc(v.code)}</div></div>`}
    <div class="scoreboard" style="margin:0">${v.players.map(p=>`<span class="chip ${p.connected?"":"off"} ${p.left?"gone":""}">${p.av} ${esc(p.name)}${p.pid===v.hostPid?" 👑":""}${p.pid===v.me?" (you)":""}${p.left?" · left":!p.connected?" · offline":""}${kickBtn(v,p)}</span>`).join("")}</div></div>`;
  if(v.phase==="lobby") return h+lobbyHTML(v,host);
  if(v.phase==="end") return h+endHTML(v,host);
  return h+(v.game==="spy"?spyGameHTML(v):v.game==="number"?numGameHTML(v):v.game==="Scribblio"?"":v.game==="chess"?chessGameHTML(v):rrGameHTML(v));
}
const kickBtn=(v,p)=>v.me===v.hostPid&&p.pid!==v.hostPid&&!p.left&&!NET.local?`<button type="button" class="kick" data-a="kick" data-pid="${esc(p.pid)}" title="Kick ${esc(p.name)} from the room" aria-label="Kick ${esc(p.name)}">✖</button>`:"";
function lobbyHTML(v,host){
  const st=v.settings, n=v.players.filter(p=>!p.left).length, fields=SETTINGS[v.game].filter(f=>!f.when||f.when(n,st));
  let h="";
  if(v.msg) h+=`<div class="msg warn">${esc(v.msg)}</div>`;
  h+=`<p class="mut" style="margin:14px 0 0">${esc(BLURB[v.game])}</p>${v.game==="chess"?`<div class="msg info" style="margin-top:12px">♟️ <b>${st.players==3?"3 seats – hexagon board, last king standing":st.players==4?"4 seats – cross board, points for captures and checkmates":"2 seats – classic 8×8 chess"}</b> · ${n} human${n===1?"":"s"}${st.players>n?` + ${st.players-n} computer${st.players-n===1?"":"s"}`:""}<br><span class="mut">The host picks the number of players. Seats nobody joins are played by the computer.</span></div>`:""}<h3 style="margin-top:18px">⚙️ Room settings</h3>`;
  if(v.game==="chess") h+=`<div style="margin-top:10px"><span class="mut">Colour set chosen by the host:</span>${chThemePreviewHTML(st.theme,st.players)}</div>`;
  if(host){
    h+=`<div class="sgrid">${fields.map(f=>{
      const opts=typeof f.o==="function"?f.o(MAXP[v.game]):f.o;
      return `<div><label>${esc(f.l)}</label><select data-set="${f.k}">${opts.map(o=>{
        const val=Array.isArray(o)?o[0]:o;
        return `<option value="${esc(val)}" ${String(st[f.k])===String(val)?"selected":""}>${esc(optLabel(o))}</option>`;}).join("")}</select></div>`;
    }).join("")}</div>`;
    if(v.game==="spy"&&st.src==="custom"){
      h+=`<div class="row"><div><label>Civilians' word</label><input type="text" id="spyCiv" data-keep maxlength="30" autocomplete="off" value="${esc(S.ui.spyCiv||"")}"></div>
        ${st.mode==="diff"?`<div><label>Spy's word</label><input type="text" id="spyW" data-keep maxlength="30" autocomplete="off" value="${esc(S.ui.spyW||"")}"></div>`:""}</div>
        <div class="mut" style="font-size:.82rem;margin-top:6px">Custom words are reused in every round – use random pairs if you play several rounds.</div>`;
    }
    if(v.game==="Scribblio"&&st.src==="custom"){
      h+=`<label>Your words (separated by commas)</label><input type="text" id="skWords" data-keep maxlength="600" autocomplete="off" placeholder="e.g. rocket, giraffe, pizza, bicycle, ice cream" value="${esc(S.ui.skWords||"")}">
        <div class="mut" style="font-size:.82rem;margin-top:6px">${st.wordChoice>1?"Add at least 3 words – the drawer picks one of 3. ":""}Words are used in random order and not repeated until the list is used up.</div>`;
    }
    const need=MINP[v.game], ok=n>=need;
    h+=`<button class="btn green block" style="margin-top:18px" data-a="start" ${ok?"":"disabled"}>▶ Start game</button>
      <div class="mut" style="font-size:.85rem;margin-top:6px">${ok?(NET.local?"Offline game – only you, on this device.":`${n} player${n>1?"s":""} in the room. Others can still join with the code until you start.`):`Need at least ${need} players to start (${n} in the room). Share the code or invite link!`}</div>`;
  } else {
    h+=`<div class="scoreboard">${fields.map(f=>{
      const opts=typeof f.o==="function"?f.o(MAXP[v.game]):f.o;
      const hit=opts.find(o=>String(Array.isArray(o)?o[0]:o)===String(st[f.k]));
      return `<span class="chip">${esc(f.l)}: <b>${esc(hit!==undefined?optLabel(hit):st[f.k])}</b></span>`;}).join("")}</div>
      <div class="msg info" style="margin-top:16px">⏳ Waiting for the host to start the game…</div>`;
  }
  return h;
}
function endHTML(v,host){
  const rows=v.players.map(p=>[p,v.scores[p.pid]||0]), max=Math.max(0,...rows.map(r=>r[1]));
  const winners=rows.filter(r=>r[1]===max&&max>0).map(r=>r[0]);
  let h=`<h3 style="margin-top:18px">🏁 Game over</h3>`;
  h+=winners.length
    ?`<div class="msg ok" style="font-size:1.1rem">🏆 ${winners.map(p=>p.av+" <b>"+esc(p.name)+"</b>").join(", ")} ${winners.length>1?"win":"wins"} with ${max} points! 🎉</div>`
    :`<div class="msg info">No points were scored.</div>`;
  h+=boardHTML({players:v.players,scores:v.scores,g:null});
  h+=host?`<button class="btn green block" style="margin-top:14px" data-a="act" data-x="tolobby">🔁 Back to lobby (change settings / play again)</button>`
    :`<div class="msg info" style="margin-top:14px">⏳ Waiting for the host to go back to the lobby…</div>`;
  return h;
}

/* ---- Spy ---- */
function cluesHTML(v,g){
  const n=Math.max(0,...g.ids.map(p=>g.clues[p].length));
  if(!n) return `<div class="mut">No clues yet – the first clue starts the sheet.</div>`;
  let h=`<div class="cs">`;
  for(let r=0;r<n;r++){
    h+=`<div class="cs-round"><div class="cs-title">Round ${r+1}</div><div class="cs-chips">`+g.ids.map((p,i)=>{
      const c=g.clues[p][r]; if(c===undefined) return "";
      const skip=c==="—"||c==="⏱ (no clue)";
      return `<span class="cs-chip ${skip?"skip":""} ${g.elim&&g.elim[p]?"out":""}"><span class="cs-no">${i+1}</span>${pAv(v,p)} <b>${esc(pName(v,p))}</b>${skip?`<i>${c==="—"?"skipped":"no clue"}</i>`:`<span class="cs-txt">${esc(c)}</span>`}</span>`;
    }).join("")+`</div></div>`;
  }
  return h+`</div>`;
}
function spyChatHTML(v){
  const g=v.g, me=v.me, out=!!(g.elim&&g.elim[me]), cur=g.ids[g.turn];
  let h=`<div class="chat"><div class="chat-h">💬 Clue chat</div><div class="chat-log" id="chatLog">`;
  if(!g.log.length) h+=`<div class="chat-sys">Clues will appear here as players give them.</div>`;
  h+=g.log.map(m=>m.k==="sys"?`<div class="chat-sys">${esc(m.text)}</div>`
    :`<div class="chat-row ${m.pid===me?"mine":""}"><div class="chat-av">${pAv(v,m.pid)}</div><div class="chat-body"><div class="chat-nm">${esc(pName(v,m.pid))}${m.pid===me?" (you)":""} <span>round ${m.cyc}</span></div><div class="chat-bub">${esc(m.text)}</div></div></div>`).join("");
  h+=`</div><div class="chat-in">`;
  if(g.phase==="clues"){
    if(out) h+=`<div class="mut">❌ You're eliminated – watching only.</div>`;
    else if(cur===me) h+=`<div class="chat-turn">🎤 <b>Your turn!</b> Give a clue <span class="mut">(not your word)</span></div>
      <div class="guess-row"><input type="text" id="spyClue" data-keep maxlength="40" placeholder="Type your clue…" autocomplete="off" style="font-size:1rem;letter-spacing:normal"><button class="btn" data-a="clue">Send</button></div>`;
    else h+=`<div class="mut">⏳ Waiting for ${pAv(v,cur)} <b>${esc(pName(v,cur))}</b>…</div>`;
  } else if(g.phase==="vote") h+=`<div class="mut">🗳️ Voting in progress…</div>`;
  else h+=`<div class="mut">🔓 Round over.</div>`;
  return h+`</div></div>`;
}function votesListHTML(v,g,votes,roles){
  const ids=g.ids.filter(p=>votes[p]);
  if(!ids.length) return `<div class="mut">No votes were cast.</div>`;
  return ids.map(p=>{
    const t=votes[p];
    return `<div class="xm-status"><span><b>${esc(pName(v,p))}</b> voted for <b>${esc(pName(v,t))}</b></span><span>${roles?(roles[t]==="spy"?"✅ Spy":"❌ Civilian"):""}</span></div>`;
  }).join("");
}
function spyGameHTML(v){
  const g=v.g, st=v.settings, me=v.me, host=me===v.hostPid;
  const out=p=>!!(g.elim&&g.elim[p]);
  let h=`<div class="scoreboard"><span class="chip">Round ${v.round}/${st.rounds}</span>${
    g.phase==="clues"?`<span class="chip">🗣️ Clue cycle ${g.cyc}</span>`:g.phase==="vote"?`<span class="chip">🗳️ Voting</span>`:`<span class="chip">🔓 Reveal</span>`}${timerHTML(g.phase==="reveal"?0:g.deadline)}</div>`;
  if(g.phase!=="reveal"){
    h+=`<div class="msg info" style="margin-top:12px">${g.my.knowsSpy
      ?(g.my.word?`You are the <span class="pink">SPY</span> 🕵️ – your word: <span class="pink" style="font-size:1.3rem">${esc(g.my.word)}</span>`:`You are the <span class="pink">SPY</span> 🕵️ – you have no word. Listen closely and bluff!`)
      :`You are a <span class="pink">CIVILIAN</span> 🙂 – your word: <span class="pink" style="font-size:1.3rem">${esc(g.my.word||"")}</span>`}</div>`;
  }
  if(g.phase==="clues"){
    const cur=g.ids[g.turn];
    h+=`<div class="scoreboard">${g.ids.map(p=>`<span class="chip ${p===cur?"active":""} ${out(p)||pObj(v,p).left?"gone":""}">${out(p)?"❌ ":""}${pAv(v,p)} ${esc(pName(v,p))} · ${g.clues[p].length}</span>`).join("")}</div>`;
    if(g.last){
      const L=g.last;
      h+=`<div class="msg warn">🗳️ <b>Last vote:</b> ${L.eliminated
        ?`${pAv(v,L.eliminated)} <b>${esc(pName(v,L.eliminated))}</b> was voted out – they were a <b>civilian</b>! They can no longer give clues or vote. The spy is still among you…`
        :`It was a tie (or nobody voted) – nobody was eliminated.`}</div>`;
    }
    if(out(me)){
      h+=`<div class="msg err">❌ You have been eliminated. You can keep watching, but you can't give clues or vote.</div>`;
    } else {
      if(cur===me){
        h+=`<div class="msg ok">🎤 <b>Your turn!</b> Type your clue in the chat ➜</div>`;
      } else h+=`<div class="msg info">⏳ Waiting for ${pAv(v,cur)} <b>${esc(pName(v,cur))}</b> to give a clue…</div>`;
      h+=`<button class="btn danger block" style="margin-top:10px" data-a="callvote">🗳️ Voting Needed – I think I found the spy!</button>
        <div class="mut" style="font-size:.82rem;margin-top:4px">Starts a vote for everyone${st.voteTime?` (${Math.round(st.voteTime)} sec)`:" (no time limit)"}. Most votes is out.</div>`;
    }
    h+=`<h3 style="margin-top:20px">📋 Clue sheet</h3>${cluesHTML(v,g)}`;
  } else if(g.phase==="vote"){
    h+=`<div class="msg warn" style="margin-top:12px">🗳️ ${g.caller?`${pAv(v,g.caller)} <b>${esc(pName(v,g.caller))}</b> called for a vote!`:"A vote was called!"} Who is the spy?</div>`;
    h+=`<h3 style="margin-top:12px">📋 Clue sheet</h3>${cluesHTML(v,g)}<h3 style="margin-top:20px">🗳️ Cast your vote</h3>`;
    if(out(me)) h+=`<div class="msg err">❌ You have been eliminated and can't vote. Watch the others decide…</div>`;
    else if(!g.locked[me]){
      h+=`<div class="msg info">Choose privately, then lock your vote.</div>
        <select id="voteSel" data-keep><option value="">Select a player…</option>${
          g.ids.filter(p=>p!==me&&!out(p)&&!pObj(v,p).left).map(p=>`<option value="${esc(p)}">${pAv(v,p)} ${esc(pName(v,p))}</option>`).join("")}</select>
        <button class="btn green block" style="margin-top:12px" data-a="vote">🔒 Lock vote</button>`;
    } else h+=`<div class="msg ok">✅ Your vote is locked. Waiting for the others…</div>`;
    h+=`<div class="scoreboard">${g.ids.filter(p=>!out(p)&&!pObj(v,p).left).map(p=>`<span class="chip">${g.locked[p]?"✅":"⏳"} ${esc(pName(v,p))}</span>`).join("")}</div>`;
  } else {
    const r=g.res;
    h+=r.caught
      ?`<div class="msg ok" style="margin-top:12px;font-size:1.05rem">🏆 The group caught the spy: ${pAv(v,r.top)} <b>${esc(pName(v,r.top))}</b>! Civilians win! 🎉</div>`
      :`<div class="msg warn" style="margin-top:12px;font-size:1.05rem">🕵️ The spy survived until only ${g.ids.filter(p=>!out(p)&&!pObj(v,p).left).length} players were left. <b>The spy wins this round!</b> <span class="mut">(+3 for the spy)</span></div>`;
    h+=`<div class="msg warn"><b>🔓 Reveal</b><br>Civilians' word: <span class="pink">${esc(r.civ)}</span> · Spy's word: <span class="pink">${r.spy===null?"none (no word)":esc(r.spy)}</span>
      <div style="margin-top:8px">${g.ids.map(p=>`<div>${r.roles[p]==="spy"?"🕵️":"🙂"} <b>${esc(pName(v,p))}</b> – ${r.roles[p]==="spy"?"SPY":"Civilian"}${out(p)?" (voted out)":""}</div>`).join("")}</div></div>`;
    h+=`<h3>📋 Clue sheet</h3>${cluesHTML(v,g)}<h3 style="margin-top:20px">🗳️ Final vote</h3>${votesListHTML(v,g,r.votes||{},r.roles)}`;
    h+=boardHTML(v)+nextControls(v,host);
  }
  return h;
}

/* ---- Number ---- */

  let h=`<div class="scoreboard"><span class="chip">Round ${v.round}/${st.rounds}</span><span class="chip">${d} digits</span>${timerHTML(g.phase==="play"?g.deadline:0)}</div>`;
  h+=`<div class="scoreboard">${g.ids.map(p=>`<span class="chip ${p===cur&&g.phase==="play"?"active":""} ${pObj(v,p).left?"gone":""}">${pAv(v,p)} ${esc(pName(v,p))} · ${g.attempts[p]}${st.maxAttempts?"/"+st.maxAttempts:""}</span>`).join("")}</div>`;
  if(g.phase==="play"){
    if(cur===me){
      h+=`<div class="msg ok" style="margin-top:12px">${pAv(v,me)} <b>Your turn!</b></div>
        <label>Enter ${d}-digit guess</label>
        <div class="guess-row"><input type="text" id="guess" data-keep inputmode="numeric" maxlength="${d}" autocomplete="off">
        <button class="btn" data-a="guess">Check Result</button></div>`;
    } else h+=`<div class="msg info" style="margin-top:12px">⏳ ${pAv(v,cur)} <b>${esc(pName(v,cur))}'s turn</b></div>`;
  } else {
    const r=g.res;
    h+=r.winner
      ?`<div class="msg ok" style="margin-top:12px;font-size:1.05rem">🎉 ${pAv(v,r.winner)} <b>${esc(pName(v,r.winner))}</b> guessed it: <b>${esc(g.secret)}</b> in ${g.attempts[r.winner]} attempt(s) (+${r.pts[r.winner]} points)!</div>`
      :`<div class="msg warn" style="margin-top:12px;font-size:1.05rem">😶 Nobody found it. The number was <b>${esc(g.secret)}</b>.</div>`;
    h+=boardHTML(v)+nextControls(v,host);
  }
  h+=`<hr><h3>📜 Guess History</h3>${
    g.history.length?`<table class="htable"><thead><tr><th>Name</th><th>Number</th><th>Position</th></tr></thead><tbody>${
      [...g.history].reverse().map(x=>x.timeout
        ?`<tr class="to"><td>${pAv(v,x.pid)} ${esc(pName(v,x.pid))}</td><td colspan="2">⏱ ran out of time</td></tr>`
        :`<tr><td>${pAv(v,x.pid)} ${esc(pName(v,x.pid))}</td><td class="gn">${esc(x.guess)}</td><td><span class="np">${x.N}N</span> <span class="np p">${x.P}P</span></td></tr>`).join("")
    }</tbody></table>`:`<div class="mut">No guesses yet</div>`}`;
  h+=`<hr><h3>🎨 Number Coloring Panel <span class="mut" style="font-size:.8rem;font-weight:400">(just for you)</span></h3><div class="colors">${
    [...Array(10).keys()].map(i=>`<div class="cell"><label>${i}</label>
      <select data-color="${i}">${Object.keys(COLORS).map(c=>`<option ${S.colors[i]===c?"selected":""}>${c}</option>`).join("")}</select>
      <select data-pos="${i}" style="margin-top:6px"><option value="">Pos: –</option>${
        [...Array(d).keys()].map(k=>`<option value="${k+1}" ${String(S.positions[i])===String(k+1)?"selected":""}>Pos ${k+1}</option>`).join("")}</select>
      <div class="num" style="color:${COLORS[S.colors[i]]}">${i}${S.positions[i]?`<span style="font-size:.9rem;color:var(--accent2);margin-left:6px">📍${S.positions[i]}</span>`:""}</div></div>`).join("")}</div>`;
  return h;
}

/* ---- Raja Rani ---- */
function rrGameHTML(v){
  const g=v.g, st=v.settings, me=v.me, host=me===v.hostPid;
  const r=RR_ROLES[g.myRole], isPolice=r.key==="police";
  let h=`<div class="scoreboard"><span class="chip">Round ${v.round}/${st.rounds}</span><span class="chip">${
    g.phase==="roles"?"🎭 Read your role":g.phase==="guess"?"🚓 Police is guessing":g.phase==="locked"?"🔒 Guess locked":"🔓 Reveal"}</span>${timerHTML(g.phase==="guess"?g.deadline:0)}</div>`;
  if(g.phase!=="reveal"){
    h+=`<div class="msg info" style="margin-top:12px">You are the <span class="pink" style="font-size:1.2rem">${esc(rrLabel(r))}</span> – worth <span class="pink">${r.pts}</span> points.${r.hint?`<div style="margin-top:6px">${esc(r.hint)}</div>`:""}</div>`;
    const roles=RR_ROLES.slice(0,g.ids.length).slice().sort((a,b)=>b.pts-a.pts);
    h+=`<div class="mut" style="font-size:.85rem"><b>Roles this round:</b> ${roles.map(x=>`${esc(rrLabel(x))} (${x.pts})`).join(" · ")}</div>`;
  }
  if(g.phase==="roles"){
    h+=host?`<button class="btn green block" style="margin-top:14px" data-a="act" data-x="callpolice">🚓 Call the Police</button>
        <div class="mut" style="font-size:.85rem;margin-top:6px">Press when everyone has read their role.</div>`
      :`<div class="msg info" style="margin-top:14px">⏳ Waiting for the host to call the Police…</div>`;
  } else if(g.phase==="guess"){
    if(isPolice){
      h+=`<div class="msg ok" style="margin-top:14px">🚓 <b>You are the Police!</b> Who do you think is the Thief?</div>
        <select id="rrSel" data-keep><option value="">Select a player…</option>${
          g.ids.filter(p=>p!==me&&!pObj(v,p).left).map(p=>`<option value="${esc(p)}">${pAv(v,p)} ${esc(pName(v,p))}</option>`).join("")}</select>
        <button class="btn green block" style="margin-top:12px" data-a="rrguess">🔒 Lock guess</button>`;
    } else h+=`<div class="msg info" style="margin-top:14px">🚓 The Police is choosing who the Thief is… fingers crossed! 🤞</div>`;
  } else if(g.phase==="locked"){
    h+=host?`<div class="msg ok" style="margin-top:14px">✅ The Police has locked a guess.</div><button class="btn green block" data-a="act" data-x="reveal">🔓 Reveal roles &amp; points</button>`
      :`<div class="msg ok" style="margin-top:14px">✅ The Police has locked a guess. Waiting for the host to reveal…</div>`;
  } else {
    const x=g.res;
    h+=`<h3 style="margin-top:14px">🔓 Reveal</h3>`;
    h+=g.ids.slice().sort((a,b)=>RR_ROLES[x.roles[b]].pts-RR_ROLES[x.roles[a]].pts).map(p=>
      `<div class="xm-status"><span>${esc(rrLabel(RR_ROLES[x.roles[p]]))} – ${pAv(v,p)} <b>${esc(pName(v,p))}</b></span><span>+${x.pts[p]||0}</span></div>`).join("");
    if(x.void) h+=`<div class="msg warn" style="margin-top:14px">⚠️ ${esc(x.why)}</div>`;
    else if(x.ok) h+=`<div class="msg ok" style="margin-top:14px;font-size:1.05rem">✅ Police <b>${esc(pName(v,x.pi))}</b> caught the Thief <b>${esc(pName(v,x.ti))}</b> and keeps ${RR_ROLES[x.roles[x.pi]].pts} points! 🎉</div>`;
    else h+=`<div class="msg warn" style="margin-top:14px;font-size:1.05rem">❌ Police <b>${esc(pName(v,x.pi))}</b> ${x.timeout?"ran out of time":`guessed <b>${esc(pName(v,x.guess))}</b>`}, but the Thief was <b>${esc(pName(v,x.ti))}</b>. The Thief takes the Police's ${RR_ROLES[x.roles[x.pi]].pts} points! 🦹</div>`;

/* ---- Scribblio UI ----
   The Scribblio play screen is built once ("shell") and then patched region by region, so the canvas, the
   chat box (focus, typed text) and an in-progress stroke are never destroyed by incoming updates. */
const SK_COLORS=["#000000","#7f7f7f","#e53935","#fb8c00","#fdd835","#43a047","#00acc1","#1e88e5","#8e24aa","#ec407a","#6d4c41","#c8c8c8"];
const SK_SIZES=[3,8,16,28];
let skColor="#000000", skSize=8, skTool="pen", skDraw=null;
const SKC={el:null,ctx:null,strokes:[],tid:"",sid:0};
const SKW=800, SKH=600;
function skPlayView(){ const v=S.room; return !!(S.screen==="room"&&v&&v.game==="Scribblio"&&v.phase==="play"&&v.g&&v.g.kind==="sk"); }
function skCanDraw(){ const v=S&&S.room; return !!(v&&v.game==="Scribblio"&&v.phase==="play"&&v.g&&v.g.kind==="sk"&&v.g.phase==="draw"&&v.g.drawer===v.me); }
function skStrokeDraw(s,from){
  const c=SKC.ctx; c.lineCap="round"; c.lineJoin="round"; c.strokeStyle=s.c; c.lineWidth=s.w;
  for(let i=Math.max(from,0);i<s.p.length;i++){
    const a=s.p[i-1]||s.p[i], b=s.p[i];
    c.beginPath(); c.moveTo(a[0]*SKW,a[1]*SKH); c.lineTo(b[0]*SKW+0.01,b[1]*SKH); c.stroke();
  }
}
function skRedraw(){
  const c=SKC.ctx; c.globalCompositeOperation="source-over"; c.fillStyle="#ffffff"; c.fillRect(0,0,SKW,SKH);
  SKC.strokes.forEach(s=>skStrokeDraw(s,0));
}
function skApply(op){                                      // the only way anything gets drawn on the canvas
  if(!op||!SKC.ctx) return;
  if(op.k==="seg"){
    let s=SKC.strokes[SKC.strokes.length-1];
    if(!s||s.id!==op.id){ s={id:op.id,c:op.c,w:op.w,p:[]}; SKC.strokes.push(s); }
    const from=s.p.length; (op.p||[]).forEach(q=>s.p.push(q)); skStrokeDraw(s,from);
  } else if(op.k==="undo"){ SKC.strokes.pop(); skRedraw(); }
  else if(op.k==="clear"){ SKC.strokes=[]; skRedraw(); }
  else if(op.k==="sync"){ SKC.strokes=(op.strokes||[]).map(s=>({id:s.id,c:s.c,w:s.w,p:s.p.slice()})); skRedraw(); }
}
function skSend(op){
  if(NET.role==="host") hostDraw(S.me.pid,op);
  else if(NET.hostConn&&NET.hostConn.open){ try{ NET.hostConn.send({t:"draw",d:op}); }catch(e){} }
}
function skFlush(){
  const d=skDraw; if(!d) return; d.timer=null;
  if(!d.pending.length) return;
  const op={k:"seg",id:d.id,c:d.c,w:d.w,p:d.pending}; d.pending=[]; skSend(op);
}
function skEndStroke(){ const d=skDraw; if(!d) return; clearTimeout(d.timer); skFlush(); skDraw=null; }
function buildSkCanvas(){
  const cv=document.createElement("canvas"); cv.width=SKW; cv.height=SKH; cv.className="sk-canvas";
  SKC.el=cv; SKC.ctx=cv.getContext("2d"); skRedraw();
  const pos=e=>{ const r=cv.getBoundingClientRect(); return [Math.round(skClamp((e.clientX-r.left)/r.width,0,1)*10000)/10000,Math.round(skClamp((e.clientY-r.top)/r.height,0,1)*10000)/10000]; };
  const push=pts=>{
    const d=skDraw; if(!d||!pts.length) return;
    skApply({k:"seg",id:d.id,c:d.c,w:d.w,p:pts});          // draw locally right away…
    d.pending.push(...pts);                                  // …and send in small batches
    if(!d.timer) d.timer=setTimeout(skFlush,35);
  };
  cv.addEventListener("pointerdown",e=>{
    if(!skCanDraw()||(e.button!==undefined&&e.button>0)) return;
    e.preventDefault(); try{ cv.setPointerCapture(e.pointerId); }catch(x){}
    skEndStroke();
    const eraser=skTool==="eraser";
    skDraw={id:Date.now()*100+(SKC.sid++%100),c:eraser?"#ffffff":skColor,w:eraser?Math.round(skSize*1.8):skSize,pending:[],timer:null};
    push([pos(e)]);
  });
  cv.addEventListener("pointermove",e=>{
    if(!skDraw) return;
    if(!skCanDraw()){ skEndStroke(); return; }
    const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
    push((evs.length?evs:[e]).map(pos));
  });
  ["pointerup","pointercancel","lostpointercapture"].forEach(ev=>cv.addEventListener(ev,skEndStroke));
}
function skBlanks(mask){
  return [...mask].map(ch=>ch===" "?'<span class="sk-gap"></span>':ch==="_"?'<span class="sk-ch">&nbsp;</span>':`<span class="sk-ch">${esc(ch.toUpperCase())}</span>`).join("");
}
const skSecs=dl=>Math.max(0,Math.ceil((dl-(Date.now()+S.off))/1000));
function skRender(app){

function skPatch(v){
  const g=v.g, me=v.me, isD=g.drawer===me, has=!!g.guessed[me], drawing=isD&&g.phase==="draw";
  const setH=(id,h)=>{ const el=$(id); if(el&&el._h!==h){ el._h=h; el.innerHTML=h; } };
  if(SKC.tid!==g.tid){ SKC.tid=g.tid; skDraw=null; skApply({k:"clear"}); }   // new turn = blank canvas

  else if(g.phase==="reveal"){ lbl="THE WORD WAS"; body=g.res&&g.res.word?`<span class="sk-bigword">${esc(g.res.word)}</span>`:`<span class="sk-hint">Turn skipped</span>`; }
  else if(isD){ lbl="DRAW THIS"; body=`<span class="sk-bigword">${esc(g.word)}</span>`; }

  else { lbl="GUESS THIS"; body=skBlanks(g.mask)+`<span class="sk-n" title="Number of letters">${g.lens.join(" ")}</span>`; }
  setH("skHead",`${g.phase==="reveal"?`<div class="sk-clock off">✓</div>`:`<div class="sk-clock ${low?"low":""}" data-dl="${g.deadline}" data-dlmode="s">${skSecs(g.deadline)}</div>`}
    <div class="sk-round">Round ${v.round} of ${v.settings.rounds}</div>
    <div class="sk-word"><div class="sk-lbl">${lbl}</div><div class="sk-blanks" id="skBlanks">${body}</div></div>
    <span class="chip">Room <b>${esc(v.code)}</b></span>`);

  // players (left): rank, name + points, emoji (+ pencil for the drawer)
  const rows=v.players.map((p,i)=>[p,v.scores[p.pid]||0,i]).sort((a,b)=>b[1]-a[1]||a[2]-b[2]);
  setH("skPlayers",rows.map(([p,sc],i)=>{
    const gain=g.gain[p.pid]||0;
    return `<div class="sk-p ${g.guessed[p.pid]?"ok":""} ${p.pid===g.drawer?"drawing":""} ${p.connected?"":"off"} ${p.left?"gone":""}">
      <span class="rk">#${i+1}</span>
      <div class="nm"><span class="${p.pid===me?"me":""}">${esc(p.name)}${p.pid===me?" (You)":""}${p.pid===v.hostPid?" 👑":""}${kickBtn(v,p)}</span>
        <small>${sc} points${gain>0?` <em>+${gain}</em>`:""}${p.left?" · left":!p.connected?" · offline":""}</small></div>
      <span class="av">${p.av}${p.pid===g.drawer?'<i class="pen" title="Drawing">✏️</i>':""}${g.guessed[p.pid]?'<i class="tick">✓</i>':""}</span></div>`;
  }).join(""));

  // overlay on the canvas: word choice / turn result
  let ov="";
  if(g.phase==="choose"){
    ov=isD?`<h3>Choose a word to draw</h3><div class="sk-choices">${g.choices.map((w,i)=>`<button class="btn green" data-a="skpick" data-i="${i}">${esc(w)}</button>`).join("")}</div>
        <div class="mut">A random one is picked in <b data-dl="${g.deadline}" data-dlmode="s">${skSecs(g.deadline)}</b>s</div>`
      :`<h3>${pAv(v,g.drawer)} ${esc(pName(v,g.drawer))} is choosing a word…</h3>`;
  } else if(g.phase==="reveal"&&g.res){
    const r=g.res, ent=Object.entries(r.gain).filter(e=>e[1]>0).sort((a,b)=>b[1]-a[1]);
    ov=`<h3>${r.word?`The word was <span class="pink">${esc(r.word)}</span>`:"Turn skipped"}</h3>
      ${r.void?`<div class="mut">The drawer left, so nobody scores this turn.</div>`:r.nobody?`<div class="mut">Nobody guessed it 😶</div>`:""}
      ${ent.length?`<div class="sk-rv-list">${ent.map(([pid,pts])=>`<div><span>${pAv(v,pid)} ${esc(pName(v,pid))}${pid===r.drawer?" ✏️":""}</span><b>+${pts}</b></div>`).join("")}</div>`:""}
      <div class="mut">${g.last?"Final results in":"Next turn in"} <b data-dl="${g.deadline}" data-dlmode="s">${skSecs(g.deadline)}</b>s</div>`;

    <div class="sk-sizes">${SK_SIZES.map(z=>`<button class="sz ${skSize===z?"active":""}" data-a="sksize" data-z="${z}" title="Brush size ${z}"><i style="width:${Math.round(4+z*.6)}px;height:${Math.round(4+z*.6)}px"></i></button>`).join("")}</div>
    <div class="sk-btns"><button class="btn secondary ${skTool==="eraser"?"active":""}" data-a="sktool">🧽 Eraser</button>
      <button class="btn secondary" data-a="skundo">↩️ Undo</button><button class="btn secondary" data-a="skclear">🗑️ Clear</button></div></div>`:"");

  // chat (right)
  const nm=pid=>esc(pName(v,pid));

  setH("skLog",g.chat.map(c=>c.k==="sys"?`<div class="m sys">${esc(c.text)}</div>`
    :c.k==="ok"?`<div class="m ok">✅ ${nm(c.pid)} guessed the word!</div>`
    :c.k==="close"?`<div class="m close">🔥 ${esc(c.text)}</div>`
    :`<div class="m ${c.vis==="guessed"?"priv":""}"><b>${nm(c.pid)}:</b> ${esc(c.text)}</div>`).join(""));
  if(stick) lg.scrollTop=lg.scrollHeight;
  const inp=$("skChat"), btn=$("skSend"), was=inp.disabled;
  inp.disabled=drawing; btn.disabled=drawing;
  inp.placeholder=drawing?"You're drawing…":has?"You guessed it! Chat with the other guessers…":"Type your guess here…";
  if(was&&!drawing&&document.activeElement===document.body) inp.focus();
}

/* ================= SCRATCHPAD (built once so drawings survive re-renders) ================= */
let PAD=null, padCtx=null, padTool="pen", padColor="#ff6b81", padSize=4, padUndo=[];
const PAD_COLORS=["#ffffff","#ff6b81","#46d6a4","#ffcc66","#6cc7ff","#c58bff"];
function padSnapshot(){
  const cv=PAD.querySelector("canvas");
  padUndo.push(padCtx.getImageData(0,0,cv.width,cv.height));
  if(padUndo.length>30) padUndo.shift();
}
function padClear(){
  if(!PAD) return;
  const cv=PAD.querySelector("canvas");
  padCtx.clearRect(0,0,cv.width,cv.height);
  padUndo=[];
}
function buildPad(){
  PAD=document.createElement("div");
  PAD.className="pad";
  PAD.innerHTML=`
    <h3 style="margin:0 0 10px">✏️ Scratchpad</h3>
    <div class="pad-tools">
      <button class="btn secondary" data-tool="pen">✏️ Pen</button>
      <button class="btn secondary" data-tool="eraser">🧽 Eraser</button>
      <button class="btn secondary" data-act="undo">↩️ Undo</button>
      <button class="btn secondary" data-act="clear">🗑️ Clear</button>
    </div>
    <div class="pad-tools">
      ${PAD_COLORS.map(c=>`<button class="swatch" data-pcolor="${c}" style="background:${c}" title="${c}"></button>`).join("")}
      <input type="range" min="1" max="30" value="${padSize}" title="Brush size">
    </div>
    <canvas width="600" height="700"></canvas>`;
  const cv=PAD.querySelector("canvas");
  padCtx=cv.getContext("2d");
  padCtx.lineCap="round"; padCtx.lineJoin="round";
  const refresh=()=>{
    PAD.querySelectorAll("[data-tool]").forEach(b=>b.classList.toggle("active",b.dataset.tool===padTool));
    PAD.querySelectorAll(".swatch").forEach(b=>b.classList.toggle("active",b.dataset.pcolor===padColor&&padTool==="pen"));
  };
  PAD.querySelectorAll("[data-tool]").forEach(b=>b.onclick=()=>{ padTool=b.dataset.tool; refresh(); });
  PAD.querySelectorAll(".swatch").forEach(b=>b.onclick=()=>{ padColor=b.dataset.pcolor; padTool="pen"; refresh(); });
  PAD.querySelector("[data-act=undo]").onclick=()=>{ const s=padUndo.pop(); if(s) padCtx.putImageData(s,0,0); };
  PAD.querySelector("[data-act=clear]").onclick=()=>{ padSnapshot(); padCtx.clearRect(0,0,cv.width,cv.height); };
  PAD.querySelector("input[type=range]").oninput=e=>padSize=+e.target.value;
  refresh();
  let drawing=false,last=null;
  const pos=e=>{ const r=cv.getBoundingClientRect(); return [(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]; };
  const stroke=(a,b)=>{
    padCtx.globalCompositeOperation = padTool==="eraser" ? "destination-out" : "source-over";
    padCtx.strokeStyle=padColor;
    padCtx.lineWidth = padTool==="eraser" ? padSize*3 : padSize;
    padCtx.beginPath(); padCtx.moveTo(a[0],a[1]); padCtx.lineTo(b[0]+0.01,b[1]); padCtx.stroke();
  };
  cv.addEventListener("pointerdown",e=>{ drawing=true; cv.setPointerCapture(e.pointerId); padSnapshot(); last=pos(e); stroke(last,last); });
  cv.addEventListener("pointermove",e=>{ if(!drawing) return; const p=pos(e); stroke(last,p); last=p; });
  ["pointerup","pointercancel","pointerleave"].forEach(ev=>cv.addEventListener(ev,()=>{ drawing=false; }));
}

const chP=(v,i)=>chPl(chBoard(v.g.id),chTheme(v.settings),i);

/* ---- rewind (◀ ▶): S.ui.chRw = null (live board) or an index into g.snaps ---- */
const chRwOK=v=>!!(v.g&&v.g.snaps&&v.g.snaps.length>1);
function chRwIdx(v){ const g=v.g; if(!chRwOK(v)||S.ui.chRw==null) return null; return Math.max(0,Math.min(g.snaps.length-1,S.ui.chRw)); }
function chRwGo(how){
  const v=S.room; if(!v||!chRwOK(v)) return;
  const len=v.g.snaps.length, cur=S.ui.chRw==null?len-1:Math.min(S.ui.chRw,len-1);
  let n=how==="first"?0:how==="last"?len-1:cur+(+how);
  n=Math.max(0,Math.min(len-1,n)); S.ui.chRw=n>=len-1?null:n; render();
}
function chRwHTML(v){
  if(!chRwOK(v)) return "";
  const g=v.g, len=g.snaps.length, idx=chRwIdx(v), cur=idx==null?len-1:idx, sn=g.snaps[cur];
  const pl=sn.s>=0?chP(v,sn.s):null;
  const t=cur===0?"Starting position":`Move <b>${cur}</b> / ${len-1} · <span style="color:${pl.fill}">●</span> <b>${esc(sn.x)}</b>`;
  const mySeat=g.seats.findIndex((s,i)=>!s.bot&&s.pid===v.me&&!g.alive[i]);
  let note="";
  if(idx!=null) note=`🔍 Reviewing an earlier position${g.phase==="play"?" – the game is still going on. Press ⏭ to return to the live board.":"."}`;
  else if(mySeat>=0&&g.phase==="play") note=`You are out – use ◀ ▶ (or the ← → keys) to replay the moves and see how it happened.`;
  else if(g.phase==="reveal") note=`Game over – use ◀ ▶ (or the ← → keys) to replay the whole game.`;
  return `<div class="ch-rw ${idx!=null?"on":""}"><button class="btn secondary rwb" data-a="chrw" data-d="first" title="Start" ${cur===0?"disabled":""}>⏮</button>
    <button class="btn secondary rwb" data-a="chrw" data-d="-1" title="Previous move" ${cur===0?"disabled":""}>◀</button>
    <span class="rwt">${t}</span>
    <button class="btn secondary rwb" data-a="chrw" data-d="1" title="Next move" ${idx==null?"disabled":""}>▶</button>
    <button class="btn secondary rwb" data-a="chrw" data-d="last" title="Back to the live board" ${idx==null?"disabled":""}>⏭</button></div>${note?`<div class="ch-rw-note mut">${note}</div>`:""}`;
}
document.addEventListener("keydown",e=>{
  if(e.key!=="ArrowLeft"&&e.key!=="ArrowRight") return;

const chViewSeat=v=>{ const g=v.g; if(S.ui.chView!=null&&S.ui.chView<g.seats.length) return S.ui.chView; const m=g.seats.findIndex(s=>s.pid===v.me&&!s.bot); return m>=0?m:0; };
const chMyTurn=v=>{ const g=v.g; if(g.phase!=="play") return false; const s=g.seats[g.turn]; return !s.bot&&s.pid===v.me; };
function chSeatName(v,i){

const chFmt=ms=>{ const s=Math.max(0,Math.ceil(ms/1000)); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); };

function chBoardSVG(v){
  const g=v.g,B=chBoard(g.id),vs=chViewSeat(v),hex=B.kind==="hex",sc=hex?8:1;
  const a=(270-B.players[vs].side)*Math.PI/180, co=Math.cos(a), sn=Math.sin(a);
  const tr=p=>[(p[0]*co-p[1]*sn)*sc, -(p[0]*sn+p[1]*co)*sc];
  const polys=B.cells.map(c=>c.poly.map(tr));
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  polys.forEach(pl=>pl.forEach(p=>{ x0=Math.min(x0,p[0]); x1=Math.max(x1,p[0]); y0=Math.min(y0,p[1]); y1=Math.max(y1,p[1]); }));
  const pad=.35, f=n=>n.toFixed(3);
  const ctr=polys.map(pl=>[pl.reduce((s,p)=>s+p[0],0)/4,pl.reduce((s,p)=>s+p[1],0)/4]);
  const th=chTheme(v.settings), dk=th.dk, lt=th.lt, hints=v.settings.hints!=0;
  const ri=chRwIdx(v), snap=ri!=null?g.snaps[ri]:null, dec=snap?chDecode(snap.b):null, T=dec?dec.T:g.T, O=dec?dec.O:g.O;
  const mine=!snap&&chMyTurn(v), sel=snap?null:S.ui.chSel;
  const targets=new Map(); if(mine&&sel!=null&&hints) g.legal.forEach(m=>{ if(m[0]===sel) targets.set(m[1],1); });
  const kingHome=new Set(hex?B.players.map(p=>p.back[4]):[]);
  let h=`<svg class="ch-board" viewBox="${f(x0-pad)} ${f(y0-pad)} ${f(x1-x0+2*pad)} ${f(y1-y0+2*pad)}" xmlns="http://www.w3.org/2000/svg"><defs><radialGradient id="chk"><stop offset="0" stop-color="#ff2d2d" stop-opacity=".95"/><stop offset=".7" stop-color="#ff2d2d" stop-opacity=".45"/><stop offset="1" stop-color="#ff2d2d" stop-opacity="0"/></radialGradient></defs>`;
  B.cells.forEach((c,i)=>{

    h+=`<polygon class="sq${own?" mine":""}" data-a="chcell" data-c="${i}" fill="${fill}" stroke="#0a0d2299" stroke-width=".02" points="${polys[i].map(p=>f(p[0])+","+f(p[1])).join(" ")}"><title>${c.label}</title></polygon>`;

    let be=0,le=0,bv=-1e9,lv=1e9;
    for(let j=0;j<4;j++){ const my=pl[j][1]+pl[(j+1)%4][1], mx=pl[j][0]+pl[(j+1)%4][0]; if(my>bv){ bv=my; be=j; } if(mx<lv){ lv=mx; le=j; } }
    const xs=pl.map(p=>p[0]), ys=pl.map(p=>p[1]);
    if(B.eN[i][be]<0) h+=`<text x="${f(Math.max(...xs)-.07)}" y="${f(Math.max(...ys)-.08)}" font-size=".26" text-anchor="end" font-weight="700" fill="${col}" pointer-events="none">${c.fl}</text>`;
    if(B.eN[i][le]<0) h+=`<text x="${f(Math.min(...xs)+.07)}" y="${f(Math.min(...ys)+.25)}" font-size=".24" font-weight="700" fill="${col}" pointer-events="none">${c.rk}</text>`;

      }
    });
  }
  return h+`</svg>`;
}

function chTryMove(from,to){                         // shared by click and drag-and-drop; returns true if a move was sent / promotion opened
  const v=S.room; if(!v||!v.g||v.g.kind!=="ch"||!chMyTurn(v)||S.ui.chPromo) return false;
  const opts=v.g.legal.filter(m=>m[0]===from&&m[1]===to);
  if(!opts.length) return false;
  if(opts.length>1){ S.ui.chPromo={f:from,t:to,opts}; render(); return true; }
  S.ui.chSel=null; sendAct({a:"cmove",f:from,t:to,pr:opts[0][2]}); return true;
}
function chClick(c){
  const v=S.room; if(!v||!v.g||v.g.kind!=="ch"||!chMyTurn(v)) return;
  if(Date.now()<(S.ui.chNoClick||0)) return;         // this click is the tail of a drag
  const g=v.g, sel=S.ui.chSel;
  if(S.ui.chPromo) return;
  if(g.T[c]&&g.O[c]===g.turn){ S.ui.chSel=sel===c?null:c; return render(); }
  if(sel==null) return;
  if(!chTryMove(sel,c)){ S.ui.chSel=null; render(); }
}
/* ---- drag and drop: press a piece, drag it onto a square, release. A plain click still works as before. ---- */
let CHD=null;
function chPointerDown(e){
  if(e.button!==undefined&&e.button!==0) return;
  const el=e.target.closest&&e.target.closest("polygon.sq.mine"); if(!el) return;
  const v=S.room; if(!v||!v.g||v.g.kind!=="ch"||!chMyTurn(v)||S.ui.chPromo) return;
  const c=+el.dataset.c, svg=el.ownerSVGElement, vb=svg.viewBox.baseVal, r=svg.getBoundingClientRect();
  CHD={c,id:e.pointerId,x:e.clientX,y:e.clientY,on:false,size:(r.width/vb.width)*0.95,ghost:null};
  window.addEventListener("pointermove",chPointerMove);
  window.addEventListener("pointerup",chPointerUp);
  window.addEventListener("pointercancel",chPointerUp);
}
function chPointerMove(e){
  const d=CHD; if(!d||e.pointerId!==d.id) return;
  if(!d.on){
    if(Math.hypot(e.clientX-d.x,e.clientY-d.y)<6) return;
    const v=S.room; if(!v||!v.g||!chMyTurn(v)){ return chDragEnd(); }
    d.on=true; S.ui.chSel=d.c; S.ui.chDrag={on:true,from:d.c};
    const g=v.g, B=chBoard(g.id), pl=chP(v,g.O[d.c]);
    const gh=document.createElement("div"); gh.className="ch-ghost";
    gh.innerHTML=`<svg width="${d.size}" height="${d.size}" viewBox="-.5 -.5 1 1"><text x="0" y=".3" font-size=".92" text-anchor="middle" fill="${pl.fill}" stroke="${pl.stroke}" stroke-width=".05" style="paint-order:stroke;stroke-linejoin:round;font-family:'Segoe UI Symbol','Noto Sans Symbols 2','Noto Sans Symbols','DejaVu Sans',sans-serif">${CH_GLYPH[g.T[d.c]]}</text></svg>`;
    document.body.appendChild(gh); d.ghost=gh; document.body.classList.add("ch-dragging");
    render();                                          // shows the legal-move hints and dims the lifted piece
  }
  e.preventDefault();
  if(d.ghost){ d.ghost.style.left=e.clientX+"px"; d.ghost.style.top=e.clientY+"px"; }
}
function chPointerUp(e){
  const d=CHD; if(!d||(e.pointerId!==undefined&&e.pointerId!==d.id)) return;
  const was=d.on; let to=-1;
  if(was&&e.type==="pointerup"){
    if(d.ghost) d.ghost.style.display="none";
    const t=document.elementFromPoint(e.clientX,e.clientY), sq=t&&t.closest?t.closest("polygon.sq"):null;
    if(sq) to=+sq.dataset.c;
  }
  chDragEnd();
  if(was){
    S.ui.chNoClick=Date.now()+350;                     // swallow the click the browser fires after the drop
    if(to>=0&&to!==d.c&&chTryMove(d.c,to)) return;     // legal drop – move sent (or promotion chooser opened)
    render();                                          // illegal drop / cancelled: the piece snaps back, stays selected
  }
}
function chDragEnd(){
  const d=CHD; CHD=null;
  window.removeEventListener("pointermove",chPointerMove);
  window.removeEventListener("pointerup",chPointerUp);
  window.removeEventListener("pointercancel",chPointerUp);
  if(d&&d.ghost) d.ghost.remove();
  document.body.classList.remove("ch-dragging");
  if(S.ui) S.ui.chDrag=null;
}
function chPromote(pr){ const p=S.ui.chPromo; if(!p) return; S.ui.chPromo=null; S.ui.chSel=null; sendAct({a:"cmove",f:p.f,t:p.t,pr}); }

function buildSpace(){
  const mk=(id,n,max,cols)=>{ const el=$(id); if(!el) return; let sh=[];
    for(let i=0;i<n;i++){ sh.push(`${(Math.random()*100).toFixed(2)}vw ${(Math.random()*100).toFixed(2)}vh 0 ${(Math.random()*max).toFixed(2)}px ${cols[i%cols.length]}`); }
    el.style.boxShadow=sh.join(","); };
  mk("stars1",120,0,["#ffffffcc","#cfd8ff","#fff"]);
  mk("stars2",70,.6,["#ffffffaa","#ffe9c4","#bfe3ff"]);
  mk("stars3",14,1.3,["#fff","#aeb9ff","#ffd9a8"]);
  const moon=$("orbitMoon"), calm=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  const e=()=>{ const sys=moon&&moon.parentElement; return sys?sys.offsetWidth:100; };
  const place=t=>{ const R=e(), a=t*0.00042;                            // tilted circular orbit: wide in x, flattened in y
    const x=Math.cos(a)*R*1.05, y=Math.sin(a)*R*.34;
    moon.style.transform=`translate(${x.toFixed(1)}px,${y.toFixed(1)}px)`; moon.style.zIndex=y>0?3:1; };    // in front of Earth when below, behind when above
  const loop=t=>{ if(document.body.classList.contains("home")) place(t); if(!calm) requestAnimationFrame(loop); };
  if(moon){ place(2000); requestAnimationFrame(loop); }
}

function render(){
  try{ renderMain(); }catch(e){ sysReport(e,"game"); }
  try{ renderSys(); }catch(e){ console.error(e); }
}
function renderMain(){
  const app=$("app"); if(!app||!S) return;
  document.body.classList.toggle("home",S.screen==="landing");
  if(skPlayView()){ skRender(app); renderOverlay(); return; }
  const ae=document.activeElement; let keep=null;
  if(ae&&ae.dataset&&ae.dataset.keep!==undefined&&ae.id) keep={id:ae.id,s:ae.selectionStart,e:ae.selectionEnd};
  // new Number-game round -> reset the personal colour panel and scratchpad
  const inNum=S.screen==="room"&&S.room&&S.room.game==="number"&&S.room.phase==="play";
  if(inNum){
    const k=S.room.code+"|"+S.room.round;
    if(S.padKey!==k){
      S.padKey=k; padClear();
      S.colors=Object.fromEntries([...Array(10).keys()].map(i=>[i,"None"]));
      S.positions=Object.fromEntries([...Array(10).keys()].map(i=>[i,""]));
    }
  }
  const inCh=S.screen==="room"&&S.room&&S.room.game==="chess"&&S.room.phase==="play";
  const inSpy=S.screen==="room"&&S.room&&S.room.game==="spy"&&S.room.phase==="play"&&S.room.g&&S.room.g.kind==="spy";
  const chatKeep=$("chatLog"), nearEnd=!chatKeep||chatKeep.scrollHeight-chatKeep.scrollTop-chatKeep.clientHeight<60;
  app.innerHTML=`<div class="layout ${inNum?"with-pad":""} ${inSpy?"with-chat":""} ${inCh?"wide":""}"><main>${mainHTML()}</main>${inNum?`<section class="padcol"><div id="padSlot"></div></section>`:""}${inSpy?`<section class="chatcol">${spyChatHTML(S.room)}</section>`:""}</div>`;
  const cl=$("chatLog"); if(cl&&nearEnd) cl.scrollTop=cl.scrollHeight;
  const slot=$("padSlot"); if(slot&&PAD) slot.appendChild(PAD);
  const hb=$("chHist"); if(hb) hb.scrollTop=hb.scrollHeight;
  app.querySelectorAll("[data-keep]").forEach(el=>{ if(S.ui[el.id]!==undefined) el.value=S.ui[el.id]; });
  bind();
  if(keep){
    const el=$(keep.id);
    if(el){ el.focus(); try{ if(keep.s!=null) el.setSelectionRange(keep.s,keep.e); }catch(e){} }
  } else {
    const c=$("spyClue")||$("guess");
    if(c&&document.activeElement===document.body) c.focus();

}

/* ================= EVENT DELEGATION ================= */
function goHome(){ clearHash(); S=freshState(); padClear(); render(); }
function doClue(){
  const t=String(S.ui.spyClue||"").trim();
  if(!t) return toast("Type a clue first.","err");
  S.ui.spyClue=""; sendAct({a:"clue",text:t});
}
function doGuess(){
  const t=String(S.ui.guess||"").trim();
  S.ui.guess=""; sendAct({a:"guess",guess:t});
}
function onAppClick(e){
  const t=e.target.closest("[data-a]"); if(!t||t.disabled) return;
  switch(t.dataset.a){
    case "home": goHome(); break;
    case "go": S.notice=null; S.game=t.dataset.g; S.screen="entry"; render(); break;
    case "goJoin": S.notice=null; S.game=null; S.screen="entry"; render(); break;
    case "goXmas": S.notice=null; S.screen="xmas"; render(); break;
    case "goDiwali": S.notice=null; S.screen="diwali"; render(); break;
    case "goOffline": S.notice=null; S.screen="offline"; try{ history.replaceState(null,"","#/offline-mode"); }catch(x){} render(); break;
    case "createLocal": createLocalRoom(S.game); break;
    case "offStart": S.game=t.dataset.g; createLocalRoom(S.game,t.dataset.solo); break;
    case "create": createRoom(S.game); break;
    case "join": joinRoom(S.ui.joinCode||""); break;
    case "copyLink": copyLink(); break;
    case "leave": leaveRoom(); break;
    case "exitgame":
      showModal({title:"Exit the game?",text:"Everyone stays in the room. You'll go back to the lobby where you can change the settings and start again.",ok:"Exit game",danger:false,act:"exitgame"});
      break;
    case "kick": { const v=S.room, p=v&&v.players.find(x=>x.pid===t.dataset.pid); if(p) showModal({title:"Kick "+p.name+"?",text:"They will be removed from the room"+(v.phase==="play"?" and the current game":"")+". They can join again with the room code.",ok:"Kick",danger:true,act:"kick",pid:p.pid}); break; }
    case "chcell": chClick(+t.dataset.c); break;
    case "chpromo": chPromote(+t.dataset.p); break;
    case "chrw": chRwGo(t.dataset.d); break;
    case "chrot": { const v=S.room; S.ui.chView=(chViewSeat(v)+1)%v.g.seats.length; render(); break; }
    case "chresign": showModal({title:"Resign?",text:"You will lose this game.",ok:"Resign",danger:true,act:"chresign"}); break;
    case "chdraw": sendAct({a:"draw"}); toast("Draw offered.","info"); break;
    case "chacc": sendAct({a:"acceptdraw"}); break;
    case "chdec": sendAct({a:"declinedraw"}); break;
    case "skchat": doSkChat(); break;
    case "skpick": sendAct({a:"skpick",i:+t.dataset.i}); break;
    case "skcolor": skColor=t.dataset.c; skTool="pen"; skPatch(S.room); break;
    case "sksize": skSize=+t.dataset.z; skPatch(S.room); break;
    case "sktool": skTool=skTool==="eraser"?"pen":"eraser"; skPatch(S.room); break;
    case "skundo": if(skCanDraw()){ skEndStroke(); skApply({k:"undo"}); skSend({k:"undo"}); } break;
    case "skclear": if(skCanDraw()){ skEndStroke(); skApply({k:"clear"}); skSend({k:"clear"}); } break;
    case "start": sendAct({a:"start",civ:S.ui.spyCiv,spyW:S.ui.spyW,words:S.ui.skWords}); break;
    case "act": sendAct({a:t.dataset.x}); break;
    case "clue": doClue(); break;
    case "callvote": sendAct({a:"callvote"}); break;
    case "guess": doGuess(); break;
    case "vote":
      if(!S.ui.voteSel) return toast("Pick a player first.","err");
      sendAct({a:"vote",target:S.ui.voteSel}); break;
    case "rrguess":
      if(!S.ui.rrSel) return toast("Pick a player first.","err");
      sendAct({a:"rrguess",target:S.ui.rrSel}); break;
  }
}
function onAppChange(e){
  const el=e.target.closest("[data-set]"); if(!el) return;
  sendAct({a:"settings",k:el.dataset.set,v:el.value});
}
function onAppInput(e){
  const t=e.target;
  if(t.dataset&&t.dataset.keep!==undefined&&t.id){
    if(t.id==="guess"){ const c=t.value.replace(/\D/g,""); if(c!==t.value) t.value=c; }
    S.ui[t.id]=t.value;
  }
}
function onAppKey(e){
  if(e.key!=="Enter") return;
  const id=e.target.id;
  if(id==="spyClue") doClue();
  else if(id==="guess") doGuess();
  else if(id==="skChat") doSkChat();
  else if(id==="joinCode") joinRoom(S.ui.joinCode||"");
}


/* ================= EJECTION CUTSCENE (Among-Us style) =================
   The host records an "ejection" whenever a player is voted out / exposed / eliminated (R.evPending -> R.ev).
   Every player's view carries the latest event, so every screen plays the same full-page airlock scene
   (~6 s, with sound, skippable) before the normal results screen is shown. */
const EJ={active:false,q:[],after:[],seen:new Set(),timers:[],ctx:null,aud:null,mute:false,reduce:false,cur:null};
try{ EJ.mute=localStorage.getItem("ngg_mute")==="1"; }catch(e){}
try{ EJ.reduce=!!(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches); }catch(e){}
const EJ_COLORS=["#ff6b81","#ffb24d","#ffd25e","#46d6a4","#4fc3ff","#6c7bff","#b57bff","#ff7bd0","#9cc66b"];

/* ---- host side: queue an ejection; pushState() turns the queue into one event ---- */
function ejItem(R,pid,o){ const p=R.players.find(x=>x.pid===pid)||{name:"?",av:"👤"}; return Object.assign({pid,name:p.name,av:p.av},o); }
function ejPush(R,it){ (R.evPending=R.evPending||[]).push(it); }
function ejFlush(R){ if(R.evPending&&R.evPending.length){ R.ev={id:(R.evId=(R.evId||0)+1),at:Date.now(),items:R.evPending}; R.evPending=[]; } }

/* ---- client side ---- */
function ejCheck(v){
  const ev=v&&v.ev; if(!ev||!ev.items||!ev.items.length) return;
  const key=v.code+"#"+ev.id; if(EJ.seen.has(key)) return; EJ.seen.add(key);
  if(v.now-ev.at>12000) return;                       // old event (e.g. we just reconnected) – don't replay it
  const wait=Math.max(0,(+ev.items[0].wait||0)-(v.now-ev.at)), go=()=>{ EJ.q.push({items:ev.items,me:v.me}); if(!EJ.active) ejNext(); };
  if(wait>0) setTimeout(go,wait); else go();
}
function ejDefer(fn){ if(EJ.active||EJ.q.length) EJ.after.push(fn); else fn(); }
function ejNext(){
  const b=EJ.q.shift(); if(!b){ EJ.active=false; return; }
  EJ.active=true; EJ.cur=b;
  const root=$("eject"); root.classList.add("on");
  const app=$("app"); if(app) app.inert=true;
  try{ if(document.activeElement&&document.activeElement.blur) document.activeElement.blur(); }catch(e){}
  ejPlay(b.items,0,b.me);
}
function ejClear(){ EJ.timers.forEach(clearTimeout); EJ.timers=[]; if(EJ.aud){ try{ EJ.aud.stop(); }catch(e){} EJ.aud=null; } }
function ejPlay(items,i,me){
  ejClear();
  if(items[i].role) return ejRole(items,i,me);
  const it=items[i], root=$("eject");
  const you=it.pid&&it.pid===me, fill=s=>String(s==null?"":s).replace(/\{n\}/g,you?"You":it.name).replace(/\{was\}/g,you?"were":"was");
  const head=fill(it.h), sub=fill(it.s), epi=fill(it.e), eb=fill(it.eb);
  const acc=it.col||EJ_COLORS[Math.max(0,EMOJIS.indexOf(it.av))%EJ_COLORS.length];
  const T=it.T?(EJ.reduce?Math.min(it.T,5000):it.T):(EJ.reduce?4500:8200)+(epi?1600:0);
  // starfield (random per scene)
  const star=(n,mx)=>{ let a=[]; for(let k=0;k<n;k++) a.push(`${(Math.random()*100).toFixed(1)}vw ${(Math.random()*100).toFixed(1)}vh 0 ${(Math.random()*mx).toFixed(1)}px #fff`); return a.join(","); };
  let vent=""; for(let k=0;k<20;k++){ const a=(Math.random()*1.4-.7), d=14+Math.random()*34; vent+=`<i style="--dx:${(Math.cos(a)*d).toFixed(1)}vmin;--dy:${(Math.sin(a)*d).toFixed(1)}vmin;animation-delay:${(1.7+Math.random()*.25).toFixed(2)}s"></i>`; }
  root.innerHTML=`<div class="ej tone-${esc(it.tone||"bad")} ${it.none?"none":""} ${EJ.reduce?"calm":""}" role="alertdialog" aria-modal="true" aria-label="${esc((eb+". "+head+" "+sub+" "+epi).trim())}" style="--T:${T}ms">
    <div class="ej-world">
      <div class="ej-stars" style="box-shadow:${star(70,0)}"></div><div class="ej-stars s2" style="box-shadow:${star(34,1.4)}"></div>
      <div class="ej-planet"></div><div class="ej-moon"></div>
      <div class="ej-hull"></div><div class="ej-frame"></div><div class="ej-hatch"></div><div class="ej-beacon"></div>
      ${it.none?"":`<div class="ej-astro"><div class="ej-fly">${astroSVG(acc,it.av)}</div></div>`}
      <div class="ej-glass t"></div><div class="ej-glass b"></div><div class="ej-vent">${vent}</div>
    </div>
    <div class="ej-alarm"></div><div class="ej-flash"></div>
    <div class="ej-eyebrow"></div>
    <div class="ej-text"><div class="ej-head" aria-hidden="true"></div><div class="ej-sub"></div>${epi?`<div class="ej-epi"></div>`:""}</div>
    <div class="ej-ui">${items.length>1?`<span class="ej-count">${i+1} / ${items.length}</span>`:""}
      <button type="button" class="ej-btn" id="ejMute" aria-label="Sound">${EJ.mute?"🔇":"🔊"}</button>
      <button type="button" class="ej-btn" id="ejSkip">Skip ⏭</button></div>
    <div class="ej-bar"></div></div>`;
  const q=s=>root.querySelector(s);
  q(".ej-eyebrow").textContent=eb; q(".ej-sub").textContent=sub; if(epi) q(".ej-epi").textContent=epi;
  q("#ejSkip").onclick=()=>ejSkip(); q("#ejMute").onclick=ejToggleMute; q("#ejSkip").focus();
  // the airlock opens at 1.7 s
  EJ.timers.push(setTimeout(()=>{ const e=root.querySelector(".ej"); if(e) e.classList.add("opened"); },1700));
  // typewriter headline
  const hd=q(".ej-head");
  if(EJ.reduce){ hd.textContent=head; hd.classList.add("done"); }
  else EJ.timers.push(setTimeout(()=>{
    let n=0; const step=()=>{
      n++; hd.textContent=head.slice(0,n); if(n%3===1) ejTick();
      if(n<head.length) EJ.timers.push(setTimeout(step,42)); else hd.classList.add("done"); };
    step(); },2600));
  EJ.aud=ejAudio(it);
  EJ.timers.push(setTimeout(()=>{ if(i+1<items.length) ejPlay(items,i+1,me); else ejEnd(); },T));
}
function ejSkip(){ if(!EJ.active) return; ejClear(); ejEnd(); }
function ejEnd(){
  ejClear();
  const root=$("eject"), e=root.querySelector(".ej");
  const fin=()=>{
    root.classList.remove("on"); root.innerHTML="";
    const app=$("app"); if(app) app.inert=false;
    EJ.cur=null;
    const cbs=EJ.after.splice(0); cbs.forEach(f=>{ try{ f(); }catch(x){ console.error(x); } });
    if(EJ.q.length) ejNext(); else EJ.active=false;
    try{ render(); }catch(x){}
  };
  if(e){ e.classList.add("out"); EJ.timers.push(setTimeout(fin,380)); } else fin();
}
function ejToggleMute(){
  EJ.mute=!EJ.mute; try{ localStorage.setItem("ngg_mute",EJ.mute?"1":"0"); }catch(e){}
  const b=$("ejMute"); if(b) b.textContent=EJ.mute?"🔇":"🔊";
  if(EJ.mute&&EJ.aud){ try{ EJ.aud.stop(); }catch(e){} EJ.aud=null; }
}
function ejTick(){ if(EJ.aud&&EJ.aud.tick) EJ.aud.tick(); }
/* All sounds are synthesised with WebAudio – no audio files needed. */
function ejAudio(it){
  if(EJ.mute) return null;
  try{
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return null;
    const ctx=EJ.ctx||(EJ.ctx=new AC()); if(ctx.state==="suspended") ctx.resume();
    const t0=ctx.currentTime+.05, M=ctx.createGain(); M.gain.value=.9; M.connect(ctx.destination);
    const osc=(type,f1,f2,at,d,v)=>{ const o=ctx.createOscillator(), g=ctx.createGain(); o.type=type;
      o.frequency.setValueAtTime(f1,at); if(f2) o.frequency.exponentialRampToValueAtTime(f2,at+d);
      g.gain.setValueAtTime(.0001,at); g.gain.exponentialRampToValueAtTime(v,at+.02); g.gain.exponentialRampToValueAtTime(.0001,at+d);
      o.connect(g); g.connect(M); o.start(at); o.stop(at+d+.05); };
    const noise=(at,d,v,f1,f2,type)=>{ const n=Math.floor(ctx.sampleRate*d), b=ctx.createBuffer(1,n,ctx.sampleRate), a=b.getChannelData(0);
      for(let k=0;k<n;k++) a[k]=Math.random()*2-1;
      const s=ctx.createBufferSource(); s.buffer=b; const f=ctx.createBiquadFilter(); f.type=type||"bandpass"; f.Q.value=.8;
      f.frequency.setValueAtTime(f1,at); f.frequency.exponentialRampToValueAtTime(f2,at+d);
      const g=ctx.createGain(); g.gain.setValueAtTime(v,at); g.gain.exponentialRampToValueAtTime(.0001,at+d);
      s.connect(f); f.connect(g); g.connect(M); s.start(at); };
    if(it.role){                                                                   // secret-role reveal
      noise(t0+.15,1.4,.4,200,2600,"bandpass"); osc("sine",90,40,t0+.35,.7,.5);
      (it.sound==="spy"?[196,185,147]:[392,523,659,784]).forEach((f,k)=>osc(it.sound==="spy"?"sawtooth":"triangle",f,0,t0+1.4+k*.2,.6,it.sound==="spy"?.07:.15));
      return {tick(){},stop(){ try{ M.gain.cancelScheduledValues(ctx.currentTime); M.gain.setTargetAtTime(0,ctx.currentTime,.05); }catch(e){} }};
    }
    for(let k=0;k<6;k++) osc("square",k%2?520:780,0,t0+.1+k*.26,.2,.04);          // alarm
    osc("sine",120,38,t0+1.7,.6,.55);                                              // pressure thud
    noise(t0+1.7,1.2,.5,7000,1200,"highpass");                                     // hiss
    noise(t0+1.8,4.2,.45,260,3200,"bandpass");                                     // whoosh as they tumble away
    const tone=it.tone||"bad";
    if(it.none){ [330,262].forEach((f,k)=>osc("triangle",f,0,t0+3.4+k*.3,.5,.12)); }
    else if(tone==="good") [523,659,784,1047].forEach((f,k)=>osc("triangle",f,0,t0+3.4+k*.15,.5,.16));
    else [440,349,294,220].forEach((f,k)=>osc("sawtooth",f,0,t0+3.4+k*.22,.7,.07));
    return {
      tick(){ try{ osc("square",1500,0,ctx.currentTime+.005,.03,.02); }catch(e){} },
      stop(){ try{ M.gain.cancelScheduledValues(ctx.currentTime); M.gain.setTargetAtTime(0,ctx.currentTime,.05); }catch(e){} }
    };
  }catch(e){ return null; }
}
document.addEventListener("keydown",e=>{
  if(!EJ.active) return;
  if(e.key==="Escape"||e.key==="Enter"||e.key===" "){ e.preventDefault(); e.stopImmediatePropagation(); ejSkip(); }
},true);

function roleCheck(v){
  const g=v.g; if(!g||v.phase!=="play"||!g.ids||!g.ids.includes(v.me)) return;
  let it=null;
  if(g.kind==="spy"&&g.phase==="clues"&&g.cyc===1&&g.ids.every(p=>!g.clues[p].length)){
    const spy=!!g.my.knowsSpy;
    it={role:true,kind:"spy",spy,word:g.my.word,sound:spy?"spy":"civ",col:spy?"#ff4d5e":"#4fc3ff",emoji:spy?"🕵️":"🙂"};
  } else if(g.kind==="rr"&&g.phase==="roles"){
    const r=RR_ROLES[g.myRole], bad=r.key==="thief";
    it={role:true,kind:"rr",name:r.name,emoji:r.emoji,pts:r.pts,hint:r.hint||"Keep it secret until the Police is called 🤫",sound:bad?"spy":"civ",col:bad?"#ff4d5e":r.key==="police"?"#4fc3ff":"#ffd25e"};
  }
  if(!it) return;
  const key=v.code+"|"+v.deal+"|role"; if(EJ.seen.has(key)) return; EJ.seen.add(key);
  EJ.q.push({items:[it],me:v.me}); if(!EJ.active) ejNext();
}
function ejRole(items,i,me){
  const it=items[i], root=$("eject"), T=EJ.reduce?5000:8000;
  const head=it.kind==="spy"?(it.spy?"You are a Spy":"You are a Civilian"):`You are the ${it.emoji} ${it.name}`;
  const eb=it.kind==="spy"?"YOUR SECRET ROLE":"YOUR SECRET ROLE";
  let sub;
  if(it.kind==="spy") sub=it.word?`<span class="ej-sl">and your word is</span><div class="ej-word">${esc(it.word)}</div>`:`<span class="ej-sl">You have no word – listen closely and bluff!</span>`;
  else sub=`<span class="ej-sl">worth</span><div class="ej-word">${esc(it.pts)} points</div>`;
  const hint=it.kind==="spy"?(it.spy?"🤫 Blend in – the civilians are hunting you.":"🤫 Give clues without saying your word – and find the Spy."):it.hint;
  let st=""; for(let k=0;k<60;k++) st+=`${(Math.random()*100).toFixed(1)}vw ${(Math.random()*100).toFixed(1)}vh 0 ${(Math.random()*1.4).toFixed(1)}px #fff${k?",":""}`.replace(/^(.*?)(,?)$/,"$1$2");
  root.innerHTML=`<div class="ej role ${EJ.reduce?"calm":""}" role="alertdialog" aria-modal="true" aria-label="${esc(head+". "+(it.word?"Your word is "+it.word+". ":"")+hint)}" style="--T:${T}ms;--al:${esc(it.col)}">
    <div class="ej-world"><div class="ej-stars" style="box-shadow:${st.replace(/,$/,"")}"></div></div>
    <div class="ej-flash"></div><div class="ej-eyebrow">${esc(eb)}</div>
    <div class="ej-emblem">${esc(it.emoji)}</div>
    <div class="ej-text"><div class="ej-head pop done">${esc(head)}</div><div class="ej-sub">${sub}</div><div class="ej-epi">${esc(hint)}</div></div>
    <div class="ej-ui"><button type="button" class="ej-btn" id="ejMute" aria-label="Sound">${EJ.mute?"🔇":"🔊"}</button><button type="button" class="ej-btn" id="ejSkip">I'm ready ▶</button></div>
    <div class="ej-bar"></div></div>`;
  root.querySelector("#ejSkip").onclick=()=>ejSkip(); root.querySelector("#ejMute").onclick=ejToggleMute; root.querySelector("#ejSkip").focus();
  EJ.aud=ejAudio(it);
  EJ.timers.push(setTimeout(()=>ejEnd(),T));
}

/* ================= SYSTEM PAGES: loading · no internet · 404 · error · offline mode ================= */
const SYS={err:null,offline:false,route:null,boot:true,bootP:6,bootMsg:"Starting up…",badPath:"",key:"boot",dismissed:new Set(),probing:false};
let ONLINE=navigator.onLine!==false, SWSTATE="checking", NETT=null;
const PEER_SRC=["https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js","https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"];
const SYS_TIPS=["Tip: share the invite link – friends join with one tap.","Tip: in Who Is the Spy? never say your own word out loud.","Tip: chess and the Number Game work with no internet at all.","Tip: if the Police guesses wrong in Raja Rani, the Thief takes the points.","Tip: Scribblio hints appear at ⅓ and ⅔ of the drawing time.","Tip: refreshing the page rejoins your room automatically."];

function loadScript(src,ms){
  return new Promise(res=>{
    const s=document.createElement("script"); let done=false;
    const fin=ok=>{ if(done) return; done=true; clearTimeout(t); if(!ok) s.remove(); res(ok); };
    const t=setTimeout(()=>fin(false),ms||9000);
    s.src=src; s.async=true; s.onload=()=>fin(true); s.onerror=()=>fin(false); document.head.appendChild(s);
  });
}
let _peerP=null;
function loadPeerLib(){
  if(typeof Peer!=="undefined") return Promise.resolve(true);
  if(_peerP) return _peerP;
  _peerP=(async()=>{ for(const u of PEER_SRC){ if(await loadScript(u,9000)&&typeof Peer!=="undefined") return true; } return false; })();
  _peerP.then(()=>{ _peerP=null; },()=>{ _peerP=null; });
  return _peerP;
}
function probeNet(){
  return new Promise(res=>{
    if(navigator.onLine===false) return res(false);
    const c=new AbortController(), t=setTimeout(()=>{ c.abort(); res(false); },5000);
    fetch("https://unpkg.com/peerjs@1.5.4/package.json?_probe="+Date.now(),{mode:"no-cors",cache:"no-store",signal:c.signal}).then(()=>{ clearTimeout(t); res(true); },()=>{ clearTimeout(t); res(false); });
  });
}

  return `<div class="sys-page sys-404" role="alertdialog" aria-modal="true" aria-labelledby="sysT">
