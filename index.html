    <h1 id="sysT">Houston, this page doesn't exist</h1>
    <p>We searched the whole galaxy${SYS.badPath?` for <code>${esc(SYS.badPath)}</code>`:""} but it isn't part of Game Hub. The link may be mistyped or out of date.</p>
    <div class="sys-actions"><button class="btn green" data-sys="closeRoute">🏠 Back to the hub</button><button class="btn secondary" data-sys="joinRoute">🔑 Join a room</button></div>
    </div></div>`;
}
function sysErrorHTML(){
  const e=SYS.err, inRoom=!!(NET&&NET.role), host=inRoom&&NET.role==="host"&&!NET.local;
  return `<div class="sys-page sys-error" role="alertdialog" aria-modal="true" aria-labelledby="sysT">
    <div class="sys-stars"></div><div class="sys-card">
    <div class="sys-art"><div class="sys-astro">${astroSVG("#ff6b81","😵")}</div><span class="sys-spark" style="left:calc(50% - 90px);top:40px">⚡</span><span class="sys-spark" style="left:calc(50% + 64px);top:70px;animation-delay:.5s">⚠️</span><span class="sys-spark" style="left:calc(50% + 40px);top:16px;animation-delay:.9s">✨</span></div>
    <div class="sys-pill bad"><i></i> ${e.kind==="load"?"Loading problem":"Game problem"}</div>
    <h1 id="sysT">${esc(e.title)}</h1>
    <p>${esc(e.msg)}</p>
    ${host?`<div class="sys-note">⚠️ You're the host – reloading closes the room for everyone.</div>`:""}
    <div class="sys-actions"><button class="btn" data-sys="reload">🔄 Reload page</button><button class="btn secondary" data-sys="hub">🏠 Back to the hub</button>${e.fatal?"":`<button class="btn secondary" data-sys="dismiss">Try to continue</button>`}</div>
    <details><summary>Technical details</summary><pre id="sysDetail">${esc(e.detail||e.msg)}</pre><button class="btn secondary" data-sys="copy" style="padding:6px 12px;font-size:.85rem">📋 Copy details</button></details>
    </div></div>`;
}
function sysKind(){
  if(SYS.err) return "error";
  if(SYS.boot) return "boot";
  if(SYS.offline&&!(NET&&NET.local)) return "nointernet";
  if(SYS.route) return "r-"+SYS.route;
  if(S&&S.busy) return "busy";
  return null;
}
function renderSys(){
  const el=$("sys"); if(!el) return;
  const kind=sysKind(), busyTxt=S&&S.busy||"", key=kind==="busy"?"busy|"+busyTxt+"|"+!!NET.abortJoin:kind==="error"?"error|"+(SYS.err&&SYS.err.msg):kind==="r-404"?"404|"+SYS.badPath:kind;
  if(key===SYS.key) return;
  SYS.key=key;
  if(kind==="boot") el.innerHTML=sysLoadingHTML({title:"Launching Game Hub…",sub:SYS.bootMsg,boot:true});
  else if(kind==="error") el.innerHTML=sysErrorHTML();
  else if(kind==="nointernet") el.innerHTML=sysNoInternetHTML();
  else if(kind==="r-404") el.innerHTML=sys404HTML();
  else if(kind==="r-nointernet") el.innerHTML=sysNoInternetHTML().replace('data-sys="dismiss"','data-sys="closeRoute"');
  else if(kind==="r-error"){
    const keep=SYS.err;
    SYS.err={kind:"game",title:"Mission glitch",msg:"This is a preview of the error page. It appears when something goes wrong while a game is loading or running.",detail:"PreviewError: nothing is actually broken\n    at GameHub (preview)",fatal:false};
    el.innerHTML=sysErrorHTML().replace('data-sys="dismiss"','data-sys="closeRoute"'); SYS.err=keep; }
  else if(kind==="r-loading") el.innerHTML=sysLoadingHTML({title:"Loading your game…",sub:"This is a preview of the loading page.",actions:`<div class="sys-actions"><button class="btn secondary" data-sys="closeRoute">Close preview</button></div>`});
  else if(kind==="busy") el.innerHTML=sysLoadingHTML({late:true,title:busyTxt.replace(/…$/,"")+"…",sub:"Connecting through the matchmaking server",actions:NET.abortJoin?`<div class="sys-actions"><button class="btn secondary" data-sys="cancelBusy">Cancel</button></div>`:""});
  else { el.innerHTML=""; }
  if(kind&&kind!=="boot"){ const b=el.querySelector("button"); if(b&&kind!=="busy") b.focus(); }
}
function setBoot(p,msg){
  SYS.bootP=Math.max(SYS.bootP,p); if(msg) SYS.bootMsg=msg;
  const b=$("sysBar"); if(b&&SYS.boot) b.style.width=SYS.bootP+"%";
  const m=$("sysSub"); if(m&&msg&&SYS.boot) m.textContent=msg;
}
function hideBoot(cb){
  const pg=SYS.err?null:document.querySelector("#sys .sys-page");
  const done=()=>{ SYS.boot=false; SYS.key="boot-done"; if(cb) cb(); renderSys(); };
  if(pg){ pg.classList.add("bye"); setTimeout(done,360); } else done();
}

/* ---- errors ---- */
function sysReport(err,kind){
  try{
    const msg=String((err&&err.message)||err||"Unknown error");
    console.error("[Game Hub]",err);
    if(/ResizeObserver loop/i.test(msg)||SYS.dismissed.has(msg)||SYS.err) return;
    const load=kind==="load";
    SYS.err={kind:load?"load":"game",title:load?"Couldn't load the game":"Mission glitch",
      msg:load?"Something needed to load didn't arrive. Check your connection and reload the page.":"Something went wrong while running the game. You can try to continue, or reload the page. If you were in a room, a refresh rejoins it automatically.",
      detail:(err&&err.stack)?String(err.stack):msg,fatal:false,raw:msg};
    renderSys();
  }catch(e){}
}
window.addEventListener("error",ev=>{
  if(ev.target&&ev.target!==window) return;                                  // resource load errors are handled where the resource is requested
  if(/extension:\/\//.test(ev.filename||"")||/ResizeObserver loop/i.test(ev.message||"")) return;
  if(!ev.error&&/^Script error/i.test(ev.message||"")) return;
  sysReport(ev.error||ev.message,"game");
});
window.addEventListener("unhandledrejection",ev=>{
  const r=ev.reason;
  if(!(r instanceof Error)||/Failed to fetch|NetworkError|Load failed|AbortError/i.test(r.message||"")) return;   // permission prompts, aborted requests, offline fetches …
  sysReport(r,"game");
});

/* ---- clicks on the system pages ---- */
function sysClick(e){
  const b=e.target.closest("[data-sys]"); if(!b) return;
  switch(b.dataset.sys){
    case "retry": {
      if(SYS.probing) return; SYS.probing=true; b.disabled=true; b.textContent="⏳ Checking…";
      probeNet().then(ok=>{ SYS.probing=false;
        if(ok){ ONLINE=true; SYS.offline=false; renderSys(); toast("✅ You're back online.","ok"); }
        else { b.disabled=false; b.textContent="🔄 Try again"; const m=$("sysMsg"); if(m) m.textContent="Still no connection – make sure Wi-Fi or mobile data is on, then try again."; } });
      break; }
    case "offmode": SYS.offline=false; SYS.route=null; if(!(S.screen==="room")){ S.screen="offline"; try{ history.replaceState(null,"","#/offline-mode"); }catch(x){} } SYS.key="x"; render(); break;
    case "dismiss": if(SYS.err){ SYS.dismissed.add(SYS.err.raw||""); SYS.err=null; } else SYS.offline=false; SYS.key="x"; renderSys(); break;
    case "closeRoute": SYS.route=null; clearHash(); SYS.key="x"; render(); break;
    case "joinRoute": SYS.route=null; clearHash(); S.notice=null; S.game=null; S.screen="entry"; SYS.key="x"; render(); break;
    case "reload": location.reload(); break;
    case "hub": SYS.err=null; SYS.route=null; SYS.key="x"; clearHash(); if(NET.role) cleanup(); else goHome(); break;
    case "cancelBusy": if(NET.abortJoin) NET.abortJoin(); break;
    case "copy": { const t=($("sysDetail")||{}).textContent||""; if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(()=>{ b.textContent="✅ Copied"; },()=>{}); break; }
  }
}
function clearHash(){ try{ if(location.hash) history.replaceState(null,"",location.pathname+location.search); }catch(e){} }

/* ---- #/routes (preview pages + unknown routes → 404) ---- */
function applyRoute(){
  const h=(location.hash||"").replace(/\/+$/,""), pages={"#/offline":"offline","#/offline-mode":"offline"};
  SYS.route=null; SYS.badPath="";
  if(h===""||h==="#"){ if(S&&S.screen==="offline") S.screen="landing"; }
  else if(pages[h]){ S.screen="offline"; }
  else if(h==="#/loading") SYS.route="loading";
  else if(h==="#/error") SYS.route="error";
  else if(h==="#/no-internet") SYS.route="nointernet";
  else { SYS.route="404"; SYS.badPath=location.hash; }
  SYS.key="x"; render();
}
window.addEventListener("hashchange",()=>{ if(!SYS.boot) applyRoute(); });

/* ---- connectivity ---- */
window.addEventListener("offline",()=>{
  ONLINE=false; clearTimeout(NETT);
  NETT=setTimeout(()=>{ if(navigator.onLine===false&&!SYS.boot){ SYS.offline=true; SYS.key="x"; render(); } },1200);
});
window.addEventListener("online",async()=>{
  clearTimeout(NETT);
  const ok=await probeNet(); if(!ok&&navigator.onLine===false) return;
  ONLINE=true;
  if(SYS.offline){ SYS.offline=false; SYS.key="x"; toast("✅ You're back online.","ok"); }
  if(S&&(S.screen==="offline"||S.screen==="entry")) render();
});
function registerSW(){
  if(!("serviceWorker" in navigator)){ SWSTATE="unsupported"; return; }
  if(location.protocol==="file:"){ SWSTATE="file"; return; }
  const secure=location.protocol==="https:"||/^(localhost|127\.|\[::1\])/.test(location.hostname);
  if(!secure){ SWSTATE="insecure"; return; }
  navigator.serviceWorker.register("sw.js").then(()=>navigator.serviceWorker.ready).then(()=>{ SWSTATE="ready"; if(S&&S.screen==="offline") render(); }).catch(()=>{ SWSTATE="error"; if(S&&S.screen==="offline") render(); });
}

  let h=`<div class="card2" style="margin-top:14px"><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
    <span class="sys-pill ${ONLINE?"ok":"bad"}"><i></i> ${ONLINE?"Online":"Offline"}</span>

  h+=`<h3 style="margin-top:22px">✅ Works without internet</h3><div class="off-grid">${OFF_YES.map(c=>`<div class="off-card yes"><span class="off-tag yes">Available offline</span>
    <b>${c.ico} ${esc(c.name)}</b><span class="d">${esc(c.d)}</span>
    <button class="btn green" style="margin-top:8px" data-a="offStart" data-g="${c.g}" ${c.solo?`data-solo="${c.solo}"`:""}>▶ Play on this device</button></div>`).join("")}</div>`;
  h+=`<h3 style="margin-top:22px">🌐 Needs internet</h3><div class="off-grid">${OFF_NO.map(c=>`<div class="off-card no"><span class="off-tag no">Needs internet</span>

/* ---- local (offline) room: the host engine runs on this device only, no PeerJS ---- */
function createLocalRoom(game,solo){
  const name=String(S.ui.meName!==undefined?S.ui.meName:S.me.name).trim().slice(0,16)||"Player";
  S.me.name=name; S.me.av=S.ui.meAv||S.me.av;
  try{ localStorage.setItem("ngg_me",JSON.stringify({name:S.me.name,av:S.me.av})); }catch(e){}
  Object.assign(NET,{peer:null,role:"host",code:"LOCAL",conns:{},hostConn:null,leaving:false,settled:true,local:true});
  NET.R={code:"LOCAL",game,phase:"lobby",hostPid:S.me.pid,round:0,scores:{},msg:null,custom:null,g:null,evId:0,evPending:[],ev:null,
    settings:Object.assign({},DEFAULTS[game]),players:[{pid:S.me.pid,name:S.me.name,av:S.me.av,connected:true,left:false}]};
  if(game==="chess"&&solo==="local") NET.R.settings.solo="local";
  clearInterval(NET.timer); NET.timer=setInterval(hostTick,500);
  clearHash(); pushState();
}

/* ================= START ================= */
let ticker=null;
function startApp(){
  S=freshState();
  buildPad(); buildSkCanvas(); buildSpace();
  const app=$("app");
  app.addEventListener("click",onAppClick);
  app.addEventListener("pointerdown",chPointerDown);
  app.addEventListener("change",e=>{ onAppInput(e); onAppChange(e); });
  app.addEventListener("input",onAppInput);
  app.addEventListener("keydown",onAppKey);
  const ov=$("overlay");
  ov.addEventListener("click",onOverlayClick);
  $("sys").addEventListener("click",sysClick);
  document.addEventListener("keydown",onOverlayKey);
  if(!ticker) ticker=setInterval(()=>{
    document.querySelectorAll("[data-dl]").forEach(el=>{
      const s=Math.max(0,Math.ceil((+el.dataset.dl-(Date.now()+S.off))/1000));
      el.textContent=el.dataset.dlmode==="s"?String(s):"⏱ "+(s>=60?Math.floor(s/60)+":"+String(s%60).padStart(2,"0"):s+"s");
      el.classList.toggle("low",s<=5);
    });
  },250);
  const sess=getSession();
  const q=(new URLSearchParams(location.search).get("room")||"").trim().toUpperCase();
  if(sess&&sess.role==="guest"&&sess.code&&S.me.name){            // reconnect after a refresh
    S.screen="entry"; render(); joinRoom(sess.code); return;
  }
  clearSession();
  if(q){ S.screen="entry"; S.game=null; S.ui.joinCode=q; }
  render();
}
async function boot(){
  try{
    if(ONLINE){ setBoot(15,"Loading the multiplayer engine…"); await loadPeerLib(); }
    else setBoot(45,"You're offline – skipping online features…");
    setBoot(60,"Loading fonts…");
    if(document.fonts&&document.fonts.load) await Promise.race([document.fonts.load('600 1em Fredoka').catch(()=>{}),new Promise(r=>setTimeout(r,2500))]);
    setBoot(85,"Warming up the stars…");
    startApp();
    setBoot(100,"Ready for launch!");
  }catch(e){ SYS.boot=false; SYS.key="x"; sysReport(e,"load"); return; }
  setTimeout(()=>hideBoot(()=>{
    if(!ONLINE) SYS.offline=true;
    if(location.hash) applyRoute(); else { SYS.key="x"; render(); }
    registerSW();
  }),700);
}
boot();
