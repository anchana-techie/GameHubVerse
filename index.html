  const th=chTheme(v.settings), dk=th.dk, lt=th.lt, hints=v.settings.hints!=0;
  const ri=chRwIdx(v), snap=ri!=null?g.snaps[ri]:null, dec=snap?chDecode(snap.b):null, T=dec?dec.T:g.T, O=dec?dec.O:g.O;
  const mine=!snap&&chMyTurn(v), sel=snap?null:S.ui.chSel;
  const targets=new Map(); if(mine&&sel!=null&&hints) g.legal.forEach(m=>{ if(m[0]===sel) targets.set(m[1],1); });
  const kingHome=new Set(hex?B.players.map(p=>p.back[4]):[]);
  let h=`<svg class="ch-board" viewBox="${f(x0-pad)} ${f(y0-pad)} ${f(x1-x0+2*pad)} ${f(y1-y0+2*pad)}" xmlns="http://www.w3.org/2000/svg"><defs><radialGradient id="chk"><stop offset="0" stop-color="#ff2d2d" stop-opacity=".95"/><stop offset=".7" stop-color="#ff2d2d" stop-opacity=".45"/><stop offset="1" stop-color="#ff2d2d" stop-opacity="0"/></radialGradient></defs>`;
  B.cells.forEach((c,i)=>{
    const fill=kingHome.has(i)?th.kh:(B.col[i]===0?dk:lt), own=mine&&T[i]&&O[i]===g.turn&&!S.ui.chPromo;
    h+=`<polygon class="sq${own?" mine":""}" data-a="chcell" data-c="${i}" fill="${fill}" stroke="#0a0d2299" stroke-width=".02" points="${polys[i].map(p=>f(p[0])+","+f(p[1])).join(" ")}"><title>${c.label}</title></polygon>`;
  });
  const lm=snap?(snap.f>=0?{f:snap.f,t:snap.t}:null):g.last;
  if(lm){ [[lm.f,.14],[lm.t,.24]].forEach(([i,op])=>{ h+=`<polygon fill="#ffe98a" fill-opacity="${op}" stroke="#ffe98a" stroke-opacity=".38" stroke-width=".035" pointer-events="none" points="${polys[i].map(p=>f(p[0])+","+f(p[1])).join(" ")}"/>`; }); }   // subtle: pale tint, the destination a touch stronger than the origin
  (snap?snap.ck:g.chk).forEach(s=>{ const kc=O.findIndex((o,i)=>o===s&&T[i]===6); if(kc>=0) h+=`<circle cx="${f(ctr[kc][0])}" cy="${f(ctr[kc][1])}" r=".95" fill="url(#chk)" pointer-events="none"/>`; });
  if(sel!=null) h+=`<polygon fill="#46d6a4" fill-opacity=".5" stroke="#46d6a4" stroke-width=".07" pointer-events="none" points="${polys[sel].map(p=>f(p[0])+","+f(p[1])).join(" ")}"/>`;
  // coordinates
  B.cells.forEach((c,i)=>{
    const pl=polys[i], col=B.col[i]===0?lt:dk;
    if(hex){ if(!T[i]) h+=`<text x="${f(ctr[i][0])}" y="${f(ctr[i][1]+.12)}" font-size=".34" text-anchor="middle" fill="#000" fill-opacity=".38" pointer-events="none">${c.label}</text>`; return; }
    let be=0,le=0,bv=-1e9,lv=1e9;
    for(let j=0;j<4;j++){ const my=pl[j][1]+pl[(j+1)%4][1], mx=pl[j][0]+pl[(j+1)%4][0]; if(my>bv){ bv=my; be=j; } if(mx<lv){ lv=mx; le=j; } }
    const xs=pl.map(p=>p[0]), ys=pl.map(p=>p[1]);
    if(B.eN[i][be]<0) h+=`<text x="${f(Math.max(...xs)-.07)}" y="${f(Math.max(...ys)-.08)}" font-size=".26" text-anchor="end" font-weight="700" fill="${col}" pointer-events="none">${c.fl}</text>`;

  });
  // move hints
  targets.forEach((_,i)=>{
    if(T[i]) h+=`<circle cx="${f(ctr[i][0])}" cy="${f(ctr[i][1])}" r=".46" fill="none" stroke="#46d6a4" stroke-opacity=".85" stroke-width=".09" pointer-events="none"/>`;

  if(!snap&&g.ghosts&&g.ghosts.length){
    g.ghosts.forEach(gh=>{
      const el=Math.max(0,Math.min(5,(Date.now()+S.off-gh.at)/1000)), d=chDecode(gh.b), pl=chP(v,gh.seat), st=`animation-duration:5s;animation-delay:-${el.toFixed(2)}s`;

      }
    });
  }
  return h+`</svg>`;
}

function chTryMove(from,to){                         // shared by click and drag-and-drop; returns true if a move was sent / promotion opened
  const v=S.room; if(!v||!v.g||v.g.kind!=="ch"||!chMyTurn(v)||S.ui.chPromo) return false;
  const opts=v.g.legal.filter(m=>m[0]===from&&m[1]===to);
  if(!opts.length) return false;
  if(opts.length>1){ S.ui.chPromo={f:from,t:to,opts}; render(); return true; }
  S.ui.chSel=null; sendAct({a:"cmove",f:from,t:to,pr:opts[0][2]}); return true;
}
function chClick(c){
  const v=S.room; if(!v||!v.g||v.g.kind!=="ch"||!chMyTurn(v)) return;
  if(Date.now()<(S.ui.chNoClick||0)) return;         // this click is the tail of a drag
  const g=v.g, sel=S.ui.chSel;
  if(S.ui.chPromo) return;
  if(g.T[c]&&g.O[c]===g.turn){ S.ui.chSel=sel===c?null:c; return render(); }
  if(sel==null) return;
  if(!chTryMove(sel,c)){ S.ui.chSel=null; render(); }
}
/* ---- drag and drop: press a piece, drag it onto a square, release. A plain click still works as before. ---- */
let CHD=null;
function chPointerDown(e){
  if(e.button!==undefined&&e.button!==0) return;
  const el=e.target.closest&&e.target.closest("polygon.sq.mine"); if(!el) return;
  const v=S.room; if(!v||!v.g||v.g.kind!=="ch"||!chMyTurn(v)||S.ui.chPromo) return;
  const c=+el.dataset.c, svg=el.ownerSVGElement, vb=svg.viewBox.baseVal, r=svg.getBoundingClientRect();
  CHD={c,id:e.pointerId,x:e.clientX,y:e.clientY,on:false,size:(r.width/vb.width)*0.95,ghost:null};
  window.addEventListener("pointermove",chPointerMove);
  window.addEventListener("pointerup",chPointerUp);
  window.addEventListener("pointercancel",chPointerUp);
}
function chPointerMove(e){
  const d=CHD; if(!d||e.pointerId!==d.id) return;
  if(!d.on){
    if(Math.hypot(e.clientX-d.x,e.clientY-d.y)<6) return;
    const v=S.room; if(!v||!v.g||!chMyTurn(v)){ return chDragEnd(); }
    d.on=true; S.ui.chSel=d.c; S.ui.chDrag={on:true,from:d.c};
    const g=v.g, B=chBoard(g.id), pl=chP(v,g.O[d.c]);
    const gh=document.createElement("div"); gh.className="ch-ghost";
    gh.innerHTML=`<svg width="${d.size}" height="${d.size}" viewBox="-.5 -.5 1 1"><text x="0" y=".3" font-size=".92" text-anchor="middle" fill="${pl.fill}" stroke="${pl.stroke}" stroke-width=".05" style="paint-order:stroke;stroke-linejoin:round;font-family:'Segoe UI Symbol','Noto Sans Symbols 2','Noto Sans Symbols','DejaVu Sans',sans-serif">${CH_GLYPH[g.T[d.c]]}</text></svg>`;
    document.body.appendChild(gh); d.ghost=gh; document.body.classList.add("ch-dragging");
    render();                                          // shows the legal-move hints and dims the lifted piece
  }
  e.preventDefault();
  if(d.ghost){ d.ghost.style.left=e.clientX+"px"; d.ghost.style.top=e.clientY+"px"; }
}
function chPointerUp(e){
  const d=CHD; if(!d||(e.pointerId!==undefined&&e.pointerId!==d.id)) return;
  const was=d.on; let to=-1;
  if(was&&e.type==="pointerup"){
    if(d.ghost) d.ghost.style.display="none";
    const t=document.elementFromPoint(e.clientX,e.clientY), sq=t&&t.closest?t.closest("polygon.sq"):null;
    if(sq) to=+sq.dataset.c;
  }
  chDragEnd();
  if(was){
    S.ui.chNoClick=Date.now()+350;                     // swallow the click the browser fires after the drop
    if(to>=0&&to!==d.c&&chTryMove(d.c,to)) return;     // legal drop – move sent (or promotion chooser opened)
    render();                                          // illegal drop / cancelled: the piece snaps back, stays selected
  }
}
function chDragEnd(){
  const d=CHD; CHD=null;
  window.removeEventListener("pointermove",chPointerMove);
  window.removeEventListener("pointerup",chPointerUp);
  window.removeEventListener("pointercancel",chPointerUp);
  if(d&&d.ghost) d.ghost.remove();
  document.body.classList.remove("ch-dragging");
  if(S.ui) S.ui.chDrag=null;
}
function chPromote(pr){ const p=S.ui.chPromo; if(!p) return; S.ui.chPromo=null; S.ui.chSel=null; sendAct({a:"cmove",f:p.f,t:p.t,pr}); }

function buildSpace(){
  const mk=(id,n,max,cols)=>{ const el=$(id); if(!el) return; let sh=[];
    for(let i=0;i<n;i++){ sh.push(`${(Math.random()*100).toFixed(2)}vw ${(Math.random()*100).toFixed(2)}vh 0 ${(Math.random()*max).toFixed(2)}px ${cols[i%cols.length]}`); }
    el.style.boxShadow=sh.join(","); };
  mk("stars1",120,0,["#ffffffcc","#cfd8ff","#fff"]);
  mk("stars2",70,.6,["#ffffffaa","#ffe9c4","#bfe3ff"]);
  mk("stars3",14,1.3,["#fff","#aeb9ff","#ffd9a8"]);
  const moon=$("orbitMoon"), calm=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  const e=()=>{ const sys=moon&&moon.parentElement; return sys?sys.offsetWidth:100; };
  const place=t=>{ const R=e(), a=t*0.00042;                            // tilted circular orbit: wide in x, flattened in y
    const x=Math.cos(a)*R*1.05, y=Math.sin(a)*R*.34;
    moon.style.transform=`translate(${x.toFixed(1)}px,${y.toFixed(1)}px)`; moon.style.zIndex=y>0?3:1; };    // in front of Earth when below, behind when above
  const loop=t=>{ if(document.body.classList.contains("home")) place(t); if(!calm) requestAnimationFrame(loop); };
  if(moon){ place(2000); requestAnimationFrame(loop); }
}

/* ================= EJECTION CUTSCENE (Among-Us style) =================
   The host records an "ejection" whenever a player is voted out / exposed / eliminated (R.evPending -> R.ev).
   Every player's view carries the latest event, so every screen plays the same full-page airlock scene
   (~6 s, with sound, skippable) before the normal results screen is shown. */
const EJ={active:false,q:[],after:[],seen:new Set(),timers:[],ctx:null,aud:null,mute:false,reduce:false,cur:null};
try{ EJ.mute=localStorage.getItem("ngg_mute")==="1"; }catch(e){}
try{ EJ.reduce=!!(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches); }catch(e){}
const EJ_COLORS=["#ff6b81","#ffb24d","#ffd25e","#46d6a4","#4fc3ff","#6c7bff","#b57bff","#ff7bd0","#9cc66b"];

/* ---- host side: queue an ejection; pushState() turns the queue into one event ---- */
function ejItem(R,pid,o){ const p=R.players.find(x=>x.pid===pid)||{name:"?",av:"👤"}; return Object.assign({pid,name:p.name,av:p.av},o); }
function ejPush(R,it){ (R.evPending=R.evPending||[]).push(it); }
function ejFlush(R){ if(R.evPending&&R.evPending.length){ R.ev={id:(R.evId=(R.evId||0)+1),at:Date.now(),items:R.evPending}; R.evPending=[]; } }

/* ---- client side ---- */
function ejCheck(v){
  const ev=v&&v.ev; if(!ev||!ev.items||!ev.items.length) return;
  const key=v.code+"#"+ev.id; if(EJ.seen.has(key)) return; EJ.seen.add(key);
  if(v.now-ev.at>12000) return;                       // old event (e.g. we just reconnected) – don't replay it
  const wait=Math.max(0,(+ev.items[0].wait||0)-(v.now-ev.at)), go=()=>{ EJ.q.push({items:ev.items,me:v.me,peek:ev.items.every(i=>i.peek)}); if(!EJ.active) ejNext(); };
  if(wait>0) setTimeout(go,wait); else go();
}
function ejDefer(fn){ if(EJ.active||EJ.q.length) EJ.after.push(fn); else fn(); }
function ejNext(){
  const b=EJ.q.shift(); if(!b){ EJ.active=false; return; }
  EJ.active=true; EJ.cur=b;
  const root=$("eject"); root.classList.add("on"); root.classList.toggle("peek",!!b.peek);   // peek: a see-through scene - the board stays visible and playable
  const app=$("app"); if(app&&!b.peek) app.inert=true;
  try{ if(document.activeElement&&document.activeElement.blur) document.activeElement.blur(); }catch(e){}
  ejPlay(b.items,0,b.me);
}
function ejClear(){ EJ.timers.forEach(clearTimeout); EJ.timers=[]; if(EJ.aud){ try{ EJ.aud.stop(); }catch(e){} EJ.aud=null; } }
function ejPlay(items,i,me){
  ejClear();
  if(items[i].role) return ejRole(items,i,me);
  const it=items[i], root=$("eject");
  const you=it.pid&&it.pid===me, fill=s=>String(s==null?"":s).replace(/\{n\}/g,you?"You":it.name).replace(/\{was\}/g,you?"were":"was");
  const head=fill(it.h), sub=fill(it.s), epi=fill(it.e), eb=fill(it.eb);
  const acc=it.col||EJ_COLORS[Math.max(0,EMOJIS.indexOf(it.av))%EJ_COLORS.length];
  const T=it.T?(EJ.reduce?Math.min(it.T,5000):it.T):(EJ.reduce?4500:8200)+(epi?1600:0);
  // starfield (random per scene)
  const star=(n,mx)=>{ let a=[]; for(let k=0;k<n;k++) a.push(`${(Math.random()*100).toFixed(1)}vw ${(Math.random()*100).toFixed(1)}vh 0 ${(Math.random()*mx).toFixed(1)}px #fff`); return a.join(","); };
  let vent=""; for(let k=0;k<20;k++){ const a=(Math.random()*1.4-.7), d=14+Math.random()*34; vent+=`<i style="--dx:${(Math.cos(a)*d).toFixed(1)}vmin;--dy:${(Math.sin(a)*d).toFixed(1)}vmin;animation-delay:${(1.7+Math.random()*.25).toFixed(2)}s"></i>`; }
  root.innerHTML=`<div class="ej tone-${esc(it.tone||"bad")} ${it.none?"none":""} ${it.peek?"peek":""} ${EJ.reduce?"calm":""}" role="alertdialog" aria-modal="true" aria-label="${esc((eb+". "+head+" "+sub+" "+epi).trim())}" style="--T:${T}ms">
    <div class="ej-world">
      <div class="ej-stars" style="box-shadow:${star(70,0)}"></div><div class="ej-stars s2" style="box-shadow:${star(34,1.4)}"></div>
      <div class="ej-planet"></div><div class="ej-moon"></div>
      <div class="ej-hull"></div><div class="ej-frame"></div><div class="ej-hatch"></div><div class="ej-beacon"></div>
      ${it.none?"":`<div class="ej-astro"><div class="ej-fly">${astroSVG(acc,it.av)}</div></div>`}
      <div class="ej-glass t"></div><div class="ej-glass b"></div><div class="ej-vent">${vent}</div>
    </div>
    <div class="ej-alarm"></div><div class="ej-flash"></div>
    <div class="ej-eyebrow"></div>
    <div class="ej-text"><div class="ej-head" aria-hidden="true"></div><div class="ej-sub"></div>${epi?`<div class="ej-epi"></div>`:""}</div>
    <div class="ej-ui">${items.length>1?`<span class="ej-count">${i+1} / ${items.length}</span>`:""}
      <button type="button" class="ej-btn" id="ejMute" aria-label="Sound">${EJ.mute?"🔇":"🔊"}</button>
      <button type="button" class="ej-btn" id="ejSkip">Skip ⏭</button></div>
    <div class="ej-bar"></div></div>`;
  const q=s=>root.querySelector(s);
  q(".ej-eyebrow").textContent=eb; q(".ej-sub").textContent=sub; if(epi) q(".ej-epi").textContent=epi;
  q("#ejSkip").onclick=()=>ejSkip(); q("#ejMute").onclick=ejToggleMute; q("#ejSkip").focus();
  // the airlock opens at 1.7 s
  EJ.timers.push(setTimeout(()=>{ const e=root.querySelector(".ej"); if(e) e.classList.add("opened"); },1700));
  // typewriter headline
  const hd=q(".ej-head");
  if(EJ.reduce){ hd.textContent=head; hd.classList.add("done"); }
  else EJ.timers.push(setTimeout(()=>{
    let n=0; const step=()=>{
      n++; hd.textContent=head.slice(0,n); if(n%3===1) ejTick();
      if(n<head.length) EJ.timers.push(setTimeout(step,42)); else hd.classList.add("done"); };
    step(); },2600));
  EJ.aud=ejAudio(it);
  EJ.timers.push(setTimeout(()=>{ if(i+1<items.length) ejPlay(items,i+1,me); else ejEnd(); },T));
}
function ejSkip(){ if(!EJ.active) return; ejClear(); ejEnd(); }
function ejEnd(){
  ejClear();
  const root=$("eject"), e=root.querySelector(".ej");
  const fin=()=>{
    root.classList.remove("on","peek"); root.innerHTML="";
    const app=$("app"); if(app) app.inert=false;
    EJ.cur=null;
    const cbs=EJ.after.splice(0); cbs.forEach(f=>{ try{ f(); }catch(x){ console.error(x); } });
    if(EJ.q.length) ejNext(); else EJ.active=false;
    try{ render(); }catch(x){}
  };
  if(e){ e.classList.add("out"); EJ.timers.push(setTimeout(fin,380)); } else fin();
}
function ejToggleMute(){
  EJ.mute=!EJ.mute; try{ localStorage.setItem("ngg_mute",EJ.mute?"1":"0"); }catch(e){}
  const b=$("ejMute"); if(b) b.textContent=EJ.mute?"🔇":"🔊";
  if(EJ.mute&&EJ.aud){ try{ EJ.aud.stop(); }catch(e){} EJ.aud=null; }
}
function ejTick(){ if(EJ.aud&&EJ.aud.tick) EJ.aud.tick(); }
/* All sounds are synthesised with WebAudio – no audio files needed. */
function ejAudio(it){
  if(EJ.mute) return null;
  try{
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return null;
    const ctx=EJ.ctx||(EJ.ctx=new AC()); if(ctx.state==="suspended") ctx.resume();
    const t0=ctx.currentTime+.05, M=ctx.createGain(); M.gain.value=.9; M.connect(ctx.destination);
    const osc=(type,f1,f2,at,d,v)=>{ const o=ctx.createOscillator(), g=ctx.createGain(); o.type=type;
      o.frequency.setValueAtTime(f1,at); if(f2) o.frequency.exponentialRampToValueAtTime(f2,at+d);
      g.gain.setValueAtTime(.0001,at); g.gain.exponentialRampToValueAtTime(v,at+.02); g.gain.exponentialRampToValueAtTime(.0001,at+d);
      o.connect(g); g.connect(M); o.start(at); o.stop(at+d+.05); };
    const noise=(at,d,v,f1,f2,type)=>{ const n=Math.floor(ctx.sampleRate*d), b=ctx.createBuffer(1,n,ctx.sampleRate), a=b.getChannelData(0);
      for(let k=0;k<n;k++) a[k]=Math.random()*2-1;
      const s=ctx.createBufferSource(); s.buffer=b; const f=ctx.createBiquadFilter(); f.type=type||"bandpass"; f.Q.value=.8;
      f.frequency.setValueAtTime(f1,at); f.frequency.exponentialRampToValueAtTime(f2,at+d);
      const g=ctx.createGain(); g.gain.setValueAtTime(v,at); g.gain.exponentialRampToValueAtTime(.0001,at+d);
      s.connect(f); f.connect(g); g.connect(M); s.start(at); };
    if(it.role){                                                                   // secret-role reveal
      noise(t0+.15,1.4,.4,200,2600,"bandpass"); osc("sine",90,40,t0+.35,.7,.5);
      (it.sound==="spy"?[196,185,147]:[392,523,659,784]).forEach((f,k)=>osc(it.sound==="spy"?"sawtooth":"triangle",f,0,t0+1.4+k*.2,.6,it.sound==="spy"?.07:.15));
      return {tick(){},stop(){ try{ M.gain.cancelScheduledValues(ctx.currentTime); M.gain.setTargetAtTime(0,ctx.currentTime,.05); }catch(e){} }};
    }
    for(let k=0;k<6;k++) osc("square",k%2?520:780,0,t0+.1+k*.26,.2,.04);          // alarm
    osc("sine",120,38,t0+1.7,.6,.55);                                              // pressure thud
    noise(t0+1.7,1.2,.5,7000,1200,"highpass");                                     // hiss
    noise(t0+1.8,4.2,.45,260,3200,"bandpass");                                     // whoosh as they tumble away
    const tone=it.tone||"bad";
    if(it.none){ [330,262].forEach((f,k)=>osc("triangle",f,0,t0+3.4+k*.3,.5,.12)); }
    else if(tone==="good") [523,659,784,1047].forEach((f,k)=>osc("triangle",f,0,t0+3.4+k*.15,.5,.16));
    else [440,349,294,220].forEach((f,k)=>osc("sawtooth",f,0,t0+3.4+k*.22,.7,.07));
    return {
      tick(){ try{ osc("square",1500,0,ctx.currentTime+.005,.03,.02); }catch(e){} },
      stop(){ try{ M.gain.cancelScheduledValues(ctx.currentTime); M.gain.setTargetAtTime(0,ctx.currentTime,.05); }catch(e){} }
    };
  }catch(e){ return null; }
}
document.addEventListener("keydown",e=>{
  if(!EJ.active||(EJ.cur&&EJ.cur.peek)) return;
  if(e.key==="Escape"||e.key==="Enter"||e.key===" "){ e.preventDefault(); e.stopImmediatePropagation(); ejSkip(); }
},true);

function roleCheck(v){
  const g=v.g; if(!g||v.phase!=="play"||!g.ids||!g.ids.includes(v.me)) return;
  let it=null;
  if(g.kind==="spy"&&g.phase==="clues"&&g.cyc===1&&g.ids.every(p=>!g.clues[p].length)){
    const spy=!!g.my.knowsSpy;
    it={role:true,kind:"spy",spy,word:g.my.word,sound:spy?"spy":"civ",col:spy?"#ff4d5e":"#4fc3ff",emoji:spy?"🕵️":"🙂"};
  } else if(g.kind==="rr"&&g.phase==="roles"){
    const r=RR_ROLES[g.myRole], bad=r.key==="thief";
    it={role:true,kind:"rr",name:r.name,emoji:r.emoji,pts:r.pts,hint:r.hint||"Keep it secret until the Police is called 🤫",sound:bad?"spy":"civ",col:bad?"#ff4d5e":r.key==="police"?"#4fc3ff":"#ffd25e"};
  }
  if(!it) return;
  const key=v.code+"|"+v.deal+"|role"; if(EJ.seen.has(key)) return; EJ.seen.add(key);
  EJ.q.push({items:[it],me:v.me}); if(!EJ.active) ejNext();
}
function ejRole(items,i,me){
  const it=items[i], root=$("eject"), T=EJ.reduce?5000:8000;

function loadScript(src,ms){
  return new Promise(res=>{
    const s=document.createElement("script"); let done=false;
    const fin=ok=>{ if(done) return; done=true; clearTimeout(t); if(!ok) s.remove(); res(ok); };
    const t=setTimeout(()=>fin(false),ms||9000);
    s.src=src; s.async=true; s.onload=()=>fin(true); s.onerror=()=>fin(false); document.head.appendChild(s);
  });
}
let _peerP=null;
function loadPeerLib(){
  if(typeof Peer!=="undefined") return Promise.resolve(true);
  if(_peerP) return _peerP;
  _peerP=(async()=>{ for(const u of PEER_SRC){ if(await loadScript(u,9000)&&typeof Peer!=="undefined") return true; } return false; })();
  _peerP.then(()=>{ _peerP=null; },()=>{ _peerP=null; });
  return _peerP;
}
function probeNet(){
  return new Promise(res=>{
    if(navigator.onLine===false) return res(false);
    const c=new AbortController(), t=setTimeout(()=>{ c.abort(); res(false); },5000);
    fetch("https://unpkg.com/peerjs@1.5.4/package.json?_probe="+Date.now(),{mode:"no-cors",cache:"no-store",signal:c.signal}).then(()=>{ clearTimeout(t); res(true); },()=>{ clearTimeout(t); res(false); });
  });
}

/* ---- errors ---- */
function sysReport(err,kind){
  try{
    const msg=String((err&&err.message)||err||"Unknown error");
    console.error("[Game Hub]",err);
    if(/ResizeObserver loop/i.test(msg)||SYS.dismissed.has(msg)||SYS.err) return;
    const load=kind==="load";
    SYS.err={kind:load?"load":"game",title:load?"Couldn't load the game":"Mission glitch",
      msg:load?"Something needed to load didn't arrive. Check your connection and reload the page.":"Something went wrong while running the game. You can try to continue, or reload the page. If you were in a room, a refresh rejoins it automatically.",
      detail:(err&&err.stack)?String(err.stack):msg,fatal:false,raw:msg};
    renderSys();
  }catch(e){}
}
window.addEventListener("error",ev=>{
  if(ev.target&&ev.target!==window) return;                                  // resource load errors are handled where the resource is requested
  if(/extension:\/\//.test(ev.filename||"")||/ResizeObserver loop/i.test(ev.message||"")) return;
  if(!ev.error&&/^Script error/i.test(ev.message||"")) return;
  sysReport(ev.error||ev.message,"game");
});
window.addEventListener("unhandledrejection",ev=>{
  const r=ev.reason;
  if(!(r instanceof Error)||/Failed to fetch|NetworkError|Load failed|AbortError/i.test(r.message||"")) return;   // permission prompts, aborted requests, offline fetches …
  sysReport(r,"game");
});

/* ---- clicks on the system pages ---- */
function sysClick(e){
  const b=e.target.closest("[data-sys]"); if(!b) return;
  switch(b.dataset.sys){
    case "retry": {
      if(SYS.probing) return; SYS.probing=true; b.disabled=true; b.textContent="⏳ Checking…";
      probeNet().then(ok=>{ SYS.probing=false;
        if(ok){ ONLINE=true; SYS.offline=false; renderSys(); toast("✅ You're back online.","ok"); }
        else { b.disabled=false; b.textContent="🔄 Try again"; const m=$("sysMsg"); if(m) m.textContent="Still no connection – make sure Wi-Fi or mobile data is on, then try again."; } });
      break; }
    case "offmode": SYS.offline=false; SYS.route=null; if(!(S.screen==="room")){ S.screen="offline"; try{ history.replaceState(null,"","#/offline-mode"); }catch(x){} } SYS.key="x"; render(); break;
    case "dismiss": if(SYS.err){ SYS.dismissed.add(SYS.err.raw||""); SYS.err=null; } else SYS.offline=false; SYS.key="x"; renderSys(); break;
    case "closeRoute": SYS.route=null; clearHash(); SYS.key="x"; render(); break;
    case "joinRoute": SYS.route=null; clearHash(); S.notice=null; S.game=null; S.screen="entry"; SYS.key="x"; render(); break;
    case "reload": location.reload(); break;
    case "hub": SYS.err=null; SYS.route=null; SYS.key="x"; clearHash(); if(NET.role) cleanup(); else goHome(); break;
    case "cancelBusy": if(NET.abortJoin) NET.abortJoin(); break;
    case "copy": { const t=($("sysDetail")||{}).textContent||""; if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(()=>{ b.textContent="✅ Copied"; },()=>{}); break; }
  }
}
function clearHash(){ try{ if(location.hash) history.replaceState(null,"",location.pathname+location.search); }catch(e){} }

/* ---- #/routes (preview pages + unknown routes → 404) ---- */
function applyRoute(){
  const h=(location.hash||"").replace(/\/+$/,""), pages={"#/offline":"offline","#/offline-mode":"offline"};
  SYS.route=null; SYS.badPath="";
  if(h===""||h==="#"){ if(S&&S.screen==="offline") S.screen="landing"; }

function registerSW(){
  if(!("serviceWorker" in navigator)){ SWSTATE="unsupported"; return; }

  const secure=location.protocol==="https:"||/^(localhost|127\.|\[::1\])/.test(location.hostname);
  if(!secure){ SWSTATE="insecure"; return; }
  navigator.serviceWorker.register("sw.js").then(()=>navigator.serviceWorker.ready).then(()=>{ SWSTATE="ready"; if(S&&S.screen==="offline") render(); }).catch(()=>{ SWSTATE="error"; if(S&&S.screen==="offline") render(); });

/* ---- Coin Flip: no room, just this device. The side comes from crypto.getRandomValues (a fair 50/50, not Math.random). ---- */
const COIN={h:0,t:0,hist:[],last:null,deg:0,busy:false};
function coinSide(){
  try{ const a=new Uint8Array(1); crypto.getRandomValues(a); return (a[0]&1)?"H":"T"; }catch(e){ return Math.random()<.5?"H":"T"; }
}
function coinHTML(){
  const n=COIN.h+COIN.t, pc=x=>n?Math.round(x*100/n)+"%":"–";
  const res=COIN.busy?`<span class="mut">Flipping…</span>`:COIN.last?`<b class="coin-res ${COIN.last}">${COIN.last==="H"?"Heads!":"Tails!"}</b>`:`<span class="mut">Tap the coin or the button to flip</span>`;
  return `<div class="card2 coin-card">
    <div class="coin-stage"><button type="button" class="coin-toss" data-a="coinFlip" aria-label="Flip the coin" ${COIN.busy?"disabled":""}>
      <div class="coin" id="coin" style="transform:rotateY(${COIN.deg}deg)"><div class="coin-f h"><span>★</span><b>HEADS</b></div><div class="coin-f t"><span>✦</span><b>TAILS</b></div></div></button><div class="coin-shadow" id="coinShadow"></div></div>
    <div class="coin-out" id="coinOut" aria-live="polite">${res}</div>
    <button class="btn green block coin-btn" data-a="coinFlip" ${COIN.busy?"disabled":""}>🪙 Flip the coin</button>
    <div class="coin-tally"><div><span>Heads</span><b>${COIN.h}</b><i>${pc(COIN.h)}</i></div><div><span>Flips</span><b>${n}</b><i>this visit</i></div><div><span>Tails</span><b>${COIN.t}</b><i>${pc(COIN.t)}</i></div></div>
    ${COIN.hist.length?`<div class="coin-hist" aria-label="Last flips">${COIN.hist.map(x=>`<span class="${x}">${x}</span>`).join("")}</div>`:""}
    ${n?`<div style="text-align:center;margin-top:10px"><button class="btn secondary" data-a="coinReset">↺ Reset count</button></div>`:""}
    <p class="mut" style="font-size:.82rem;text-align:center;margin:12px 0 0">Each flip is a fresh 50/50 from your device's secure random generator. No room, nothing saved – works offline too.</p></div>`;
}
function coinFlip(){
  if(COIN.busy) return;
  const side=coinSide(), slow=!matchMedia("(prefers-reduced-motion:reduce)").matches;
  COIN.busy=true;
  // spin 5–7 whole turns, landing on 0° (heads) or 180° (tails)
  const turns=5+Math.floor(Math.random()*3);
  COIN.deg=(Math.floor(COIN.deg/360)+turns)*360+(side==="T"?180:0);
  const coin=document.getElementById("coin");
  if(coin){                                               // animate in place – no re-render while it spins
    document.querySelectorAll('[data-a="coinFlip"]').forEach(b=>b.disabled=true);
    const out=document.getElementById("coinOut"); if(out) out.innerHTML=`<span class="mut">Flipping…</span>`;
    const toss=coin.parentElement, sh=document.getElementById("coinShadow");
    coin.style.transition=slow?"transform 1.6s cubic-bezier(.15,.6,.25,1)":"none";
    if(slow){ toss.classList.remove("up"); void toss.offsetWidth; toss.classList.add("up"); sh&&sh.classList.remove("up"); sh&&void sh.offsetWidth; sh&&sh.classList.add("up"); }
    coin.style.transform=`rotateY(${COIN.deg}deg)`;
  }
  try{ navigator.vibrate&&navigator.vibrate(25); }catch(e){}
  setTimeout(()=>{
    COIN.busy=false; COIN.last=side; COIN[side==="H"?"h":"t"]++;
    COIN.hist.unshift(side); if(COIN.hist.length>20) COIN.hist.length=20;
    try{ navigator.vibrate&&navigator.vibrate(side==="H"?[30,40,30]:60); }catch(e){}
    if(S.screen==="coin") render();
  },coin&&slow?1650:150);
}

/* ---- password recovery without e-mail: a security question ----
   At registration the password is encrypted with a key made from the answer (PBKDF2 -> AES-GCM) and stored in recovery/<email>.
   "Forgot password": the right answer decrypts it, signs the person in, and the new password replaces it. The answer never leaves the browser. */
const RC_QS=["The name of my first pet","The city I was born in","My best friend's first name","My favourite food","My childhood nickname","My favourite game in Game Hub"];
const rcNorm=a=>String(a||"").trim().toLowerCase().replace(/\s+/g," ");
const rcB64=u=>btoa(String.fromCharCode(...new Uint8Array(u))), rcUn=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function rcKey(answer,salt,iter){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(rcNorm(answer)),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:iter,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
}
async function rcPack(q,answer,pass){
  const salt=crypto.getRandomValues(new Uint8Array(16)), iv=crypto.getRandomValues(new Uint8Array(12)), iter=250000, key=await rcKey(answer,salt,iter);
  const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},key,new TextEncoder().encode(pass));
  return {q,salt:rcB64(salt),iv:rcB64(iv),ct:rcB64(ct),iter,updatedAt:fbNow()};
}
async function rcOpen(answer,d){
  const key=await rcKey(answer,rcUn(d.salt),d.iter||250000);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:rcUn(d.iv)},key,rcUn(d.ct)));
}
const rcSave=async(email,q,answer,pass)=>FBD.collection("recovery").doc(email).set(await rcPack(q,answer,pass));

function trackRoom(v){

    const key=v.code+"|"+v.game+"|"+(v.hist||[]).length;

function trackEnd(reason,v){
  if(!TR.key||!FBD||!AUTH.user||AUTH.state!=="in"){ TR.key=null; return; }
  const dur=Math.round((Date.now()-TR.start)/1000), g=TR.game, done=reason==="end"&&!!v; let score=0, won=false;
  if(done){
    const b=v.base||{}, all=v.players.map(p=>(v.scores[p.pid]||0)-(b[p.pid]||0)); score=(v.scores[v.me]||0)-(b[v.me]||0);
    won=score>0&&score>=Math.max(...all);
  }
  const up={totalSeconds:fbInc(dur)}; up["stats."+g+".seconds"]=fbInc(dur);
  if(done){ up["stats."+g+".completed"]=fbInc(1); up["stats."+g+".score"]=fbInc(score); if(won) up["stats."+g+".wins"]=fbInc(1); }
  FBD.collection("users").doc(AUTH.user.uid).update(up).catch(()=>{});
  fbLogTo(AUTH.user.uid,"game",{game:g,role:TR.host?"host":"player",durationSec:dur,completed:done,won,score,players:TR.players,room:TR.code});

}

    await FBD.collection("invites").doc(email).set({email,name,status:"invited",invitedAt:fbNow(),invitedBy:AUTH.user.email});
    S.ui.admEmail=""; S.ui.admName=""; toast("Invited "+email+". Share the site link so they can register.","ok");
  }catch(e){ toast(fbErrText(e),"err"); }
}
async function admRemove(email){
  const u=Object.values(AUTH.adm.users).find(x=>x.email===email);
  try{
    if(u){
      const acts=await FBD.collection("users").doc(u.id).collection("activity").get();
      for(let i=0;i<acts.docs.length;i+=400){ const b=FBD.batch(); acts.docs.slice(i,i+400).forEach(d=>b.delete(d.ref)); await b.commit(); }
      await FBD.collection("users").doc(u.id).delete();
      await FBD.collection("recovery").doc(email).delete().catch(()=>{});
      if(fbIsMaster()){                       // drop their group presence and mark them removed so the groups' "My groups" panels stop showing them
        try{
          const gs=(await FBD.collection("drawGroups").get()).docs.map(d=>d.id);
          for(const g of gs){
            await FBD.collection("drawGroups").doc(g).collection("presence").doc(email.toLowerCase()).delete().catch(()=>{});
            const ms=await FBD.collection("drawGroups").doc(g).collection("members").where("gameMail","==",email.toLowerCase()).get();
            for(const d of ms.docs) await d.ref.update({removedAt:fbNow()});
          }
        }catch(e){ console.warn("group cleanup failed",e); }
      }
      await FBD.collection("invites").doc(email).set({email,name:u.name||"",status:"removed",removedAt:fbNow(),invitedBy:AUTH.user.email},{merge:true});
    } else await FBD.collection("invites").doc(email).delete();
    toast(u?"Account removed – they can't sign in any more.":"Invite revoked.","ok");
  }catch(e){ toast(fbErrText(e),"err"); }
}
async function admSetRole(email,role){
  if(!fbIsMaster()) return toast("Only the master admin can change admin roles.","err");
  const u=Object.values(AUTH.adm.users).find(x=>x.email===email); if(!u) return;
  try{ await FBD.collection("users").doc(u.id).update({role}); toast(role==="admin"?"They are an admin now.":"Admin role removed.","ok"); }catch(e){ toast(fbErrText(e),"err"); }
}
async function admReinvite(email){
  try{ await FBD.collection("invites").doc(email).set({email,status:"invited",invitedAt:fbNow(),invitedBy:AUTH.user.email},{merge:true}); toast("Invited again.","ok"); }catch(e){ toast(fbErrText(e),"err"); }
}
async function admMail(email){
  const c=xmCfg(); if(!c.service) return toast("E-mail sending isn't set up (the e-mail draws use EmailJS) – use Copy link instead.","err");
  const html=`<div style="font-family:Arial,sans-serif;font-size:16px;color:#222">You've been invited to <b>Game Hub</b>! Open <a href="${admLink()}">${admLink()}</a>, choose <b>Register</b> and use this e-mail address (${esc(email)}).</div>`;

}
async function admLoadAct(uid,store,key){
  store[key]=null; render();

function admRows(){
  const A=AUTH.adm, byEmail={}, rows=[], seen=new Set();
  Object.values(A.users).forEach(u=>{ byEmail[u.email]=u; });
  A.invites.forEach(i=>{ const u=byEmail[i.id]||null; seen.add(i.id);
    rows.push({email:i.id,name:(u&&u.name)||i.name||"",inv:i,u,status:u?"active":i.status==="invited"?"invited":"removed"}); });
  Object.values(A.users).forEach(u=>{ if(!seen.has(u.email)) rows.push({email:u.email,name:u.name,inv:null,u,status:"active",admin:u.role==="admin"}); });
  const q=authVal("admQ").toLowerCase();
  return rows.filter(r=>!q||(r.email+" "+r.name).toLowerCase().includes(q)).sort((a,b)=>fbMs(b.u&&b.u.lastLoginAt)-fbMs(a.u&&a.u.lastLoginAt)||a.email.localeCompare(b.email));
}

    const isAdm=!!(u&&u.role==="admin"), me=u&&AUTH.user&&u.id===AUTH.user.uid, isMst=r.email===MASTER_EMAIL, iAmMst=fbIsMaster();

      <td data-l="Games" ${u&&u.lastGame?`title="Last played: ${esc(gameLabel(u.lastGame))}"`:""}>${u?(u.gamesPlayed||0)+" · "+fbDur(u.totalSeconds):"–"}</td><td class="mut adm-dev" data-l="Device">${u?esc(u.device||"–"):"–"}</td><td class="wide" data-l="Game view">${gv}</td><td class="adm-ac wide">${acts}</td></tr>`;
    if(open&&u) row+=`<tr class="adm-det"><td colspan="8"><div class="mut" style="margin-bottom:6px">Registered ${fbDate(fbMs(u.createdAt))} · ${esc(u.email)}</div><h4>Games</h4>${statsTableHTML(u.stats)}<h4 style="margin-top:12px">Recent activity</h4>${actListHTML(A.act[u.id])}</td></tr>`;
    return row;
  }).join("")+`</tbody></table></div>`;
  return h+`</div>`;
}

/* ================= START ================= */
let ticker=null;
function startApp(){
  S=freshState();
  setTimeout(fbInit,0);
  buildPad(); buildSkCanvas(); buildSpace();
  const app=$("app");
  app.addEventListener("click",onAppClick);
  app.addEventListener("pointerdown",chPointerDown);
  app.addEventListener("change",e=>{ onAppInput(e); onAppChange(e); });
  app.addEventListener("input",onAppInput);
  app.addEventListener("keydown",onAppKey);
  const ov=$("overlay");
  ov.addEventListener("click",onOverlayClick);
  $("sys").addEventListener("click",sysClick);
  voiceBind();
  document.addEventListener("keydown",onOverlayKey);
  if(!ticker) ticker=setInterval(()=>{
    document.querySelectorAll("[data-dl]").forEach(el=>{
      const s=Math.max(0,Math.ceil((+el.dataset.dl-(Date.now()+S.off))/1000));
      el.textContent=el.dataset.dlmode==="s"?String(s):el.dataset.dlmode==="clk"?"⏱ "+Math.floor(s/60)+":"+String(s%60).padStart(2,"0"):"⏱ "+(s>=60?Math.floor(s/60)+":"+String(s%60).padStart(2,"0"):s+"s");
      el.classList.toggle("low",s<=5);
    });
  },250);
  const sess=getSession();
  const q=(new URLSearchParams(location.search).get("room")||"").trim().toUpperCase();
  if(sess&&sess.role==="guest"&&sess.code&&S.me.name){            // reconnect after a refresh
    S.screen="entry"; render(); joinRoom(sess.code); return;
  }
  clearSession();
  if(q){ S.screen="entry"; S.game=null; S.ui.joinCode=q; }
  render();
}
async function boot(){
  try{
    if(ONLINE){ setBoot(15,"Loading the multiplayer engine…"); await loadPeerLib(); }
    else setBoot(45,"You're offline – skipping online features…");
    setBoot(60,"Loading fonts…");
    if(document.fonts&&document.fonts.load) await Promise.race([document.fonts.load('600 1em Fredoka').catch(()=>{}),new Promise(r=>setTimeout(r,2500))]);
    setBoot(85,"Warming up the stars…");
    startApp();
    setBoot(100,"Ready for launch!");
  }catch(e){ SYS.boot=false; SYS.key="x"; sysReport(e,"load"); return; }
  setTimeout(()=>hideBoot(()=>{
    if(!ONLINE) SYS.offline=true;
    if(location.hash) applyRoute(); else { SYS.key="x"; render(); }
    registerSW();
  }),700);
}
boot();
