/*CHESS-HOST-START*/
/* A human who leaves / is kicked / goes offline hands their seat to the computer. When fewer than 2 humans remain in a
   game that started with several, the game stops: everyone sees the "less players than required" scene and goes back to the room. */
function chTakeover(R,i){
  const g=R.g; if(!g||!g.seats[i]||g.seats[i].bot) return;
  g.seats[i]={bot:true,lvl:R.settings.level||2}; g.rem[i]=0; g.drawBy=null; g.botBusy=false;
  if(g.P.turn===i) g.tAt=Date.now();
}
/* A human who leaves, is kicked or loses their connection is OUT: their pieces are removed from the board (they fade away) and the
   others carry on. On the 2-player board that simply ends the game. If fewer than 2 humans would remain in a multiplayer game, it stops. */
function chLeave(R,pid,why){
  const g=R.g; if(!g||g.phase==="reveal") return;
  const idx=[]; g.seats.forEach((s,i)=>{ if(s.pid===pid&&!s.bot) idx.push(i); });
  if(!idx.length) return;
  const lost=why==="lost", gen=()=>{ if(lost||R._kick!==pid) ejPush(R,ejItem(R,pid,lost?{eb:"SIGNAL LOST",h:"{n} lost connection.",s:"Their pieces vanish from the board.",tone:"bad",peek:true}:{eb:"PLAYER LEFT",h:"{n} abandoned ship.",s:"They left the game.",tone:"bad",peek:g.P.np>=3})); };
  if(g.multi&&g.seats.filter((s,i)=>!s.bot&&!idx.includes(i)).length<2){ gen(); abort(R,"A player left, so the chess game was stopped (a multiplayer game needs at least 2 people)."); return; }
  if(g.P.np<3) gen();
  idx.forEach(i=>{ if(g.P.alive[i]) chEliminate(R,i,"left"); g.seats[i]={bot:true,out:true,pid}; g.rem[i]=0; });
  g.drawBy=null; g.botBusy=false;
  chResolve(R);
}
function chAbortCheck(R){
  const g=R.g; if(!g||!g.multi||g.phase==="reveal") return false;
  if(g.seats.filter(s=>!s.bot).length<2){ abort(R,"A player left, so the chess game was stopped (a multiplayer game needs at least 2 people)."); return true; }
  return false;
}
/* ---------- CHESS (host side) ----------
   1 player  -> classic board, vs the computer or pass-and-play      2 players -> classic board
   3 players -> hexagon, last king standing                          4 players -> cross board, points
   A player who is checkmated / stalemated / out of time / resigned is out. 3 players: their pieces are removed.
   4 players: their pieces turn grey ("dead"): they stay on the board, block lines and can be captured for 0 points. */
const chSeatOf=(g,pid)=>g.seats.findIndex(s=>s.pid===pid&&!s.bot);
function chKey(P){
  let s=""; for(let c=0;c<P.B.N;c++) s+=String.fromCharCode(48+P.T[c]*6+(P.O[c]+1));
  return s+P.turn+"|"+Array.from(P.cr).join("")+"|"+P.epT;
}
function chDeal(R){
  const st=R.settings, humans=R.players.filter(p=>!p.left).map(p=>p.pid), n=humans.length;
  const id=Math.max(2,Math.min(4,Math.max(+st.players||2,n)));        // seats chosen by the host; empty seats are played by the computer
  let seats;
  if(n===1&&id===2){
    if(st.solo==="local") seats=[{pid:humans[0]},{pid:humans[0]}];
    else {
      const hs=st.side==="white"?0:st.side==="black"?1:Math.floor(Math.random()*2);
      seats=[null,null]; seats[hs]={pid:humans[0]}; seats[1-hs]={bot:true,lvl:st.level};
    }
  } else {
    const rot=(R.round-1)%n;
    const order=st.seat==="random"?shuffle(humans):humans.slice(rot).concat(humans.slice(0,rot));
    seats=order.map(pid=>({pid}));
    while(seats.length<id) seats.push({bot:true,lvl:st.level||2});
    if(st.seat==="random") seats=shuffle(seats);
  }
  const P=chPos(id), mins=st.clock||0;
  R.g={kind:"ch",phase:"play",id,P,seats,local:n===1&&id===2&&st.solo==="local",multi:n>=2,
    clockOn:mins>0,rem:seats.map(s=>s.bot?0:mins*60000),inc:(st.inc||0)*1000,tAt:Date.now(),
    last:null,checks:[],legal:[],hist:[],caps:seats.map(()=>[]),elim:[],drawBy:null,res:null,reps:{},lastSeat:-1,botBusy:false,deadline:0,
    snaps:[{b:chSnapStr(P),f:-1,t:-1,s:-1,x:"Start",ck:[]}],ghosts:[]};
  if(id===2) R.g.reps[chKey(P)]=1;
  chResolve(R);
}
function chEliminate(R,p,why,credit){
  const g=R.g,P=g.P,B=P.B; if(!P.alive[p]) return;
  P.alive[p]=false; g.elim.push({seat:p,why,ply:P.ply});
  const grey=B.dead&&why!=="left";                                      // cross board: a checkmated player's pieces turn grey; a player who LEFT has them removed
  if(!grey) (g.ghosts=g.ghosts||[]).push({seat:p,b:chSnapStr(P),at:Date.now()});   // the pieces fade out slowly instead of vanishing
  if(B.np===4){ if(why==="mate"&&credit!=null&&credit!==p) P.pts[credit]+=20; else if(why==="stalemate") P.pts[p]+=20; }
  for(let c=0;c<B.N;c++) if(P.O[c]===p){ if(grey) P.O[c]=CH_DEAD; else { P.T[c]=0; P.O[c]=-1; P.PR[c]=0; } }
  P.kc[p]=-1; P.cr[p]=0;
  if(P.epO===p){ P.epT=-1; P.epP=-1; P.epO=-1; }
  if(P.turn===p) P.turn=chNextAlive(P,p);
  g.hist.push({s:p,t:{mate:"✖ checkmated",stalemate:"✖ stalemated",time:"✖ out of time",resign:"✖ resigned",left:"✖ left the game"}[why]||"✖ out"});
  if(P.np>=3){                                                          // 3P / 4P: out players get the airlock treatment
    const pl=chPl(B,chTheme(R.settings),p), st=g.seats[p], left=P.alive.filter(Boolean).length;
    const sn=i=>{ const x=g.seats[i]; return x&&x.pid?skPn(R,x.pid):"Computer"; };
    const heads={mate:"{n} {was} checkmated"+(credit!=null&&credit!==p?" by "+sn(credit):"")+"!",stalemate:"{n} {was} stalemated!",time:"{n} ran out of time!",resign:"{n} resigned.",left:"{n} abandoned ship."};
    if(!(why==="left"&&R._kick===st.pid)) ejPush(R,ejItem(R,st.pid,{...(st.bot?{name:"The "+pl.name+" computer",av:"🤖"}:{}),eb:pl.name.toUpperCase()+" IS OUT",h:heads[why]||"{n} {was} out!",
      s:"Their pieces "+(grey?"turn into grey space debris":"vanish into the void")+" – "+left+" player"+(left===1?"":"s")+" left.",
      col:pl.fill,tone:"neutral",peek:true,wait:why==="mate"?(B.dead?3500:5200):0}));   // checkmate: let everyone see the final position (pieces fading) BEFORE the airlock scene covers the screen
    g.grace=6500+(why==="mate"?(B.dead?3500:5200):0);                                                       // the next clock starts after the cutscene
  }
}
function chOver(R){
  const g=R.g,P=g.P, alive=[]; P.alive.forEach((a,i)=>{ if(a) alive.push(i); });
  if(alive.length<=1){ chFinish(R,{type:"last",winner:alive.length?alive[0]:null}); return true; }
  let n=0,one=0;
  for(let c=0;c<P.B.N;c++){ const o=P.O[c]; if(o>=0&&o<CH_DEAD&&P.T[c]!==6){ n++; one=P.T[c]; } }
  if(n===0||(n===1&&(one===2||one===3))){ chFinish(R,{type:"draw",why:"not enough material to checkmate"}); return true; }
  if(P.half>=50*alive.length){ chFinish(R,{type:"draw",why:"50 moves without a capture or pawn move"}); return true; }
  if(g.id===2&&(g.reps[chKey(P)]||0)>=3){ chFinish(R,{type:"draw",why:"threefold repetition"}); return true; }
  return false;
}
function chResolve(R){
  const g=R.g,P=g.P;
  for(let guard=0;guard<10;guard++){
    if(chOver(R)) return;
    const p=P.turn, lm=chLegal(P,p);
    if(lm.length){
      g.legal=lm; g.tAt=Date.now()+(g.grace||0); g.grace=0; g.checks=[];
      P.alive.forEach((a,i)=>{ if(a&&P.kc[i]>=0&&chAttacked(P,P.kc[i],i)) g.checks.push(i); });
      return;
    }
    const att=[]; chAtk(P,P.kc[p],p,att);
    if(att.length) chEliminate(R,p,"mate",att.includes(g.lastSeat)?g.lastSeat:att[0]);
    else if(P.np===2){ chFinish(R,{type:"draw",why:"stalemate"}); return; }
    else chEliminate(R,p,"stalemate");

function chFinish(R,res){
  const g=R.g,P=g.P,n=P.np;
  g.phase="reveal"; g.legal=[]; g.checks=[]; g.deadline=0; g.drawBy=null;
  const sp=new Array(n).fill(0), alive=[]; P.alive.forEach((a,i)=>{ if(a) alive.push(i); });
  let winners=[];
  if(n===2){
    if(res.type==="draw") sp.fill(1); else if(res.winner!=null){ sp[res.winner]=2; winners=[res.winner]; }
  } else if(n===3){
    if(res.type==="draw"){ alive.forEach(i=>{ sp[i]=alive.length===3?1:2; }); }
    else if(res.winner!=null){
      sp[res.winner]=3; winners=[res.winner];
      const second=g.elim.length?g.elim[g.elim.length-1].seat:-1; if(second>=0&&second!==res.winner) sp[second]=1;
    }
  } else {
    for(let i=0;i<n;i++) sp[i]=P.pts[i];
    const mx=Math.max(...sp); winners=sp.map((v,i)=>v===mx?i:-1).filter(i=>i>=0);
  }
  const byPid={}, pids=new Set(g.seats.filter(s=>!s.bot).map(s=>s.pid));
  if(!g.local) g.seats.forEach((s,i)=>{ if(!s.bot) byPid[s.pid]=(byPid[s.pid]||0)+sp[i]; });
  addScore(R,byPid);
  g.res=Object.assign({},res,{seatPts:sp,winners,pts:byPid,winPids:winners.filter(i=>!g.seats[i].bot).map(i=>g.seats[i].pid)});
}
function chApply(R,mv){
  const g=R.g,P=g.P,p=P.turn,seat=g.seats[p],now=Date.now(),B=P.B;
  if(g.clockOn&&!seat.bot) g.rem[p]=Math.max(0,g.rem[p]-Math.max(0,now-g.tAt))+g.inc;
  const cc=mv.k===2?P.epP:mv.t, capT=P.T[cc], capO=P.O[cc], capPR=P.PR[cc];

  P.ply++; g.last={f:mv.f,t:mv.t,s:p}; g.lastSeat=p; g.drawBy=null;
  const hi=g.hist.length; g.hist.push({s:p,t:txt});

    g.snaps.push({b:chSnapStr(P),f:mv.f,t:mv.t,s:p,x:txt,ck}); }

function chLose(R,p,why){

function chAct(R,pid,m){
  const g=R.g,P=g.P; if(g.phase!=="play") return;

function chBotMove(R,g){

function chTick(R,now){

function chView(R,pid){

/* Popups live in their own persistent #overlay root (outside #app), so a re-render of the page can never
   swallow a click, and the page-level click handler can't be blocked by the dialog. */
let _ovKey="", _ovModal=false;
function showModal(m){ S.modal=m; renderOverlay(); }
function closeModal(){ S.modal=null; renderOverlay(); }
function renderOverlay(){
  const ov=$("overlay"); if(!ov||!S) return;
  const m=S.modal, t=S.toast;
  const key=JSON.stringify([m&&[m.title,m.text,m.ok,!!m.danger],t&&[t.type,t.text]]);
  if(key!==_ovKey){
    _ovKey=key;
    ov.innerHTML=(t?`<div class="msg toast ${esc(t.type)}" role="status" data-m="toast">${esc(t.text)}</div>`:"")+
      (m?`<div class="modal-back" id="modalBack"><div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="modalTitle" aria-describedby="modalText">
        <h3 id="modalTitle">${esc(m.title)}</h3><p id="modalText">${esc(m.text)}</p>
        <div class="btns"><button type="button" class="btn secondary" id="modalNo" data-m="no">${esc(m.cancel||"Cancel")}</button>
        <button type="button" class="btn ${m.danger?"danger":"green"}" id="modalYes" data-m="yes">${esc(m.ok)}</button></div></div></div>`:"");
  }
  if(m&&!_ovModal){ const y=$("modalYes"); if(y) y.focus(); }
  _ovModal=!!m;
}
function modalYes(){
  const m=S.modal||{}, a=m.act; S.modal=null; renderOverlay();
  if(a==="exitgame") sendAct({a:"tolobby"});
  else if(a==="kick"&&m.pid) sendAct({a:"kick",pid:m.pid});
  else if(a==="chresign") sendAct({a:"resign"});
  else if(a==="fbremove"&&m.key) admRemove(m.key);
  else if(a==="fbrole"&&m.key) admSetRole(m.key,m.role);

function onOverlayClick(e){
  const b=e.target.closest("[data-m]");
  if(b){
    if(b.dataset.m==="yes") modalYes();
    else if(b.dataset.m==="no") closeModal();
    else if(b.dataset.m==="toast"){ S.toast=null; renderOverlay(); }

  }
  if(e.target.id==="modalBack") closeModal();            // click on the dark backdrop = cancel

function onOverlayKey(e){
  if(!S.modal) return;
  if(e.key==="Escape"){ e.preventDefault(); closeModal(); }
  else if(e.key==="Tab"){                                  // keep keyboard focus inside the dialog
    const a=$("modalNo"), b=$("modalYes"); if(!a||!b) return;
    if(e.shiftKey&&document.activeElement===a){ e.preventDefault(); b.focus(); }
    else if(!e.shiftKey&&document.activeElement===b){ e.preventDefault(); a.focus(); }
    else if(document.activeElement!==a&&document.activeElement!==b){ e.preventDefault(); b.focus(); }
  }
}

/* ================= VOICE CHAT (group call, WebRTC mesh over PeerJS media calls) =================
   Security model
   - Mic is never opened until the player taps "Join voice" (user gesture, https only) and stays OFF until they turn it on.
   - Audio goes straight between players (DTLS-SRTP encrypted). It never touches Firebase or any server of ours and is never recorded.
   - The host is the authority: it publishes the roster of who is in voice (peer ids read from the real connection, never
     taken from a client's message). A player only answers calls from peer ids on that roster, so strangers cannot be heard.
     Admin watchers are never on the roster.
   - The host can mute anyone or switch voice off for the room; every browser enforces it on the receiving side too. */
function voiceView(R){
  const V=R.voice||{on:true,st:{},hm:{}}, ids={}, mic={};
  if(V.on) R.players.forEach(p=>{ const s=V.st[p.pid]; if(s&&!p.left&&p.connected){ ids[p.pid]=s.peer; mic[p.pid]=s.mic?1:0; } });
  return {on:V.on, ids, mic, hm:Object.keys(V.hm).filter(k=>V.hm[k]&&ids[k])};
}
function voiceAct(R,pid,m){
  const V=R.voice||(R.voice={on:true,st:{},hm:{}}), host=pid===R.hostPid, v=m&&m.v;
  if(v==="join"){
    if(!V.on||isLeft(R,pid)) return;
    const peer=host?(NET.peer&&NET.peer.id):(NET.conns[pid]&&NET.conns[pid].peer);   // authenticated id of the connection
    if(peer) V.st[pid]={peer,mic:false};
  }
  else if(v==="leave") delete V.st[pid];
  else if(v==="mic"){ const s=V.st[pid]; if(s) s.mic=!!m.on&&!V.hm[pid]; }
  else if(v==="mute"&&host){
    const t=String(m.pid||""); if(t===R.hostPid||!V.st[t]) return;
    V.hm[t]=!!m.on; if(m.on) V.st[t].mic=false;
  }
  else if(v==="room"&&host){ V.on=!!m.on; if(!V.on){ V.st={}; V.hm={}; } }
}

const VC={on:false,starting:false,stream:null,calls:{},aud:{},pend:{},an:{},ctx:null,mode:"open",mic:false,ptt:false,deaf:false,vol:1,open:false,key:"",tm:null,lv:null,joinAt:0};
const voiceOK=()=>window.isSecureContext&&navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.RTCPeerConnection;
const voiceShown=()=>S&&S.screen==="room"&&S.room&&S.room.voice&&NET.role&&!NET.local&&!NET.spec&&NET.peer;
const voicePidOf=peerId=>{ const o=S.room.voice.ids; return Object.keys(o).find(k=>k!==S.room.me&&o[k]===peerId)||null; };

async function voiceJoin(){
  const v=S.room; if(!v||VC.on||VC.starting||!v.voice.on) return;
  if(!voiceOK()){ toast("Voice chat needs a secure (https) page and a browser with microphone support.","err"); return; }
  VC.starting=true; voiceDock();
  try{
    const st=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},video:false});
    if(!voiceShown()||!S.room.voice.on){ st.getTracks().forEach(t=>t.stop()); throw "gone"; }
    VC.stream=st; VC.on=true; VC.mic=false; VC.ptt=false; VC.deaf=false;
    st.getAudioTracks().forEach(t=>{ t.enabled=false; });                               // muted until the player says otherwise
    try{ VC.ctx=new (window.AudioContext||window.webkitAudioContext)(); VC.ctx.resume(); }catch(e){ VC.ctx=null; }
    voiceWatch("me",st);
    NET.peer.on("call",voiceIncoming);
    clearInterval(VC.tm); VC.tm=setInterval(voiceReconcile,4000);
    clearInterval(VC.lv); VC.lv=setInterval(voiceLevels,150);
    VC.joinAt=Date.now(); sendAct({a:"voice",v:"join"});
  }catch(e){
    if(e!=="gone") toast(e&&e.name==="NotAllowedError"?"Microphone access was blocked. Allow it in your browser's site settings, then try again.":e&&e.name==="NotFoundError"?"No microphone was found on this device.":"Could not start the microphone.","err");
  }
  VC.starting=false; VC.key=""; voiceDock();
}
function voiceStop(silent){
  const was=VC.on;
  clearInterval(VC.tm); clearInterval(VC.lv);
  try{ NET.peer&&NET.peer.off("call",voiceIncoming); }catch(e){}
  Object.keys(VC.calls).forEach(k=>voiceDrop(k,VC.calls[k]));
  Object.values(VC.pend).forEach(c=>{ try{ c.close(); }catch(e){} });
  Object.keys(VC.an).forEach(k=>voiceUnwatch(k));
  try{ VC.stream&&VC.stream.getTracks().forEach(t=>t.stop()); }catch(e){}         // releases the microphone
  try{ VC.ctx&&VC.ctx.close(); }catch(e){}
  Object.assign(VC,{on:false,starting:false,stream:null,calls:{},aud:{},pend:{},an:{},ctx:null,mic:false,ptt:false,tm:null,lv:null,key:""});
  const a=$("voiceAud"); if(a) a.innerHTML="";
  if(was&&!silent) try{ sendAct({a:"voice",v:"leave"}); }catch(e){}
  voiceDock();
}
function voiceIncoming(call){
  if(!VC.on||!VC.stream||!S.room){ try{ call.close(); }catch(e){} return; }
  const pid=voicePidOf(call.peer);
  if(pid) return voiceAnswer(call,pid);
  VC.pend[call.peer]=call;                                                              // the roster may not have reached us yet: wait briefly, then refuse
  setTimeout(()=>{ if(VC.pend[call.peer]===call){ delete VC.pend[call.peer]; try{ call.close(); }catch(e){} } },6000);
}
function voiceAnswer(call,pid){
  if(VC.calls[pid]) voiceDrop(pid,VC.calls[pid]);
  call.answer(VC.stream); voiceWire(call,pid);
}
function voiceWire(call,pid){
  VC.calls[pid]=call;
  call.on("stream",rs=>{ if(VC.calls[pid]===call) voiceAttach(pid,rs); });
  call.on("close",()=>voiceDrop(pid,call)); call.on("error",()=>voiceDrop(pid,call));
  call._t=setTimeout(()=>{ if(!VC.aud[pid]) voiceDrop(pid,call); },15000);              // never connected: the next reconcile retries
}
function voiceDrop(pid,call){
  if(call){ clearTimeout(call._t); try{ call.close(); }catch(e){} }
  if(VC.calls[pid]!==call) return;
  delete VC.calls[pid];
  const a=VC.aud[pid]; if(a){ a.srcObject=null; a.remove(); delete VC.aud[pid]; }
  voiceUnwatch(pid);
}
function voiceAttach(pid,rs){
  const tracks=rs.getAudioTracks(); if(!tracks.length) return;                          // audio only, ignore anything else
  const ms=new MediaStream(tracks), a=VC.aud[pid]||document.createElement("audio");
  a.autoplay=true; a.playsInline=true; a.srcObject=ms; VC.aud[pid]=a;
  if(!a.parentNode) $("voiceAud").appendChild(a);
  voiceWatch(pid,ms); voiceVol(); a.play().catch(()=>{});
}
function voiceVol(){
  const vo=S.room&&S.room.voice; if(!vo) return;
  Object.keys(VC.aud).forEach(pid=>{ const a=VC.aud[pid]; a.volume=VC.vol; a.muted=VC.deaf||vo.hm.includes(pid); });
}
function voiceMicApply(){
  const vo=S.room&&S.room.voice, held=vo&&vo.hm.includes(S.room.me);
  const live=VC.on&&!held&&(VC.mode==="open"?VC.mic:VC.ptt);
  if(VC.stream) VC.stream.getAudioTracks().forEach(t=>{ t.enabled=!!live; });
}
function voiceAnnounce(){ sendAct({a:"voice",v:"mic",on:VC.mode==="open"?VC.mic:true}); }   // push-to-talk shows as "ready"; each press is not broadcast
function voiceDial(pid,peerId){
  let call; try{ call=NET.peer.call(peerId,VC.stream); }catch(e){ return; }
  if(call) voiceWire(call,pid);
}
function voiceReconcile(){
  if(!VC.on||!voiceShown()) return;
  const v=S.room, vo=v.voice, me=v.me;
  Object.keys(VC.calls).forEach(pid=>{ const c=VC.calls[pid]; if(!(pid in vo.ids)||c.peer!==vo.ids[pid]) voiceDrop(pid,c); });
  Object.keys(vo.ids).forEach(pid=>{
    if(pid===me||VC.calls[pid]) return;
    const peerId=vo.ids[pid], waiting=VC.pend[peerId];
    if(waiting){ delete VC.pend[peerId]; voiceAnswer(waiting,pid); }
    else if(me<pid) voiceDial(pid,peerId);                                              // the lower id dials, the other waits: never two calls per pair
  });
}
function voiceSync(){
  if(!voiceShown()){ if(VC.on||VC.stream) voiceStop(true); voiceDock(); return; }
  const v=S.room, vo=v.voice;
  if(VC.on){
    if(!vo.on){ voiceStop(true); toast("The host turned voice chat off.","info"); return; }
    if(!(v.me in vo.ids)&&Date.now()-VC.joinAt>3000){ VC.joinAt=Date.now(); sendAct({a:"voice",v:"join"}); }   // e.g. after a reconnect
    if(vo.hm.includes(v.me)&&VC.mic) VC.mic=false;
    voiceMicApply(); voiceVol(); voiceReconcile();
  }
  voiceDock();
}

/* ---- speaking indicator ---- */
function voiceWatch(id,stream){
  if(!VC.ctx) return; voiceUnwatch(id);
  try{
    const src=VC.ctx.createMediaStreamSource(stream), an=VC.ctx.createAnalyser(); an.fftSize=256; src.connect(an);
    VC.an[id]={src,an,buf:new Uint8Array(an.fftSize)};
  }catch(e){}
}
function voiceUnwatch(id){ const w=VC.an[id]; if(w){ try{ w.src.disconnect(); }catch(e){} delete VC.an[id]; } }
function voiceLevels(){
  if(!S.room||!S.room.voice||!VC.stream) return;
  const vo=S.room.voice, me=S.room.me;
  document.querySelectorAll("#voice [data-vp]").forEach(el=>{
    const pid=el.dataset.vp, mine=pid===me, w=VC.an[mine?"me":pid]; let on=false;
    const silenced=mine?!VC.stream.getAudioTracks().some(t=>t.enabled):(VC.deaf||vo.hm.includes(pid));
    if(w&&!silenced){
      w.an.getByteTimeDomainData(w.buf); let m=0; for(let i=0;i<w.buf.length;i++) m=Math.max(m,Math.abs(w.buf[i]-128));
      on=m>9;
    }
    el.classList.toggle("speak",on);
  });
}

/* ---- dock UI (re-rendered only when something visible changes) ---- */
function voiceDock(){
  const root=$("voice"); if(!root) return;
  if(!voiceShown()){ if(root.innerHTML){ root.innerHTML=""; VC.key=""; } return; }
  const v=S.room, vo=v.voice, host=v.me===v.hostPid;
  const inV=v.players.filter(p=>p.pid in vo.ids||(p.pid===v.me&&VC.on));
  const key=JSON.stringify([VC.open,VC.on,VC.starting,VC.mode,VC.mic,VC.deaf,vo.on,host,vo.ids,vo.mic,vo.hm,inV.map(p=>p.name+p.av)]);
  if(key===VC.key) return; VC.key=key;
  const held=vo.hm.includes(v.me);
  let h;
  if(!VC.open){
    h=`<button type="button" class="vc-fab ${VC.on?"live":""}" data-v="toggle" aria-label="Open voice chat">${VC.on?(held?"🔇":(VC.mode==="open"&&VC.mic)?"🎙":"🎧"):"🎙"} Voice${inV.length?` · ${inV.length}`:""}</button>`;
  } else {
    h=`<div class="vc-panel" role="region" aria-label="Voice chat"><h4><span>🎙 Voice chat</span><button type="button" class="btn secondary" data-v="toggle" aria-label="Close voice panel">✕</button></h4>`;
    if(!vo.on) h+=`<div class="msg info" style="margin:6px 0">The host has turned voice chat off for this room.</div>`;
    if(!VC.on){
      h+=`<div class="vc-note">Talk with everyone in this room. Audio goes directly between players, encrypted, and is never recorded or stored. Your mic stays off until you switch it on.</div>`;
      if(!voiceOK()) h+=`<div class="msg warn" style="margin:6px 0">Your browser or this page doesn't allow microphone use (it needs https).</div>`;
      h+=`<button type="button" class="btn green block" data-v="join" ${vo.on&&voiceOK()&&!VC.starting?"":"disabled"}>${VC.starting?"Starting…":"🎧 Join voice"}</button>`;
    }
    if(inV.length) h+=`<div style="margin-top:10px">${inV.map(p=>{
      const me=p.pid===v.me, hm=vo.hm.includes(p.pid), on=me?(VC.mode==="open"?VC.mic:true):vo.mic[p.pid];
      return `<div class="vc-row" data-vp="${esc(p.pid)}"><span>${p.av}</span><span class="nm">${esc(p.name)}${me?" (you)":""}</span><span title="${hm?"Muted by host":on?"Mic on":"Mic off"}">${hm?"🛡🔇":on?"🎙":"🔇"}</span>${host&&!me?`<button type="button" data-v="hmute" data-pid="${esc(p.pid)}" title="${hm?"Allow":"Mute"} ${esc(p.name)} for everyone">${hm?"Unmute":"Mute"}</button>`:""}</div>`;
    }).join("")}</div>`;
    if(VC.on){
      h+=`<div class="vc-ctl">`;
      if(VC.mode==="open") h+=`<button type="button" class="btn ${VC.mic&&!held?"green":"secondary"}" data-v="mic" ${held?"disabled":""}>${held?"🛡 Muted by host":VC.mic?"🎙 Mic on":"🔇 Mic off"}</button>`;
      else h+=`<button type="button" class="btn ptt secondary" id="vcPtt" ${held?"disabled":""}>${held?"🛡 Muted by host":"🎙 Hold to talk (V)"}</button>`;
      h+=`<select data-v="mode" aria-label="Mic mode"><option value="open" ${VC.mode==="open"?"selected":""}>Open mic</option><option value="ptt" ${VC.mode==="ptt"?"selected":""}>Push to talk</option></select>
        <button type="button" class="btn ${VC.deaf?"danger":"secondary"}" data-v="deaf">${VC.deaf?"🔇 Speaker off":"🔊 Speaker on"}</button>
        <input type="range" min="0" max="1" step="0.05" value="${VC.vol}" data-v="vol" aria-label="Volume">
        <button type="button" class="btn secondary" data-v="leave">Leave voice</button></div>`;
    }
    if(host) h+=`<div class="vc-ctl"><button type="button" class="btn ${vo.on?"secondary":"green"}" data-v="room">${vo.on?"⛔ Turn voice off for room":"✅ Turn voice on for room"}</button></div>`;
    h+=`</div>`;
  }
  root.innerHTML=h;
}
function voiceClick(e){
  const b=e.target.closest("[data-v]"); if(!b||b.tagName==="INPUT"||b.tagName==="SELECT") return;
  const a=b.dataset.v;
  if(a==="toggle"){ VC.open=!VC.open; VC.key=""; voiceDock(); }
  else if(a==="join") voiceJoin();
  else if(a==="leave") voiceStop();
  else if(a==="mic"){ VC.mic=!VC.mic; voiceMicApply(); voiceAnnounce(); voiceDock(); }
  else if(a==="deaf"){ VC.deaf=!VC.deaf; voiceVol(); voiceDock(); }
  else if(a==="hmute"&&b.dataset.pid) sendAct({a:"voice",v:"mute",pid:b.dataset.pid,on:!S.room.voice.hm.includes(b.dataset.pid)});
  else if(a==="room") sendAct({a:"voice",v:"room",on:!S.room.voice.on});
}
function voiceInput(e){
  const t=e.target; if(!t.dataset||!t.dataset.v) return;
  if(t.dataset.v==="vol"){ VC.vol=Math.min(1,Math.max(0,+t.value||0)); voiceVol(); }      // no re-render: keeps the slider draggable
  else if(t.dataset.v==="mode"&&VC.on&&e.type==="change"){ VC.mode=t.value==="ptt"?"ptt":"open"; VC.ptt=false; voiceMicApply(); voiceAnnounce(); VC.key=""; voiceDock(); }
}
function voicePtt(on){
  if(!VC.on||VC.mode!=="ptt"||VC.ptt===on) return;
  VC.ptt=on; voiceMicApply(); const b=$("vcPtt"); if(b) b.classList.toggle("hold",on);
}
function voiceBind(){
  const r=$("voice"); if(!r) return;
  r.addEventListener("click",voiceClick); r.addEventListener("input",voiceInput); r.addEventListener("change",voiceInput);
  r.addEventListener("pointerdown",e=>{ if(e.target.closest("#vcPtt")){ e.preventDefault(); voicePtt(true); } });
  ["pointerup","pointercancel","blur"].forEach(ev=>window.addEventListener(ev,()=>voicePtt(false)));
  const typing=e=>/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)||e.target.isContentEditable;
  document.addEventListener("keydown",e=>{ if(e.code==="KeyV"&&!e.repeat&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!typing(e)) voicePtt(true); });
  document.addEventListener("keyup",e=>{ if(e.code==="KeyV") voicePtt(false); });
  window.addEventListener("pagehide",()=>{ try{ VC.stream&&VC.stream.getTracks().forEach(t=>t.stop()); }catch(e){} });
}

const ROSTER_KEY="ngg_rosters";

function rosterSave(game){

const XM_CFG_KEY="xm_emailjs";
function xmCfg(){
  let c={}; try{ c=JSON.parse(localStorage.getItem(XM_CFG_KEY))||{}; }catch(e){}
  return {service:c.service||"", template:c.template||"", key:c.key||""};
}
function xmSaveCfg(c){ try{ localStorage.setItem(XM_CFG_KEY,JSON.stringify(c)); }catch(e){} }
function emailCfgOk(){ const c=xmCfg(); return !!(c.service&&c.template&&c.key); }
function cfgHTML(){

  return `<details class="cfg" open><summary>📧 Email settings (EmailJS) – shared by the email games</summary>
    <div class="msg info" style="font-size:.85rem">Emails are sent from the browser through <b>EmailJS</b>. In your template set <b>To Email</b> to <code>{{to_email}}</code> and put <code>{{{message_html}}}</code> (three braces) in the body so the pink text shows.</div>

const EMAIL_RE=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;
function derangement(n){
  const idx=[...Array(n).keys()];
  do{
    for(let i=n-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [idx[i],idx[j]]=[idx[j],idx[i]]; }
  }while(idx.some((v,i)=>v===i));
  return idx;
}
function xmCollect(){
  const x=S.xm, names=[], emails=[];
  for(let i=0;i<x.n;i++){ names.push((x.names[i]||"").trim()); emails.push((x.emails[i]||"").trim().toLowerCase()); }
  return {names,emails};
}

}
async function emailSend({to_email,to_name,subject,value,html,text}){
  const c=xmCfg();
  const res=await fetch("https://api.emailjs.com/api/v1.0/email/send",{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({service_id:c.service,template_id:c.template,user_id:c.key,template_params:{
      to_email,to_name,subject,christ_child_name:value,message_html:html,message:text}})
  });
  if(!res.ok) throw new Error((await res.text())||res.status);
}
async function xmSend(i){
  const x=S.xm, child=x.names[x.assign[i]];
  await emailSend({to_email:x.emails[i],to_name:x.names[i],subject:"Your Christ Child 🎁",value:child,
    html:xmEmailHTML(child),text:`Your Christ Child is ${child}`});
}
async function xmRun(onlyFailed){
  const x=S.xm; x.busy=true; x.err=null; render();
  for(let i=0;i<x.n;i++){
    if(onlyFailed && x.status[i]==="sent") continue;
    x.status[i]="sending"; render();
    try{ await xmSend(i); x.status[i]="sent"; }
    catch(e){ x.status[i]="failed"; x.err=String(e.message||e); }
    render();
  }
  x.busy=false; render();
}
async function xmDraw(){
  const x=S.xm, all=xmCollect(), idx=[...Array(x.n).keys()].filter(i=>x.on[i]!==false);
  const names=idx.map(i=>all.names[i]), emails=idx.map(i=>all.emails[i]);
  const fail=t=>{ S.notice={type:"err",text:t}; render(); };
  if(idx.length<2) return fail("Tick at least 2 players to include in the draw.");
  if(names.some(n=>!n)) return fail("Please enter a name for every player.");
  if(new Set(names.map(n=>n.toLowerCase())).size!==names.length) return fail("Player names must be unique.");
  if(emails.some(e=>!EMAIL_RE.test(e))) return fail("Please enter a valid email id for every player.");
  if(new Set(emails).size!==emails.length) return fail("Each player needs a different email id.");
  if(!emailCfgOk()) return fail("Please fill in all three EmailJS settings below.");
  if(!confirm("Draw and send emails to "+names.length+" player"+(names.length===1?"":"s")+"?\n\n"+names.map((n,i)=>n+" – "+emails[i]).join("\n"))) return;
  x.names=all.names; x.emails=all.emails; rosterSave("xm");
  x.full={n:x.n,names:all.names,emails:all.emails,on:x.on.slice()};      // everyone, so "Start over" brings the ticks back
  x.names=names; x.emails=emails; x.n=names.length; x.on=[];
  x.assign=derangement(x.n);
  x.status=names.map(()=> "pending");
  x.step="result"; S.notice=null;
  xmRun(false);
}

    if(onlyFailed && x.status[i]==="sent") continue;
    x.status[i]="sending"; render();
    try{ await dwSend(i); x.status[i]="sent"; }
    catch(e){ x.status[i]="failed"; x.err=String(e.message||e); }
    render();
  }
  x.busy=false; render();
}
async function dwDraw(){
  const x=S.dw, all=dwCollect(), idx=[...Array(x.n).keys()].filter(i=>x.on[i]!==false);
  const names=idx.map(i=>all.names[i]), emails=idx.map(i=>all.emails[i]);
  const fail=t=>{ S.notice={type:"err",text:t}; render(); };
  if(idx.length<2) return fail("Tick at least 2 players to include in the draw.");
  if(names.some(n=>!n)) return fail("Please enter a name for every player.");
  if(new Set(names.map(n=>n.toLowerCase())).size!==names.length) return fail("Player names must be unique.");
  if(emails.some(e=>!EMAIL_RE.test(e))) return fail("Please enter a valid email id for every player.");
  if(new Set(emails).size!==emails.length) return fail("Each player needs a different email id.");
  if(!emailCfgOk()) return fail("Please fill in all three EmailJS settings below.");
  if(!confirm("Draw and send emails to "+names.length+" player"+(names.length===1?"":"s")+"?\n\n"+names.map((n,i)=>n+" – "+emails[i]).join("\n"))) return;
  x.names=all.names; x.emails=all.emails; rosterSave("dw");
  x.full={n:x.n,names:all.names,emails:all.emails,on:x.on.slice()};      // everyone, so "Start over" brings the ticks back
  x.names=names; x.emails=emails; x.n=names.length; x.on=[];
  x.assign=derangement(x.n);
  x.status=names.map(()=>"pending");
  x.step="result"; S.notice=null;
  dwRun(false);
}

  h+=`<label>Total number of players</label><input type="number" id="dwN" min="2" max="30" value="${x.n}" style="max-width:160px">`;

/* ---- Registered players for the email draws ----
   Each person has a Name, a Gmail (real inbox – the draw result is e-mailed here) and an optional Game mail (the fake
   @gamehubverse address they log in with). The master puts people into GROUPS:
     drawGroups/{groupId}/members/{gmail}  { name, gmail, gameMail, groups:[...] }   – the people of a group
     gameMailGroups/{gameMail}             { groups:[...] }                          – which groups a login belongs to
   A user can read only the groups listed under their own login e-mail (firestore.rules); the master manages everything. */
const DREG={groups:[],loaded:false,sel:null,members:[],busy:false,err:null,edit:false};
function drawEditOff(){ DREG.edit=false; Object.keys(S.ui).filter(k=>/^p[ngm]\d+$/.test(k)).forEach(k=>delete S.ui[k]); }
const myGroupIds=()=>fbIsMaster()?DREG.groups:(AUTH.groups||[]);
const gidOk=g=>/^[A-Za-z0-9][A-Za-z0-9 _-]{0,29}$/.test(g);
const mailOk=e=>EMAIL_RE.test(e)&&!e.includes("/");
const pGmail=c=>c.gmail!==undefined?c.gmail:(c.email||"");          // may be empty – the Gmail is optional
const pIdOf=p=>p.gmail||p.gameMail;                                // a person is stored under their Gmail, or their Game mail when there is no Gmail

/* Write one person: put them in exactly `groups` (all other groups lose them), keep gameMailGroups in step. `old` = their previous record, if any. */
async function drawPersonWrite(old,p,groups){
  const FV=firebase.firestore.FieldValue, ref=g=>FBD.collection("drawGroups").doc(g).collection("members");
  const oldId=old?old.id:null, newId=pIdOf(p), oldGm=old&&old.gameMail?old.gameMail.toLowerCase():"";
  const ops=[];
  DREG.groups.forEach(g=>{
    if(oldId&&oldId!==newId) ops.push(ref(g).doc(oldId).delete());
    if(groups.includes(g)) ops.push(ref(g).doc(newId).set({name:p.name,gmail:p.gmail,gameMail:p.gameMail,groups,addedAt:fbNow()}));
    else ops.push(ref(g).doc(newId).delete());
  });
  if(oldGm&&oldGm!==p.gameMail) ops.push(FBD.collection("gameMailGroups").doc(oldGm).delete());
  if(p.gameMail) ops.push(groups.length?FBD.collection("gameMailGroups").doc(p.gameMail).set({groups}):FBD.collection("gameMailGroups").doc(p.gameMail).delete());
  await Promise.all(ops);
}
function drawReadPerson(name,gmail,gameMail){
  name=String(name||"").trim(); gmail=String(gmail||"").trim().toLowerCase(); gameMail=String(gameMail||"").trim().toLowerCase();
  if(!name) return {err:"Enter a name."};
  if(!gmail&&!gameMail) return {err:"Enter a Gmail or a Game mail (at least one)."};
  if(gmail&&!mailOk(gmail)) return {err:"Gmail doesn't look right."};
  if(gameMail&&!mailOk(gameMail)) return {err:"Game mail doesn't look right (leave it empty if they haven't registered yet)."};
  if(gameMail&&gmail&&gameMail===gmail) return {err:"Game mail must be the GameHubVerse login, not the same as the Gmail."};
  return {p:{name,gmail,gameMail}};
}
async function drawRegAdd(){
  const r=drawReadPerson(S.ui.drName,S.ui.drGmail,S.ui.drGame); if(r.err) return toast(r.err,"err");

  if(!gs.length) return toast("Tick at least one group.","err");

    const docs=await Promise.all(DREG.groups.map(g=>FBD.collection("drawGroups").doc(g).collection("members").doc(pIdOf(r.p)).get()));
    const have=docs.map((d,i)=>d.exists?DREG.groups[i]:null).filter(Boolean), prev=docs.find(d=>d.exists);
    const all=[...new Set([...have,...gs])];
    await drawPersonWrite(prev?Object.assign({id:prev.id},prev.data()):null,r.p,all);      // passing the previous record cleans up an old Game mail link
    S.ui.drName=""; S.ui.drGmail=""; S.ui.drGame=""; toast("Saved "+r.p.name+" in "+all.join(", ")+".","ok");
    await drawRegLoad();

}
async function drawRegSaveAll(){                   // one button saves every row that changed
  const jobs=[];
  for(let i=0;i<DREG.members.length;i++){
    const c=DREG.members[i], ui=k=>S.ui[k+i]!==undefined?S.ui[k+i]:null;
    const r=drawReadPerson(ui("pn")!==null?ui("pn"):c.name, ui("pg")!==null?ui("pg"):pGmail(c), ui("pm")!==null?ui("pm"):c.gameMail);
    if(r.err) return toast("Row "+(i+1)+" ("+(c.name||"?")+"): "+r.err,"err");
    const groups=[...document.querySelectorAll('[data-pgrp="'+i+'"]')].filter(el=>el.checked).map(el=>el.dataset.g).sort();
    const was=(c.groups||[DREG.sel]).slice().sort().join("|");

  }
  if(!jobs.length){ drawEditOff(); render(); return toast("Nothing changed.","info"); }
  try{
    for(const j of jobs) await drawPersonWrite(j[0],j[1],j[2]);
    drawEditOff();
    toast("Saved "+jobs.length+" change"+(jobs.length===1?"":"s")+".","ok"); await drawRegLoad();
  }catch(e){ toast(fbErrText(e),"err"); }
}

async function drawGroupRename(old){            // master only (the whole screen is master only, and so are the rules)
  const nu=String(prompt("New name for group "+old+":",old)||"").trim().toUpperCase();
  if(!nu||nu===old) return;
  if(!gidOk(nu)) return toast("Group ID: letters, numbers, space, - or _ (max 30).","err");
  if(DREG.groups.includes(nu)) return toast("A group called "+nu+" already exists.","err");
  const FV=firebase.firestore.FieldValue, col=g=>FBD.collection("drawGroups").doc(g);
  try{
    const ms=await col(old).collection("members").get();
    await col(nu).set({createdAt:fbNow()},{merge:true});
    for(const d of ms.docs){
      const m=d.data(), gs=(m.groups||[old]).map(g=>g===old?nu:g);
      await col(nu).collection("members").doc(d.id).set(Object.assign({},m,{groups:gs}));
      for(const g of gs) if(g!==nu) await col(g).collection("members").doc(d.id).update({groups:gs}).catch(()=>{});   // same person in other groups
      const gm=(m.gameMail||"").toLowerCase();
      if(gm){ await FBD.collection("gameMailGroups").doc(gm).set({groups:FV.arrayUnion(nu)},{merge:true}); await FBD.collection("gameMailGroups").doc(gm).update({groups:FV.arrayRemove(old)}); }
      await d.ref.delete();
    }
    await col(old).delete(); DREG.sel=nu; toast("Renamed to "+nu+".","ok"); await drawRegLoad();
  }catch(e){ toast(fbErrText(e),"err"); }
}

/* Everyone in my groups (not me), with live status: {name, gm (their login e-mail), groups, on, joined, ms} – online first. */
function prPeople(){

document.addEventListener("visibilitychange",()=>prBeat(document.visibilityState==="visible"));

/* ================= MATES: game requests and one-to-one chat =================
   Peer to peer over PeerJS (WebRTC data channels), like the game rooms – nothing is written to Firebase or any server.
   - Every signed-in player who has groups also opens a personal "mate link": a PeerJS peer with an id made from their login e-mail
     (wfgm-<hash>), so a mate can reach them while their Game Hub tab is open.
   - A connection starts with {t:"hi",from:<login e-mail>}. Only people in my groups are accepted; their name comes from the group list.
   - Messages: inv (game request: game + room code), invr (accepted / declined), msg (chat line), ack (delivered).
   - Chats live in this tab only (sessionStorage): they survive a refresh and are gone when the tab or browser is closed, or on sign-out.
   - A second Game Hub tab of the same person can send but not receive (the id is taken by the first tab). */
const MATE={peer:null,ready:false,dup:false,owner:"",starting:false,conns:{},pend:{},sent:{},inbox:[],chat:{},open:null,unread:{},pick:null,after:null,note:"",tick:null,el:null,cel:null,nel:null,nt:null};
const MATE_GAMES=["spy","raja","Scribblio","chess","dots","ludo","rps","number"];
const MATE_TTL=60000, MATE_KEY="gh_mchat";
function mateHash(str){
  const h=seed=>{ let h1=0xdeadbeef^seed, h2=0x41c6ce57^seed;
    for(let i=0;i<str.length;i++){ const c=str.charCodeAt(i); h1=Math.imul(h1^c,2654435761); h2=Math.imul(h2^c,1597334677); }
    h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
    h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
    return (4294967296*(2097151&h2)+(h1>>>0)).toString(36); };
  return h(11)+h(29);
}
const mateId=gm=>"wfgm-"+mateHash("gamehubverse|"+String(gm).toLowerCase());
const mateMe=()=>AUTH.user&&AUTH.user.email?AUTH.user.email.toLowerCase():"";
const mateMyName=()=>String((AUTH.profile&&AUTH.profile.name)||S.me.name||mateMe().split("@")[0]).slice(0,30);
const matePerson=gm=>prPeople().find(p=>p.gm===gm);
const mateNameOf=gm=>{ const p=matePerson(gm); return p?p.name:(MATE.chat[gm]&&MATE.chat[gm].name)||gm.split("@")[0]; };
const mateUnreadTotal=()=>Object.values(MATE.unread).reduce((a,b)=>a+b,0);
function mateSentState(gm){
  const s=MATE.sent[gm]; if(!s) return "";
  if(s.status==="sending") return "sending request…";
  if(s.status==="sent") return Date.now()-s.at<MATE_TTL?"request sent ⏳":"no answer";
  return {accepted:"✅ accepted",declined:"❌ declined",failed:"⚠ couldn't reach",busy:"busy"}[s.status]||"";
}

/* ---- this tab's chats (sessionStorage only) ---- */
function mateLoadChats(){
  try{ const d=JSON.parse(sessionStorage.getItem(MATE_KEY)); if(d&&d.owner===MATE.owner){ MATE.chat=d.chat||{}; MATE.unread=d.unread||{}; return; } }catch(e){}
  MATE.chat={}; MATE.unread={};
}
function mateSaveChats(){ try{ sessionStorage.setItem(MATE_KEY,JSON.stringify({owner:MATE.owner,chat:MATE.chat,unread:MATE.unread})); }catch(e){} }

/* ---- start / stop the mate link with the sign-in ---- */
function mateSync(){
  const me=prActive()?mateMe():"";
  if(!me){ mateStop(!AUTH.user); return; }
  if(MATE.owner!==me){ mateStop(true); MATE.owner=me; mateLoadChats(); }
  if(MATE.peer||MATE.starting) return;
  MATE.starting=true;
  loadPeerLib().then(ok=>{ MATE.starting=false; if(ok&&prActive()&&mateMe()===MATE.owner&&!MATE.peer) mateOpen(false); });
}
function mateStop(wipe){
  try{ MATE.peer&&MATE.peer.destroy(); }catch(e){}
  Object.assign(MATE,{peer:null,ready:false,dup:false,conns:{},pend:{},pick:null,after:null});
  MATE.inbox=[]; mateInvRender();
  if(wipe){ MATE.chat={}; MATE.unread={}; MATE.sent={}; MATE.open=null; MATE.owner=""; try{ sessionStorage.removeItem(MATE_KEY); }catch(e){} mateChatRender(); }
}
function mateOpen(dup){
  let peer; try{ peer=dup?new Peer(iceConfig()):new Peer(mateId(MATE.owner),iceConfig()); }catch(e){ return; }
  MATE.peer=peer; MATE.dup=dup;
  peer.on("open",()=>{ if(MATE.peer!==peer) return; MATE.ready=true; MATE.note=dup?"Game Hub is open in another tab – requests and chats arrive there.":""; prRender(); });
  peer.on("connection",conn=>mateWire(conn,null));
  peer.on("disconnected",()=>{ if(MATE.peer===peer) setTimeout(()=>{ try{ if(MATE.peer===peer&&!peer.destroyed) peer.reconnect(); }catch(e){} },1500); });
  peer.on("error",e=>{
    if(MATE.peer!==peer) return;
    if(e.type==="unavailable-id"&&!dup){ try{ peer.destroy(); }catch(x){} MATE.peer=null; return mateOpen(true); }   // another tab of mine already has the id
    if(e.type==="peer-unavailable"){                     // the mate's tab isn't reachable: fail whatever was waiting for them
      const m=/(wfgm-[a-z0-9]+)/i.exec(e.message||""); const ids=m?[m[1]]:Object.keys(MATE.pend);
      ids.forEach(id=>{ const p=MATE.pend[id]; if(p){ delete MATE.pend[id]; p.fail(); } });
    }
  });
}
/* every data connection (incoming or mine) */
function mateWire(conn,gm){
  conn._gm=gm;
  conn.on("data",m=>{
    if(!m||typeof m!=="object") return;
    if(m.t==="hi"){                                      // who is calling? only people in my groups get in
      const from=String(m.from||"").toLowerCase();
      if(!from||!matePerson(from)){ try{ conn.close(); }catch(e){} return; }
      conn._gm=from; MATE.conns[from]=conn; return;
    }
    if(conn._gm) mateOnMsg(conn._gm,m,conn);
  });
  conn.on("close",()=>{ if(conn._gm&&MATE.conns[conn._gm]===conn) delete MATE.conns[conn._gm]; });
  conn.on("error",()=>{ if(conn._gm&&MATE.conns[conn._gm]===conn) delete MATE.conns[conn._gm]; });
}
/* an open connection to a mate (reused), or null if they can't be reached */
function mateConn(gm){
  const c=MATE.conns[gm]; if(c&&c.open) return Promise.resolve(c);
  if(!MATE.peer||!MATE.ready) return Promise.resolve(null);
  return new Promise(res=>{
    const id=mateId(gm); let done=false;
    const fin=v=>{ if(done) return; done=true; clearTimeout(to); delete MATE.pend[id]; res(v); };
    const conn=MATE.peer.connect(id,{reliable:true}); mateWire(conn,gm);
    const to=setTimeout(()=>{ try{ conn.close(); }catch(e){} fin(null); },12000);
    MATE.pend[id]={fail:()=>fin(null)};
    conn.on("open",()=>{ try{ conn.send({t:"hi",from:MATE.owner}); }catch(e){} MATE.conns[gm]=conn; fin(conn); });
  });
}
async function mateSend(gm,m){ const c=await mateConn(gm); if(!c) return false; try{ c.send(m); return true; }catch(e){ return false; } }
function mateOnMsg(gm,m,conn){
  if(m.t==="inv"){
    if(!/^[A-Z0-9]{4,8}$/.test(String(m.code||""))||!GTITLE[m.game]) return;
    MATE.inbox=MATE.inbox.filter(x=>x.gm!==gm);           // a newer request from the same mate replaces the old one
    MATE.inbox.push({id:String(m.id||""),gm,game:m.game,code:m.code,at:Date.now()});
    mateInvRender(); mateBeep();
  } else if(m.t==="invr"){
    const s=MATE.sent[gm]; if(!s||s.id!==m.id) return;
    s.status=m.ok?"accepted":m.busy?"busy":"declined"; s.at=Date.now();
    toast(m.ok?"✅ "+mateNameOf(gm)+" accepted – joining your room…":"❌ "+mateNameOf(gm)+(m.busy?" is busy right now.":" declined your game request."),m.ok?"ok":"info");
    prRefresh();
  } else if(m.t==="msg"){
    const text=String(m.text||"").slice(0,500); if(!text.trim()) return;
    const c=mateThread(gm); if(c.msgs.some(x=>x.id===m.id)) return;
    c.msgs.push({id:String(m.id||Date.now()),me:false,text,at:Date.now()}); if(c.msgs.length>300) c.msgs.splice(0,c.msgs.length-300);
    try{ conn.send({t:"ack",id:m.id}); }catch(e){}
    const looking=MATE.open===gm&&document.visibilityState==="visible";
    if(!looking){ MATE.unread[gm]=(MATE.unread[gm]||0)+1; mateNotify(gm,text); }
    mateSaveChats(); mateChatRender(); prRender();
  } else if(m.t==="ack"){
    const c=MATE.chat[gm], x=c&&c.msgs.find(y=>y.id===m.id&&y.me); if(x){ x.st="ok"; mateSaveChats(); mateChatRender(); }
  }
}
function mateThread(gm){ return MATE.chat[gm]||(MATE.chat[gm]={name:mateNameOf(gm),msgs:[]}); }

/* ---- game requests: sending ---- */
const mateUid=()=>Math.random().toString(36).slice(2,10);
/* invite a mate to the room I'm hosting (room lobby → "Invite mates") */
async function mateInvite(gm){
  if(!(NET.role==="host"&&!NET.local&&S.room)) return toast("Create a room first.","err");
  if(!MATE.ready) return toast("Still connecting to your mates – try again in a moment.","info");
  const s=MATE.sent[gm]; if(s&&s.code===NET.code&&(s.status==="sending"||(s.status==="sent"&&Date.now()-s.at<MATE_TTL))) return;
  const id=mateUid(), code=NET.code;
  MATE.sent[gm]={id,code,status:"sending",at:Date.now()}; prRefresh();
  const ok=await mateSend(gm,{t:"inv",id,game:S.room.game,code});
  const cur=MATE.sent[gm]; if(cur&&cur.id===id&&cur.status==="sending"){ cur.status=ok?"sent":"failed"; cur.at=Date.now(); }
  if(!ok) toast("Couldn't reach "+mateNameOf(gm)+" – their Game Hub tab may be closed or in the background.","err");
  prRefresh();
}
/* from the My groups panel: make a room for that game, then send the request once it is open */
function mateInviteNew(gm,game){
  if(!GTITLE[game]) return;
  if(NET.role) return toast("You're already in a room – invite from its lobby with “Invite mates”.","info");
  if(!S.me.name){ S.me.name=mateMyName().slice(0,16); try{ localStorage.setItem("ngg_me",JSON.stringify({name:S.me.name,av:S.me.av})); }catch(e){} }
  MATE.after={gm,until:Date.now()+30000};
  S.game=game; createRoom(game);
}
function mateAfterRoom(){                                  // called by createRoom when the room is open
  const a=MATE.after; MATE.after=null;
  if(a&&Date.now()<a.until) setTimeout(()=>mateInvite(a.gm),200);
}

/* ---- game requests: receiving (a popup with Accept / Decline) ---- */
function mateInvRender(){
  MATE.inbox=MATE.inbox.filter(x=>Date.now()-x.at<MATE_TTL);
  const r=MATE.inbox[0];
  let el=MATE.el;
  if(!r){ if(el) el.remove(); MATE.el=null; clearInterval(MATE.tick); MATE.tick=null; return; }
  if(!el){
    el=MATE.el=document.createElement("div"); el.id="mtinv"; el.setAttribute("role","alertdialog"); el.setAttribute("aria-live","assertive");
    document.body.appendChild(el);
    el.addEventListener("click",e=>{ const b=e.target.closest("[data-iv]"); if(b) mateAnswer(b.dataset.iv==="yes"); });
  }
  const left=Math.max(0,Math.ceil((MATE_TTL-(Date.now()-r.at))/1000)), inRoom=!!NET.role, key=r.id+"|"+inRoom+"|"+MATE.inbox.length;
  if(el._key!==key){
    el._key=key;
    el.innerHTML=`<div class="iv-card"><div class="iv-ico">🎮</div><div class="iv-body"><b>${esc(mateNameOf(r.gm))}</b> invited you to play<div class="iv-game">${GTITLE[r.game]}</div>
      <div class="pr-st">Room ${esc(r.code)} · <span class="iv-left">${left}s</span>${inRoom?" · accepting leaves your current room":""}${MATE.inbox.length>1?` · ${MATE.inbox.length-1} more waiting`:""}</div></div>
      <div class="iv-btns"><button type="button" class="btn secondary" data-iv="no">Decline</button><button type="button" class="btn green" data-iv="yes">Accept</button></div></div>`;
  } else { const l=el.querySelector(".iv-left"); if(l) l.textContent=left+"s"; }
  if(!MATE.tick) MATE.tick=setInterval(mateInvRender,1000);
}
function mateAnswer(ok){
  const r=MATE.inbox.shift(); mateInvRender(); if(!r) return;
  mateSend(r.gm,{t:"invr",id:r.id,ok});
  if(!ok) return;
  if(!S.me.name){ S.me.name=mateMyName().slice(0,16); try{ localStorage.setItem("ngg_me",JSON.stringify({name:S.me.name,av:S.me.av})); }catch(e){} }
  MATE.inbox=[]; mateInvRender();                           // joining a room: drop the rest
  if(NET.role){ leaveRoom(true); setTimeout(()=>joinRoom(r.code),500); }
  else joinRoom(r.code);
}
function mateBeep(){
  try{ const C=window.AudioContext||window.webkitAudioContext; if(!C) return; const a=MATE.ac||(MATE.ac=new C());
    [0,.16].forEach((t,i)=>{ const o=a.createOscillator(), g=a.createGain(); o.frequency.value=i?880:660; o.connect(g); g.connect(a.destination);
      g.gain.setValueAtTime(.0001,a.currentTime+t); g.gain.exponentialRampToValueAtTime(.12,a.currentTime+t+.02); g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+t+.14);
      o.start(a.currentTime+t); o.stop(a.currentTime+t+.16); }); }catch(e){}
  try{ navigator.vibrate&&navigator.vibrate([80,60,80]); }catch(e){}
}

/* ---- chat window ---- */
function mateChatOpen(gm){
  MATE.open=gm; delete MATE.unread[gm]; mateThread(gm); mateSaveChats(); mateChatRender(true); prRender();
  if(!MATE.chat[gm].msgs.length&&!(matePerson(gm)||{}).on) toast(mateNameOf(gm)+" is offline – messages only arrive while their Game Hub is open.","info");
}
function mateChatClose(){ MATE.open=null; mateChatRender(); prRender(); }
function mateChatRender(focus){
  const gm=MATE.open;
  let el=MATE.cel;
  if(!gm){ if(el) el.style.display="none"; return; }
  if(!el){
    el=MATE.cel=document.createElement("div"); el.id="mtchat"; el.setAttribute("role","dialog"); el.setAttribute("aria-label","Chat");
    el.innerHTML=`<div class="mc-head"><span class="pr-dot" id="mcDot"></span><div class="mc-who"><b id="mcName"></b><span class="pr-st" id="mcSt"></span></div><button type="button" class="mc-x" data-mcx aria-label="Close chat">✖</button></div>
      <div class="mc-log" id="mcLog" aria-live="polite"></div>
      <form class="mc-form" id="mcForm" autocomplete="off"><input id="mcIn" maxlength="500" placeholder="Message…" enterkeyhint="send" aria-label="Message"><button type="submit" class="btn green" id="mcSend">Send</button></form>
      <div class="mc-foot">🔒 Sent straight to them – not saved anywhere. Gone when either of you closes the tab.</div>`;
    document.body.appendChild(el);
    el.addEventListener("click",e=>{ if(e.target.closest("[data-mcx]")) mateChatClose(); });
    el.querySelector("#mcForm").addEventListener("submit",e=>{ e.preventDefault(); mateChatSend(); });
    el.addEventListener("keydown",e=>{ if(e.key==="Escape"){ e.stopPropagation(); mateChatClose(); } });
  }
  el.style.display="";
  const p=matePerson(gm), c=mateThread(gm);
  el.querySelector("#mcName").textContent=mateNameOf(gm);
  el.querySelector("#mcSt").textContent=p&&p.on?"online":p&&p.joined?"last seen "+fbAgo(p.ms):"offline";
  el.querySelector("#mcDot").className="pr-dot "+(p&&p.on?"on":"off");

async function mateChatSend(){
  const gm=MATE.open, inp=MATE.cel&&MATE.cel.querySelector("#mcIn"); if(!gm||!inp) return;
  const text=inp.value.trim().slice(0,500); if(!text) return;
  inp.value=""; inp.focus();
  const x={id:mateUid(),me:true,text,at:Date.now(),st:""}, c=mateThread(gm);
  c.msgs.push(x); if(c.msgs.length>300) c.msgs.splice(0,c.msgs.length-300);
  mateSaveChats(); mateChatRender(true);
  const ok=await mateSend(gm,{t:"msg",id:x.id,text});
  if(!ok){ x.st="fail"; mateSaveChats(); mateChatRender(); }
  else setTimeout(()=>{ if(!x.st){ x.st="fail"; mateSaveChats(); mateChatRender(); } },8000);     // no "delivered" back in time
}

  if(!g.log.length) h+=`<div class="chat-sys">Clues will appear here as players give them.</div>`;
  h+=g.log.map(m=>m.k==="sys"?`<div class="chat-sys">${esc(m.text)}</div>`
    :`<div class="chat-row ${m.pid===me?"mine":""}"><div class="chat-av">${pAv(v,m.pid)}</div><div class="chat-body"><div class="chat-nm">${esc(pName(v,m.pid))}${m.pid===me?" (you)":""} <span>round ${m.cyc}</span></div><div class="chat-bub">${esc(m.text)}</div></div></div>`).join("");
  h+=`</div><div class="chat-in">`;
  if(g.phase==="clues"){
    if(out) h+=`<div class="mut">❌ You're eliminated – watching only.</div>`;
    else if(cur===me) h+=`<div class="chat-turn">🎤 <b>Your turn!</b> Give a clue <span class="mut">(not your word)</span></div>
      <div class="guess-row"><input type="text" id="spyClue" data-keep maxlength="40" placeholder="Type your clue…" autocomplete="off" style="font-size:1rem;letter-spacing:normal"><button class="btn" data-a="clue">Send</button></div>`;
    else h+=`<div class="mut">⏳ Waiting for ${pAv(v,cur)} <b>${esc(pName(v,cur))}</b>…</div>`;
  } else if(g.phase==="vote") h+=`<div class="mut">🗳️ Voting in progress…</div>`;
  else h+=`<div class="mut">🔓 Round over.</div>`;
  return h+`</div></div>`;
}function votesListHTML(v,g,votes,roles){
  const ids=g.ids.filter(p=>votes[p]);
  if(!ids.length) return `<div class="mut">No votes were cast.</div>`;
  return ids.map(p=>{
    const t=votes[p];
    return `<div class="xm-status"><span><b>${esc(pName(v,p))}</b> voted for <b>${esc(pName(v,t))}</b></span><span>${roles?(roles[t]==="spy"?"✅ Spy":"❌ Civilian"):""}</span></div>`;
  }).join("");
}
function spyGameHTML(v){

      } else h+=`<div class="msg info">⏳ Waiting for ${pAv(v,cur)} <b>${esc(pName(v,cur))}</b> to give a clue…</div>`;

        <div class="mut" style="font-size:.82rem;margin-top:4px">Starts a vote for everyone${st.voteTime?` (${Math.round(st.voteTime)} sec)`:" (no time limit)"}. Most votes is out.</div>`;

    h+=`<h3 style="margin-top:12px">📋 Clue sheet</h3>${cluesHTML(v,g)}<h3 style="margin-top:20px">🗳️ Cast your vote</h3>`;
    if(out(me)) h+=`<div class="msg err">❌ You have been eliminated and can't vote. Watch the others decide…</div>`;
    else if(!g.locked[me]){
      h+=`<div class="msg info">Choose privately, then lock your vote.</div>
        <select id="voteSel" data-keep><option value="">Select a player…</option>${
          g.ids.filter(p=>p!==me&&!out(p)&&!pObj(v,p).left).map(p=>`<option value="${esc(p)}">${pAv(v,p)} ${esc(pName(v,p))}</option>`).join("")}</select>
        <button class="btn green block" style="margin-top:12px" data-a="vote">🔒 Lock vote</button>`;
    } else h+=`<div class="msg ok">✅ Your vote is locked. Waiting for the others…</div>`;
    h+=`<div class="scoreboard">${g.ids.filter(p=>!out(p)&&!pObj(v,p).left).map(p=>`<span class="chip">${g.locked[p]?"✅":"⏳"} ${esc(pName(v,p))}</span>`).join("")}</div>`;
  } else {

      :`<div class="msg warn" style="margin-top:12px;font-size:1.05rem">🕵️ The spy survived until only ${g.ids.filter(p=>!out(p)&&!pObj(v,p).left).length} players were left. <b>The spy wins this round!</b> <span class="mut">(+3 for the spy)</span></div>`;

      <div style="margin-top:8px">${g.ids.map(p=>`<div>${r.roles[p]==="spy"?"🕵️":"🙂"} <b>${esc(pName(v,p))}</b> – ${r.roles[p]==="spy"?"SPY":"Civilian"}${out(p)?" (voted out)":""}</div>`).join("")}</div></div>`;
    h+=`<h3>📋 Clue sheet</h3>${cluesHTML(v,g)}<h3 style="margin-top:20px">🗳️ Final vote</h3>${votesListHTML(v,g,r.votes||{},r.roles)}`;

  return h;
}

/* ---- Dots and Boxes ---- */
const dbHue=(v,pid,a)=>{ const i=Math.max(0,v.players.findIndex(p=>p.pid===pid)); return `hsla(${Math.round(i*137.508)%360},85%,62%,${a})`; };
const DB_PIPS=[[],[4],[0,8],[0,4,8],[0,2,6,8],[0,2,4,6,8],[0,2,3,5,6,8]];
const dbDie=(n,style)=>`<div class="db-die" style="${style}">${[...Array(9).keys()].map(k=>DB_PIPS[n].includes(k)?`<i class="p"></i>`:`<i></i>`).join("")}</div>`;
function dbBoardHTML(v,can){
  const g=v.g, W=g.cols-1, H=g.rows-1, U=100, P=50, vw=W*U+2*P, vh=H*U+2*P;
  const own=k=>k?g.ids[k-1]:null;
  let b="", l="", d="";
  g.boxes.forEach((k,i)=>{
    if(!k) return;
    const r=Math.floor(i/W), c=i%W, pid=own(k);
    b+=`<rect x="${P+c*U+5}" y="${P+r*U+5}" width="${U-10}" height="${U-10}" rx="10" fill="${dbHue(v,pid,.22)}"/><text class="db-mk" x="${P+c*U+U/2}" y="${P+r*U+U/2}" font-size="${U*.5}" text-anchor="middle" dominant-baseline="central">${esc(g.marks[pid])}</text>`;
  });
  const line=(t,i,x1,y1,x2,y2)=>{
    const k=(t==="h"?g.hl:g.vl)[i], free=!k, on=can&&free, last=g.last&&g.last.t===t&&g.last.i===i;
    const geo=`x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"`;
    return `<g class="db-l ${free?"":"on"} ${on?"can":""} ${last?"last":""}" ${on?`data-a="dbline" data-t="${t}" data-i="${i}"`:""}>${on?`<line class="db-hit" ${geo}/>`:""}<line class="db-ln" ${geo}${free?"":` style="stroke:${dbHue(v,own(k),1)}"`}/></g>`;
  };
  for(let r=0;r<g.rows;r++) for(let c=0;c<W;c++) l+=line("h",r*W+c,P+c*U,P+r*U,P+(c+1)*U,P+r*U);
  for(let r=0;r<H;r++) for(let c=0;c<g.cols;c++) l+=line("v",r*g.cols+c,P+c*U,P+r*U,P+c*U,P+(r+1)*U);
  for(let r=0;r<g.rows;r++) for(let c=0;c<g.cols;c++) d+=`<circle class="db-dot" cx="${P+c*U}" cy="${P+r*U}" r="9"/>`;
  return `<div class="db-wrap"><svg class="db-svg" viewBox="0 0 ${vw} ${vh}" role="img" aria-label="Dots and Boxes board">${b}${l}${d}</svg></div>`;
}
function dbGameHTML(v){
  const g=v.g, st=v.settings, me=v.me, host=me===v.hostPid, cur=g.ids[g.turn], play=g.phase!=="reveal", mine=play&&cur===me;
  const total=g.boxes.length, taken=g.boxes.filter(x=>x).length;
  let h=`<div class="scoreboard"><span class="chip">Round ${v.round}/${st.rounds}</span><span class="chip">📦 ${taken}/${total} boxes</span>${timerHTML(play?g.deadline:0)}</div>`;
  h+=`<div class="scoreboard">${g.ids.map(p=>`<span class="chip ${play&&p===cur?"active":""} ${pObj(v,p).left?"gone":""}" style="border-color:${dbHue(v,p,.9)}">${g.marks[p]} ${esc(pName(v,p))}${p===me?" (you)":""} · <b>${g.counts[p]}</b></span>`).join("")}</div>`;
  if(play){
    /* One fixed-size turn panel (dice on the left, status + roll button on the right) that looks the same size in every phase,
       so the board below never jumps up or down when someone rolls, draws or the turn passes (this used to shake the board on phones). */
    const el=Date.now()+S.off-g.rollAt, spin=g.rid&&el<800?`animation:dbTumble .8s ease-out ${-Math.max(0,el)}ms both;`:"";
    const rolled=g.phase==="draw"&&g.dice.length, nd=Math.max(1,+st.dice||1);
    const dice=rolled?g.dice.map(n=>dbDie(n,spin)).join("")+(g.dice.length>1?`<div class="db-sum">= ${g.total}</div>`:"")
      :Array.from({length:nd},()=>dbDie(0,"")).join("");
    let txt, btn="";
    if(g.phase==="roll"){
      txt=mine?`${g.marks[me]} <b>Your turn!</b> Roll – you draw that many lines.`:`⏳ ${g.marks[cur]} <b>${esc(pName(v,cur))}</b> is about to roll…`;
      if(mine) btn=`<button class="btn green db-roll" data-a="dbroll">🎲 Roll the dice</button>`;
    } else {
      txt=mine?`${g.marks[me]} Draw <b>${g.left}</b> more line${g.left===1?"":"s"} – tap a line between two dots.${st.bonus?" Closing a box gives you one extra line.":""}`
        :`✏️ ${g.marks[cur]} <b>${esc(pName(v,cur))}</b> rolled ${g.total} and has <b>${g.left}</b> line${g.left===1?"":"s"} left to draw.`;
    }
    h+=`<div class="db-turn ${mine?"mine":""}"><div class="db-dice ${rolled?"":"idle"}">${dice}</div><div class="db-info">${g.note?`<div class="db-note">${esc(g.note)}</div>`:""}<div class="db-txt">${txt}</div>${btn}</div></div>`;
  }
  h+=dbBoardHTML(v,mine&&g.phase==="draw");
  if(!play){
    const r=g.res;
    h+=r.winners.length
      ?`<div class="msg ok" style="font-size:1.05rem">🏆 ${r.winners.map(p=>g.marks[p]+" <b>"+esc(pName(v,p))+"</b>").join(" & ")} ${r.winners.length>1?"tie":"wins"} this round with <b>${r.max}</b> box${r.max===1?"":"es"}! 🎉</div>`
      :`<div class="msg info">No boxes were claimed.</div>`;
    h+=boardHTML(v)+nextControls(v,host);
  }
  return h;
}

/* ---- Ludo ---- */
function luGeo(C,rot){
  rot=rot||0;                                                    // the viewer's own yard is turned to the bottom-left
  /* C arms (4 = classic cross, 6 = hexagon of arms). Each arm is 3 lanes wide and 6 squares long, with the end square in the middle.
     Ring square 13*k+j on arm k: j 0-5 = outward along the lane on the counter-clockwise side, 6 = the end square, 7-12 = back inward along the clockwise lane.
     The middle lane is that colour's home column (entered from the end square). Yards sit in the corners between two arms. */
  const f=n=>Math.round(n*10)/10, d0=1.5/Math.tan(Math.PI/C), s=Math.floor(2800/(d0+7.2))/10, d=d0*s, L=13*C;
  const ang=k=>(-90+k*360/C+rot)*Math.PI/180;
  const at=(k,u,v)=>{ const a=ang(k), ux=Math.cos(a), uy=Math.sin(a); return [f(300+u*ux-v*uy),f(300+u*uy+v*ux)]; };
  const sq=(k,r,v)=>{ const p=at(k,d+(r+.5)*s,v); return [p[0],p[1],-90+k*360/C+90+rot]; };
  const cell=i=>{ i=((i%L)+L)%L; const k=Math.floor(i/13), j=i%13; return j<=5?sq(k,j,-s):j===6?sq(k,6,0):sq(k,12-j,s); };
  const col=(c,k)=>sq(c,5-k,0);
  const yard=c=>{ const a=(-90+(c+.5)*360/C+rot)*Math.PI/180, r=(d+(C===4?3:3.5)*s)/Math.cos(Math.PI/C); return [f(300+r*Math.cos(a)),f(300+r*Math.sin(a)),C===4?0:-90+(c+.5)*360/C+90+rot]; };

/* Ludo sounds (WebAudio, no files): dice rattle, a wooden "tok" for every square a coin hops, pops, captures and a home chime.

const LUS={ctx:null,rid:"",at:0};
function luAC(){

function luTone(c,type,f1,f2,at,d,v){ const o=c.createOscillator(), g=c.createGain(); o.type=type; o.frequency.setValueAtTime(f1,at); if(f2) o.frequency.exponentialRampToValueAtTime(f2,at+d);

  const s=c.createBufferSource(); s.buffer=b; const f=c.createBiquadFilter(); f.type="bandpass"; f.frequency.value=freq; f.Q.value=1.2;
  const g=c.createGain(); g.gain.setValueAtTime(v,at); g.gain.exponentialRampToValueAtTime(.0001,at+d); s.connect(f); f.connect(g); g.connect(c.destination); s.start(at); }
function luDiceSfx(el){
  const c=luAC(); if(!c) return; const t0=c.currentTime+.02;
  for(let k=0,t=Math.max(0,-el);k<11;k++){ t+=.035+k*.012; if(t>.8) break;                          // rattle: clacks that spread out as the dice settles
    luNoise(c,t0+t,.03,.5-k*.03,2400+Math.random()*2200); luTone(c,"triangle",700+Math.random()*500,0,t0+t,.03,.07); }
  luTone(c,"sine",180,90,t0+.8,.12,.35); luNoise(c,t0+.8,.05,.5,1200);                                // last knock as it lands
}
function luStepSfx(c,at,i){ luTone(c,"sine",520+i*28,300+i*14,at,.07,.32); luNoise(c,at,.025,.25,1800); }
function luSfx(v){
  const g=v.g; if(!g||g.kind!=="lu") return;
  const now=Date.now()+S.off, rk=v.code+"|"+v.deal+"|"+g.rid;
  if(g.rid&&rk!==LUS.rid){ LUS.rid=rk; const el=(now-g.rollAt)/1000; if(el<.8) luDiceSfx(el); }
  const l=g.last; if(!l||l.at===LUS.at) return; LUS.at=l.at;
  const el=(now-l.at)/1000, n=luSteps(l); if(el>n*LU_STEP+.5) return;
  const c=luAC(); if(!c) return; const t0=c.currentTime;
  for(let i=0;i<n;i++){ const d=i*LU_STEP-el; if(d>=-.05) luStepSfx(c,t0+Math.max(0,d),i); }
  const end=Math.max(0,n*LU_STEP-el);
  if(l.from===-1) luTone(c,"sine",300,900,t0+Math.max(0,-el),.12,.3);                                // pops out of the yard
  if(g.hit&&g.hit.at>=l.at){ luTone(c,"sawtooth",330,70,t0+end,.45,.22); luNoise(c,t0+end,.3,.5,700); }  // capture
  if(l.to===13*g.C+4) [523,659,784,1047].forEach((f,k)=>luTone(c,"triangle",f,0,t0+end+k*.1,.4,.18));    // home
}
/* a movable coin catches fire: three flickering flames that burn gently, so it is clear which coins can be moved */
const LU_FLAME="M0 0C-.75-.1-.95-.8-.3-1.2C-.3-.8.1-.8 0-1.7C.75-1.1.95-.3.5-.1C.3 0 .1.1 0 0Z";
function luFire(r){
  const fl=(dx,sc,dl,col)=>`<g transform="translate(${f1(dx*r)} ${f1(-r*.5)}) scale(${f1(sc*r*1.25)})"><path class="lu-fl" style="animation-delay:${dl}s" fill="${col}" d="${LU_FLAME}"/></g>`;
  return `<g pointer-events="none">${fl(-.55,.75,-.15,"#ff7a18")}${fl(.55,.7,-.3,"#ff7a18")}${fl(0,1.05,0,"#ff9d2e")}${fl(0,.62,-.2,"#ffe27a")}</g>`;
}
function luBoardHTML(v,mine){
  const g=v.g, C=g.C, my=g.seats.find(x=>x.pid===v.me&&!x.out), rot=my?(C===4?135:90)-(-90+(my.c+.5)*360/C):0, G=luGeo(C,rot), L=G.L, s=G.s, cr=G.cr, now=Date.now()+S.off;
  const used=c=>g.seats.some(x=>x.c===c);
  const rect=(c,w,h,fill,fo,stroke,extra)=>`<rect x="${-w/2}" y="${-h/2}" width="${w}" height="${h}" rx="${s*.14}" fill="${fill}" fill-opacity="${fo}" stroke="${stroke}" ${extra||""} transform="translate(${c[0]} ${c[1]}) rotate(${c[2]})"/>`;
  let b="";

  for(let c=0;c<C;c++){
    const y=G.yard(c), u=used(c), side=(C===4?5:3.9)*s;
    b+=rect(y,side,side,LU_COL[c],u?.95:.25,"#0c1030",`stroke-width="2" rx="${s*.5}"`);
    b+=rect(y,side*.7,side*.7,"#f4f6fb",u?.95:.3,"none",`rx="${s*.35}"`);
    for(let t=0;t<4;t++) b+=`<circle cx="${f1(y[0]+(t%2?1:-1)*s*(C===4?.95:.8))}" cy="${f1(y[1]+(t<2?-1:1)*s*(C===4?.95:.8))}" r="${cr*1.05}" fill="${LU_COL[c]}" fill-opacity="${u?.35:.12}" stroke="${LU_COL[c]}" stroke-opacity=".8"/>`;
  }
  // hub: one coloured triangle per arm
  for(let c=0;c<C;c++){
    const a=G.ang(c), p=(u,v)=>{ const q=G.at(c,u,v); return q[0]+" "+q[1]; };
    b+=`<polygon points="300 300 ${p(G.d,-1.5*s)} ${p(G.d,1.5*s)}" fill="${LU_COL[c]}" fill-opacity="${used(c)?.95:.25}" stroke="#0c1030" stroke-width="2"/>`;
  }

  for(let i=0;i<L;i++){
    const c=G.cell(i), k=Math.floor(i/13), st=i%13===7, star=i%13===2;
    b+=rect(c,s*.94,s*.94,st?LU_COL[k]:"#f4f6fb",st?(used(k)?1:.35):.95,"#0c103088");
    if(star||st) b+=`<text x="${c[0]}" y="${c[1]}" font-size="${s*.7}" text-anchor="middle" dominant-baseline="central" fill="${st?"#fff":"#6b7399"}" pointer-events="none">★</text>`;
  }
  // home columns and the home square
  for(let c=0;c<C;c++){
    for(let k=0;k<5;k++) b+=rect(G.col(c,k),s*.94,s*.94,LU_COL[c],used(c)?.9:.25,"#0c103088");
    b+=rect(G.col(c,5),s*.94,s*.94,LU_COL[c],used(c)?.55:.15,"#0c103088");
  }

  if(g.hit&&g.hit.cell>=0&&now-g.hit.at<1300){
    const p=G.cell(g.hit.cell), el=Math.max(0,now-g.hit.at);
    b+=`<g class="lu-burst" style="animation-delay:${-el}ms;transform-origin:${p[0]}px ${p[1]}px"><circle cx="${p[0]}" cy="${p[1]}" r="${s*.9}" fill="none" stroke="#fff" stroke-width="3"/><text x="${p[0]}" y="${p[1]}" font-size="${s*1.2}" text-anchor="middle" dominant-baseline="central">💥</text></g>`;
  }

    const el=Math.min(5,(now-gh.at)/1000), sd={c:gh.c};

  });

  const stack={};

    const q=luTokXY(G,g,sd,p,t), key=p>=0&&p<=L+3?q[0]+","+q[1]:null;
    let off=0; if(key){ off=(stack[key]=(stack[key]||0)+1)-1; }

      const n=luSteps(g.last), el=Math.max(0,now-g.last.at)/1000, kt=["0"], vs=[], pt=i=>{ const a=luTokXY(G,g,sd,g.last.from===-1?(i?0:-1):g.last.from+i,t); return f1(a[0]-q[0])+" "+f1(a[1]-q[1]); };
      vs.push(pt(0));

    }

      <circle r="${r*1.45}" fill="transparent"/>${can?`<circle class="lu-glow" r="${r*1.9}" fill="url(#luGlow)"/>`:""}<circle class="lu-tk" r="${r}" fill="${LU_COL[sd.c]}" stroke="${can?"#ffb347":"#fff"}" stroke-width="2"/><circle r="${r*.42}" fill="#fff" fill-opacity=".6"/>${can?luFire(r):""}</g></g>`;

function luGameHTML(v){

      ?`<div class="msg ok">${dot(cur.c)} <b>Your turn!</b> ${cur.tok.every(p=>p===-1)?"You need a 6 to bring a token out.":"Roll the dice."}</div><button class="btn green block db-roll" data-a="ludoroll">🎲 Roll the dice</button>`
      :`<div class="msg info">⏳ ${dot(cur.c)} <b>${nm(cur)}</b> (${LU_NAME[cur.c]}) is about to roll…</div>`;

/* ---- Rock Paper Scissors ---- */
const RPS_ICO=["✊","✋","✌️"], RPS_NAME=["Rock","Paper","Scissors"];
function rpsGameHTML(v){
  const g=v.g, st=v.settings, me=v.me, host=me===v.hostPid, play=g.phase!=="reveal", pick=g.phase==="pick";
  const mineE=g.ent.find(e=>e.pid===me), alive=g.ent.filter(e=>!e.out);
  let h=`<div class="scoreboard"><span class="chip">Round ${v.round}/${st.rounds}</span><span class="chip">Throw ${g.throws+(pick?1:0)}</span>${g.target?`<span class="chip">First to ${g.target}</span>`:`<span class="chip">${alive.length} left</span>`}${timerHTML(pick?g.deadline:0)}</div>`;
  const row=`<div class="rps-row">${g.ent.map(e=>{
    const win=g.last&&g.phase!=="pick"&&g.last.winners.includes(e.id), lose=g.last&&g.phase!=="pick"&&g.last.losers.includes(e.id), sh=g.phase!=="pick"&&g.shown?g.shown[e.id]:undefined;
    const ready=pick&&g.picked.includes(e.id);
    // after the reveal an astronaut peeks out from behind the card of each throw winner and waves hi (everyone shrugs on a draw)
    const age=g.last&&g.phase!=="pick"?(Date.now()+S.off-g.last.at)/1000:99, show=age<2.8&&!e.out&&(win||(g.last&&g.last.draw&&sh!==undefined));
    const astro=show?`<div class="rps-astro ${g.last.draw?"shrug":"wave"}" style="animation-delay:-${Math.max(0,age).toFixed(2)}s" aria-hidden="true">${astroSVG(EJ_COLORS[Math.max(0,EMOJIS.indexOf(e.av))%EJ_COLORS.length],e.av)}</div>`:"";
    return `<div class="rps-slot">${astro}<div class="rps-p ${e.out?"out":""} ${win?"win":""} ${lose?"lose":""} ${e.id===(mineE&&mineE.id)?"me":""}"><div class="rps-av">${esc(e.av)}</div><div class="rps-nm">${esc(e.name)}${e.id===(mineE&&mineE.id)?" (you)":""}</div>
      <div class="rps-hand ${sh!==undefined?"shown":""} ${ready?"ready":""}">${sh!==undefined?RPS_ICO[sh]:e.out?"💨":ready?"✔":"❔"}</div>
      <div class="rps-sc">${g.target?`<b>${e.pts}</b> win${e.pts===1?"":"s"}`:e.out?"out":"in"}${!e.bot&&e.pid&&e.pid!==me&&!e.out?kickBtn(v,pObj(v,e.pid)):""}</div></div></div>`; }).join("")}</div>`;
  /* The sign buttons (and the throw result) come BEFORE the player cards, so on a phone you can choose without scrolling down past everyone's card. */
  if(pick){
    if(mineE&&!mineE.out){
      h+=g.mine===null
        ?`<div class="msg ok">Choose your sign – nobody sees it until everyone has thrown.</div><div class="rps-btns">${RPS_ICO.map((ic,i)=>`<button class="rps-b" data-a="rpsthrow" data-v="${i}" aria-label="${RPS_NAME[i]}"><span>${ic}</span><b>${RPS_NAME[i]}</b></button>`).join("")}</div>`
        :`<div class="msg info">You threw ${RPS_ICO[g.mine]} – waiting for ${g.ent.filter(e=>!e.out&&!g.picked.includes(e.id)).map(e=>esc(e.name)).join(", ")||"everyone"}…</div>`;
    } else h+=`<div class="msg info">👀 You're out – watching the others throw.</div>`;
  } else if(play&&g.last){
    const l=g.last;
    h+=l.draw?`<div class="msg warn rps-res">🤝 Draw – ${new Set(Object.values(l.shown)).size===1?"everyone threw the same sign":"all three signs showed up"}. Throw again!</div>`
      :`<div class="msg ok rps-res">${l.winners.map(i=>esc(g.ent.find(e=>e.id===i).name)).join(", ")||"The winners"} won the throw ${RPS_ICO[l.shown[l.winners[0]]]||""}${l.knock?` – ${l.losers.length} knocked out!`:""}</div>`;
  }
  h+=row;
  if(!play){
    const w=g.ent.find(e=>e.id===g.res.winner);
    h+=w?`<div class="msg ok" style="font-size:1.05rem">🏆 ${esc(w.av)} <b>${esc(w.name)}</b> wins this round! 🎉</div>`:`<div class="msg info">Nobody won this round.</div>`;
    h+=boardHTML(v)+nextControls(v,host);
  }
  return h;
}

/* ---- Scribblio UI ----
   The Scribblio play screen is built once ("shell") and then patched region by region, so the canvas, the
   chat box (focus, typed text) and an in-progress stroke are never destroyed by incoming updates. */
const SK_COLORS=["#000000","#7f7f7f","#e53935","#fb8c00","#fdd835","#43a047","#00acc1","#1e88e5","#8e24aa","#ec407a","#6d4c41","#c8c8c8"];
const SK_SIZES=[3,8,16,28];
let skColor="#000000", skSize=8, skTool="pen", skDraw=null;
const SKC={el:null,ctx:null,strokes:[],tid:"",sid:0};
const SKW=800, SKH=600;
function skPlayView(){ const v=S.room; return !!(S.screen==="room"&&v&&v.game==="Scribblio"&&v.phase==="play"&&v.g&&v.g.kind==="sk"); }
function skCanDraw(){ const v=S&&S.room; return !!(!NET.spec&&v&&v.game==="Scribblio"&&v.phase==="play"&&v.g&&v.g.kind==="sk"&&v.g.phase==="draw"&&v.g.drawer===v.me); }
function skStrokeDraw(s,from){
  const c=SKC.ctx; c.lineCap="round"; c.lineJoin="round"; c.strokeStyle=s.c; c.lineWidth=s.w;
  for(let i=Math.max(from,0);i<s.p.length;i++){
    const a=s.p[i-1]||s.p[i], b=s.p[i];
    c.beginPath(); c.moveTo(a[0]*SKW,a[1]*SKH); c.lineTo(b[0]*SKW+0.01,b[1]*SKH); c.stroke();
  }
}
function skRedraw(){
  const c=SKC.ctx; c.globalCompositeOperation="source-over"; c.fillStyle="#ffffff"; c.fillRect(0,0,SKW,SKH);
  SKC.strokes.forEach(s=>skStrokeDraw(s,0));
}
function skApply(op){                                      // the only way anything gets drawn on the canvas
  if(!op||!SKC.ctx) return;
  if(op.k==="seg"){
    let s=SKC.strokes[SKC.strokes.length-1];
    if(!s||s.id!==op.id){ s={id:op.id,c:op.c,w:op.w,p:[]}; SKC.strokes.push(s); }
    const from=s.p.length; (op.p||[]).forEach(q=>s.p.push(q)); skStrokeDraw(s,from);
  } else if(op.k==="undo"){ SKC.strokes.pop(); skRedraw(); }
  else if(op.k==="clear"){ SKC.strokes=[]; skRedraw(); }
  else if(op.k==="sync"){ SKC.strokes=(op.strokes||[]).map(s=>({id:s.id,c:s.c,w:s.w,p:s.p.slice()})); skRedraw(); }
}
function skSend(op){
  if(NET.role==="host") hostDraw(S.me.pid,op);
  else if(NET.hostConn&&NET.hostConn.open){ try{ NET.hostConn.send({t:"draw",d:op}); }catch(e){} }
}
function skFlush(){
  const d=skDraw; if(!d) return; d.timer=null;
  if(!d.pending.length) return;
  const op={k:"seg",id:d.id,c:d.c,w:d.w,p:d.pending}; d.pending=[]; skSend(op);
}
function skEndStroke(){ const d=skDraw; if(!d) return; clearTimeout(d.timer); skFlush(); skDraw=null; }
function buildSkCanvas(){
  const cv=document.createElement("canvas"); cv.width=SKW; cv.height=SKH; cv.className="sk-canvas";
  SKC.el=cv; SKC.ctx=cv.getContext("2d"); skRedraw();
  const pos=e=>{ const r=cv.getBoundingClientRect(); return [Math.round(skClamp((e.clientX-r.left)/r.width,0,1)*10000)/10000,Math.round(skClamp((e.clientY-r.top)/r.height,0,1)*10000)/10000]; };
  const push=pts=>{
    const d=skDraw; if(!d||!pts.length) return;
    skApply({k:"seg",id:d.id,c:d.c,w:d.w,p:pts});          // draw locally right away…
    d.pending.push(...pts);                                  // …and send in small batches
    if(!d.timer) d.timer=setTimeout(skFlush,35);
  };
  cv.addEventListener("pointerdown",e=>{
    if(!skCanDraw()||(e.button!==undefined&&e.button>0)) return;
    e.preventDefault(); try{ cv.setPointerCapture(e.pointerId); }catch(x){}
    skEndStroke();
    const eraser=skTool==="eraser";
    skDraw={id:Date.now()*100+(SKC.sid++%100),c:eraser?"#ffffff":skColor,w:eraser?Math.round(skSize*1.8):skSize,pending:[],timer:null};
    push([pos(e)]);
  });
  cv.addEventListener("pointermove",e=>{
    if(!skDraw) return;
    if(!skCanDraw()){ skEndStroke(); return; }

      ${ent.length?`<div class="sk-rv-list">${ent.map(([pid,pts])=>`<div><span>${pAv(v,pid)} ${esc(pName(v,pid))}${pid===r.drawer?" ✏️":""}</span><b>+${pts}</b></div>`).join("")}</div>`:""}

    <div class="sk-btns"><button class="btn secondary ${skTool==="eraser"?"active":""}" data-a="sktool">🧽 Eraser</button>
      <button class="btn secondary" data-a="skundo">↩️ Undo</button><button class="btn secondary" data-a="skclear">🗑️ Clear</button></div></div>`:"");

/* ================= SCRATCHPAD (built once so drawings survive re-renders) ================= */
let PAD=null, padCtx=null, padTool="pen", padColor="#ff6b81", padSize=4, padUndo=[];
const PAD_COLORS=["#ffffff","#ff6b81","#46d6a4","#ffcc66","#6cc7ff","#c58bff"];
function padSnapshot(){
  const cv=PAD.querySelector("canvas");
  padUndo.push(padCtx.getImageData(0,0,cv.width,cv.height));
  if(padUndo.length>30) padUndo.shift();
}
function padClear(){
  if(!PAD) return;
  const cv=PAD.querySelector("canvas");
  padCtx.clearRect(0,0,cv.width,cv.height);
  padUndo=[];
}
function buildPad(){
  PAD=document.createElement("div");
  PAD.className="pad";
  PAD.innerHTML=`
    <h3 style="margin:0 0 10px">✏️ Scratchpad</h3>
    <div class="pad-tools">
      <button class="btn secondary" data-tool="pen">✏️ Pen</button>
      <button class="btn secondary" data-tool="eraser">🧽 Eraser</button>
      <button class="btn secondary" data-act="undo">↩️ Undo</button>
      <button class="btn secondary" data-act="clear">🗑️ Clear</button>
    </div>
    <div class="pad-tools">
      ${PAD_COLORS.map(c=>`<button class="swatch" data-pcolor="${c}" style="background:${c}" title="${c}"></button>`).join("")}
      <input type="range" min="1" max="30" value="${padSize}" title="Brush size">
    </div>
    <canvas width="600" height="700"></canvas>`;
  const cv=PAD.querySelector("canvas");
  padCtx=cv.getContext("2d");
  padCtx.lineCap="round"; padCtx.lineJoin="round";
  const refresh=()=>{
    PAD.querySelectorAll("[data-tool]").forEach(b=>b.classList.toggle("active",b.dataset.tool===padTool));
    PAD.querySelectorAll(".swatch").forEach(b=>b.classList.toggle("active",b.dataset.pcolor===padColor&&padTool==="pen"));
  };
  PAD.querySelectorAll("[data-tool]").forEach(b=>b.onclick=()=>{ padTool=b.dataset.tool; refresh(); });
  PAD.querySelectorAll(".swatch").forEach(b=>b.onclick=()=>{ padColor=b.dataset.pcolor; padTool="pen"; refresh(); });
  PAD.querySelector("[data-act=undo]").onclick=()=>{ const s=padUndo.pop(); if(s) padCtx.putImageData(s,0,0); };
  PAD.querySelector("[data-act=clear]").onclick=()=>{ padSnapshot(); padCtx.clearRect(0,0,cv.width,cv.height); };
  PAD.querySelector("input[type=range]").oninput=e=>padSize=+e.target.value;
  refresh();
  let drawing=false,last=null;
  const pos=e=>{ const r=cv.getBoundingClientRect(); return [(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]; };
  const stroke=(a,b)=>{
    padCtx.globalCompositeOperation = padTool==="eraser" ? "destination-out" : "source-over";
    padCtx.strokeStyle=padColor;
    padCtx.lineWidth = padTool==="eraser" ? padSize*3 : padSize;
    padCtx.beginPath(); padCtx.moveTo(a[0],a[1]); padCtx.lineTo(b[0]+0.01,b[1]); padCtx.stroke();
  };
  cv.addEventListener("pointerdown",e=>{ drawing=true; cv.setPointerCapture(e.pointerId); padSnapshot(); last=pos(e); stroke(last,last); });
  cv.addEventListener("pointermove",e=>{ if(!drawing) return; const p=pos(e); stroke(last,p); last=p; });
  ["pointerup","pointercancel","pointerleave"].forEach(ev=>cv.addEventListener(ev,()=>{ drawing=false; }));
}

/* ---- rewind (◀ ▶): S.ui.chRw = null (live board) or an index into g.snaps ---- */

function chRwIdx(v){ const g=v.g; if(!chRwOK(v)||S.ui.chRw==null) return null; return Math.max(0,Math.min(g.snaps.length-1,S.ui.chRw)); }
function chRwGo(how){
  const v=S.room; if(!v||!chRwOK(v)) return;

  else if(mySeat>=0&&g.phase==="play") note=`You are out – use ◀ ▶ (or the ← → keys) to replay the moves and see how it happened.`;

document.addEventListener("keydown",e=>{

const chFmt=ms=>{ const s=Math.max(0,Math.ceil(ms/1000)); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); };

function chBoardSVG(v){

  const a=(270-B.players[vs].side)*Math.PI/180, co=Math.cos(a), sn=Math.sin(a);
  const tr=p=>[(p[0]*co-p[1]*sn)*sc, -(p[0]*sn+p[1]*co)*sc];
  const polys=B.cells.map(c=>c.poly.map(tr));

  polys.forEach(pl=>pl.forEach(p=>{ x0=Math.min(x0,p[0]); x1=Math.max(x1,p[0]); y0=Math.min(y0,p[1]); y1=Math.max(y1,p[1]); }));
  const pad=.35, f=n=>n.toFixed(3);
