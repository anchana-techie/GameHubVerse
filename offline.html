<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>No internet · Game Hub</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23181c30'/%3E%3Ctext x='50' y='72' font-size='64' text-anchor='middle'%3E🎮%3C/text%3E%3C/svg%3E">
<!-- Fallback page served by the service worker when Game Hub can't be opened and no saved copy exists yet.
     (Once Game Hub has been opened online one time, the full app opens offline and this page is never needed.) -->
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;color:#eef0ff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    background:radial-gradient(120% 90% at 50% 0%,#1d2350 0%,#0f1220 55%,#070914 100%)}
  .stars{position:fixed;inset:0;pointer-events:none;animation:twk 5s ease-in-out infinite alternate;background-image:
    radial-gradient(1.6px 1.6px at 8% 14%,#fff,transparent),radial-gradient(1.2px 1.2px at 22% 62%,#cfd8ff,transparent),radial-gradient(1.8px 1.8px at 34% 28%,#fff,transparent),
    radial-gradient(1.2px 1.2px at 47% 80%,#ffe9c4,transparent),radial-gradient(1.6px 1.6px at 58% 12%,#fff,transparent),radial-gradient(1.2px 1.2px at 71% 46%,#bfe3ff,transparent),
    radial-gradient(1.8px 1.8px at 83% 22%,#fff,transparent),radial-gradient(1.2px 1.2px at 91% 72%,#cfd8ff,transparent),radial-gradient(1.4px 1.4px at 15% 88%,#fff,transparent)}
  @keyframes twk{from{opacity:.55}to{opacity:1}}
  main{position:relative;max-width:520px;width:100%;text-align:center}
  .art{position:relative;height:200px;display:flex;align-items:center;justify-content:center}
  .astro{width:104px;height:160px;animation:drift 5s ease-in-out infinite}
  @keyframes drift{0%,100%{transform:translateY(0) rotate(-10deg)}50%{transform:translateY(-14px) rotate(8deg)}}
  .sig{position:absolute;right:calc(50% - 150px);top:14px;width:66px;height:66px}
  .pill{display:inline-flex;gap:8px;align-items:center;padding:4px 13px;border-radius:99px;font-size:.85rem;border:1px solid #ff6b81;color:#ff6b81;background:#ffffff10}
  .pill i{width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}
  h1{font-weight:700;font-size:clamp(1.5rem,4.6vw,2.1rem);margin:.5em 0 .1em}
  p{color:#b4bbe3;line-height:1.55;margin:.4em 0 1em}
  button{font:inherit;background:#6c7bff;color:#fff;border:0;border-radius:10px;padding:11px 20px;font-weight:700;cursor:pointer}
  button:hover{filter:brightness(1.1)} button:focus-visible{outline:2px solid #fff;outline-offset:2px}
  .ok{color:#46d6a4}
  @media(prefers-reduced-motion:reduce){.stars,.astro{animation:none}}
</style>
</head>
<body>
<div class="stars"></div>
<main>
  <div class="art">
    <svg class="astro" viewBox="0 0 60 92" aria-hidden="true"><defs><linearGradient id="v" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b4a9a"/><stop offset=".55" stop-color="#151a45"/><stop offset="1" stop-color="#0a0d2a"/></linearGradient></defs>
      <rect x="5" y="26" width="17" height="31" rx="6" fill="#aeb6c8"/><rect x="22" y="56" width="10" height="23" rx="5" fill="#6c7bff"/><rect x="32" y="56" width="10" height="23" rx="5" fill="#6c7bff"/>
      <rect x="20" y="74" width="14" height="10" rx="4.5" fill="#e8ecf6"/><rect x="31" y="74" width="14" height="10" rx="4.5" fill="#e8ecf6"/>
      <rect x="17" y="30" width="29" height="34" rx="12" fill="#6c7bff" stroke="#0003" stroke-width="1.2"/><rect x="26" y="40" width="13" height="10" rx="2.5" fill="#2b3358"/>
      <rect x="11" y="31" width="9" height="24" rx="4.5" fill="#6c7bff"/><rect x="43" y="31" width="9" height="24" rx="4.5" fill="#6c7bff"/>
      <circle cx="32" cy="19" r="17" fill="#f8faff" stroke="#c9d0df" stroke-width="1.2"/><ellipse cx="34" cy="20" rx="12.5" ry="10.8" fill="url(#v)"/>
      <text x="34" y="25.4" font-size="13.5" text-anchor="middle">😶</text></svg>
    <svg class="sig" viewBox="0 0 64 64" fill="none" stroke="#ff6b81" stroke-width="5" stroke-linecap="round" aria-hidden="true"><path d="M8 24c14-12 34-12 48 0"/><path d="M16 34c9-8 23-8 32 0"/><path d="M25 44c4-3 10-3 14 0"/><circle cx="32" cy="53" r="2.5" fill="#ff6b81"/><path d="M8 8l48 48" stroke="#fff"/></svg>
  </div>
  <div class="pill"><i></i> Offline</div>
  <h1>No internet connection</h1>
  <p id="msg">Game Hub hasn't been saved on this device yet, so it can't open without a connection. Connect to the internet and try again – after one successful visit it will open offline too (chess vs the computer and the Number Game even work with no signal).</p>
  <button id="retry" type="button">🔄 Try again</button>
</main>
<script>
  var btn=document.getElementById("retry"), msg=document.getElementById("msg");
  btn.onclick=function(){ btn.disabled=true; btn.textContent="⏳ Checking…"; setTimeout(function(){ location.reload(); },400); };
  window.addEventListener("online",function(){ msg.innerHTML='<span class="ok">✅ You\'re back online – reloading…</span>'; setTimeout(function(){ location.reload(); },600); });
</script>
</body>
</html>
