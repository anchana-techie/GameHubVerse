# Publishes the site (the files in the repo root) to GitHub Pages on every push to main.
# Settings → Pages → Source must be "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stamp the build id (lets open apps notice the update and reload)
        run: |
          V="${GITHUB_SHA::12}"
          sed -i "s/__BUILD__/$V/g" index.html sw.js
          printf '{"v":"%s"}\n' "$V" > version.json
          grep -c "$V" index.html sw.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
