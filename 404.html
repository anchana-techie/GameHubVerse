<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>404 – Page not found · Game Hub</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23181c30'/%3E%3Ctext x='50' y='72' font-size='64' text-anchor='middle'%3E🎮%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
<!-- Static hosts (GitHub Pages, Netlify, …) serve this file for any address that doesn't exist.
     Everything is inline so it still works from deep paths like /foo/bar/baz. -->
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;color:#eef0ff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    background:radial-gradient(120% 90% at 50% 0%,#1d2350 0%,#0f1220 55%,#070914 100%)}
  .stars{position:fixed;inset:0;pointer-events:none;animation:twk 5s ease-in-out infinite alternate;background-image:
    radial-gradient(1.6px 1.6px at 8% 14%,#fff,transparent),radial-gradient(1.2px 1.2px at 22% 62%,#cfd8ff,transparent),radial-gradient(1.8px 1.8px at 34% 28%,#fff,transparent),
    radial-gradient(1.2px 1.2px at 47% 80%,#ffe9c4,transparent),radial-gradient(1.6px 1.6px at 58% 12%,#fff,transparent),radial-gradient(1.2px 1.2px at 71% 46%,#bfe3ff,transparent),
    radial-gradient(1.8px 1.8px at 83% 22%,#fff,transparent),radial-gradient(1.2px 1.2px at 91% 72%,#cfd8ff,transparent),radial-gradient(1.4px 1.4px at 15% 88%,#fff,transparent),
    radial-gradient(1.2px 1.2px at 66% 90%,#fff,transparent),radial-gradient(1.4px 1.4px at 40% 6%,#ffd9a8,transparent),radial-gradient(1.2px 1.2px at 96% 40%,#fff,transparent)}
  @keyframes twk{from{opacity:.55}to{opacity:1}}
  main{position:relative;max-width:540px;width:100%;text-align:center}
  .code{display:flex;align-items:center;justify-content:center;gap:6px;font-family:"Fredoka",system-ui,sans-serif;font-weight:700;font-size:clamp(88px,22vw,150px);line-height:1;
    background:linear-gradient(180deg,#fff 10%,#6c7bff);-webkit-background-clip:text;background-clip:text;color:transparent;margin-top:40px}
  .o{position:relative;width:.78em;height:.78em;display:inline-block}
  .o i{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 32% 28%,#8fa0ff,#4452c9 55%,#161a52);box-shadow:0 0 30px #6c7bff77}
  .o b{position:absolute;left:-24%;right:-24%;top:42%;height:16%;border:3px solid #cfd8ff99;border-radius:50%;transform:rotate(-16deg);border-left-color:transparent}
  .astro{position:absolute;left:calc(50% - 31px);top:-92px;width:62px;height:96px;animation:bob 3s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-8px) rotate(6deg)}}
  h1{font-family:"Fredoka",system-ui,sans-serif;font-weight:600;font-size:clamp(1.5rem,4.6vw,2.1rem);margin:.5em 0 .1em}
  p{color:#b4bbe3;line-height:1.55;margin:.4em 0 1em}
  code{background:#ffffff14;border-radius:6px;padding:1px 7px;font-size:.9em;word-break:break-all}
  a.btn{display:inline-block;background:#46d6a4;color:#0b2a20;border-radius:10px;padding:11px 20px;font-weight:700;text-decoration:none;margin-top:8px}
  a.btn:hover{filter:brightness(1.1)} a.btn:focus-visible{outline:2px solid #fff;outline-offset:2px}
  @media(prefers-reduced-motion:reduce){.stars,.astro{animation:none}}
</style>
</head>
<body>
<div class="stars"></div>
<main>
  <div class="code"><span>4</span><span class="o"><i></i><b></b>
    <svg class="astro" viewBox="0 0 60 92" aria-hidden="true"><defs><linearGradient id="v" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b4a9a"/><stop offset=".55" stop-color="#151a45"/><stop offset="1" stop-color="#0a0d2a"/></linearGradient></defs>
      <rect x="5" y="26" width="17" height="31" rx="6" fill="#aeb6c8"/><rect x="22" y="56" width="10" height="23" rx="5" fill="#ffcc66"/><rect x="32" y="56" width="10" height="23" rx="5" fill="#ffcc66"/>
      <rect x="20" y="74" width="14" height="10" rx="4.5" fill="#e8ecf6"/><rect x="31" y="74" width="14" height="10" rx="4.5" fill="#e8ecf6"/>
      <rect x="17" y="30" width="29" height="34" rx="12" fill="#ffcc66" stroke="#0003" stroke-width="1.2"/><rect x="26" y="40" width="13" height="10" rx="2.5" fill="#2b3358"/>
      <rect x="11" y="31" width="9" height="24" rx="4.5" fill="#ffcc66"/><rect x="43" y="31" width="9" height="24" rx="4.5" fill="#ffcc66"/>
      <circle cx="32" cy="19" r="17" fill="#f8faff" stroke="#c9d0df" stroke-width="1.2"/><ellipse cx="34" cy="20" rx="12.5" ry="10.8" fill="url(#v)"/>
      <text x="34" y="25.4" font-size="13.5" text-anchor="middle">🧐</text></svg>
  </span><span>4</span></div>
  <h1>Houston, this page doesn't exist</h1>
  <p>We searched the whole galaxy for <code id="path">this address</code> but it isn't part of Game Hub. The link may be mistyped or out of date.</p>
  <a class="btn" id="home" href="/">🏠 Back to the hub</a>
</main>
<script>
  // Works on a domain root and on GitHub Pages project sites (user.github.io/repo/…).
  (function(){
    var p=location.pathname, root="/";
    if(/\.github\.io$/.test(location.hostname)){ var seg=p.split("/")[1]; if(seg) root="/"+seg+"/"; }
    document.getElementById("home").href=root;
    document.getElementById("path").textContent=p+location.search;
  })();
</script>
</body>
</html>
